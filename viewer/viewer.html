<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PodPrompt</title>

<!-- Applies saved font-size/width/theme before first paint, so there's no
     flash of default sizing on load. Kept intentionally tiny and dependency-free. -->
<script>
(function() {
  try {
    var s = JSON.parse(localStorage.getItem('viewerSettings') || '{}');
    var root = document.documentElement;
    if (s.fontSize) root.style.setProperty('--font-size', s.fontSize + 'px');
    if (s.width) root.style.setProperty('--content-width', s.width + 'px');
    if (s.theme === 'light') root.setAttribute('data-theme', 'light');
  } catch (e) {}
})();
</script>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<!-- marked (markdown) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

<!-- highlight.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
  /* ── Design tokens ─────────────────────────────────────────────────── */
  :root {
    --bg:        #0f1117;
    --surface:   #181c27;
    --border:    #252a38;
    --text:      #d4d8e8;
    --muted:     #5a617a;
    --accent:    #5b8dee;
    --user-bg:   #1a1f2e;
    --user-border: #2a3050;
    --assistant-bg: #181c27;
    --code-bg:   #12151f;
    --green:     #4ade80;
    --purple:    #a78bfa;
    --opencode-accent: #2dd4bf;
    --heading:   #eef0f8;
    --em-color:  #b0bcd8;
    --inline-code-color: #a5b4fc;
    --zebra-row: rgba(255,255,255,.02);
    --sans: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --radius: 10px;
    --font-size: 15px;
    --content-width: 860px;
    --label-font-size: 11px;
    --status-font-size: 12px;
  }

  /* ── Light theme override ─────────────────────────────────────────── */
  /* Values chosen for the same WCAG-friendly contrast a dark-on-light chat
     UI needs (headings/code darker than body text, not near-white
     accents carried over unchanged from the dark palette). */
  :root[data-theme="light"] {
    --bg:        #f4f5fa;
    --surface:   #ffffff;
    --border:    #e1e4ee;
    --text:      #1d2233;
    --muted:     #5b6478;
    --accent:    #3b6fe0;
    --user-bg:   #eaeefb;
    --user-border: #c7d2f4;
    --assistant-bg: #ffffff;
    --code-bg:   #f0f1f6;
    --green:     #15803d;
    --purple:    #7c3aed;
    --opencode-accent: #0d9488;
    --heading:   #10131f;
    --em-color:  #475569;
    --inline-code-color: #4338ca;
    --zebra-row: rgba(15,23,42,.035);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: var(--font-size);
    line-height: 1.65;
  }

  /* ── Layout ────────────────────────────────────────────────────────── */
  #app {
    display: grid;
    grid-template-rows: 48px 1fr auto;
    height: 100vh;
    max-width: var(--content-width);
    margin: 0 auto;
    position: relative;
  }

  /* ── Header ────────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .02em;
  }
  header .logo {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .85;
    flex-shrink: 0;
    transition: background .25s ease;
  }
  /* Per-backend dot color — set via updateBackendIndicator() whenever the
     viewed session's backend is known; falls back to the base --accent
     color above (unchanged from before this existed) while unresolved. */
  header .logo.backend-claude-code { background: var(--accent); }
  header .logo.backend-opencode    { background: var(--opencode-accent); }
  header span { flex: 1; }
  /* ── Backend badge (next to the app title) ────────────────────────────
     Empty/hidden until updateBackendIndicator() knows the viewed session's
     backend (see the same function that colors header .logo above) — a
     freshly-loaded page with no session open yet shows just the bare app
     name, not a stale or default backend label. */
  #backend-badge {
    font-size: .78em;
    font-weight: 400;
    color: var(--muted);
    opacity: .8;
  }
  #backend-badge:empty { display: none; }
  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  #status-dot.live  { background: var(--green); }
  #status-dot.error { background: #f87171; }

  /* ── Context-usage bar (both backends) + plan/spend indicator ───────── */
  /* Hidden until the first context_usage/plan_usage/spend status arrives
     for the currently-viewed session — see the SSE 'status' handler — and
     reset back to hidden on every session switch (viewSession()), so a
     freshly-opened chat never shows a stale reading left over from
     whatever session was viewed before it. */
  #context-usage-wrap {
    display: none;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  #context-usage-wrap.show { display: flex; }
  #context-usage-bar {
    width: 56px;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
  }
  #context-usage-fill {
    height: 100%;
    width: 0%;
    background: var(--green);
    transition: width .4s ease, background .3s ease;
  }
  #context-usage-fill.warn { background: #f59e0b; }
  #context-usage-fill.crit { background: #f87171; }
  /* Actively compacting overrides the percentage color with a pulsing
     accent — a distinct visual state from "just a high percentage",
     mirroring the TUI's own compacting-in-progress display. */
  #context-usage-fill.compacting {
    background: var(--accent) !important;
    animation: compacting-pulse 1.2s ease-in-out infinite;
  }
  @keyframes compacting-pulse { 50% { opacity: .3; } }
  #context-usage-label { font-size: 11px; color: var(--muted); white-space: nowrap; }

  #plan-usage-wrap {
    display: none;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  /* Deliberately the same red as #context-usage-fill.crit, for the same
     "you're in trouble" meaning — but no intermediate amber tier here (see
     the plan_usage handler below for why: this is a plain-text label, not a
     fill bar, so a single normal/warning state reads more cleanly than a
     three-stage gradient would). */
  #plan-usage-wrap.warn { color: #f87171; }
  #plan-usage-wrap.show { display: block; }

  header button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 5px 7px;
    border-radius: 6px;
  }
  header button:hover { background: var(--border); color: var(--text); }

  /* ── Settings panel ────────────────────────────────────────────────── */
  /* Was a single 230px column of ~14 rows — taller than most browser
     windows. Now a fixed-size grid of column groups (see .settings-columns
     below) so it grows wide instead of tall; #settings-panel itself still
     caps its own height and scrolls internally (max-height/overflow-y) as a
     backstop, since a future added row/group could still push total content
     past viewport height even in a 2-column layout, and a panel with no
     escape hatch that overflows off the bottom of the screen is worse than
     one that merely scrolls. */
  #settings-panel {
    display: none;
    position: absolute;
    top: 48px;
    right: 20px;
    width: 460px;
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 64px);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 20;
  }
  #settings-panel.open { display: block; }
  .settings-columns {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0 24px;
  }
  /* Narrow windows (or this panel's own max-width kicking in) collapse back
     to one column rather than squeezing two columns into too little space
     — the same reason max-width above exists: nothing here should ever be
     able to push content past the viewport's edge. */
  @media (max-width: 520px) {
    .settings-columns { grid-template-columns: 1fr; }
  }
  .settings-col {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
  }
  .settings-group { min-width: 0; }
  .settings-row { margin-bottom: 14px; font-size: 13px; min-width: 0; }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .settings-row input[type="range"] { width: 100%; margin-top: 6px; }
  .settings-row .row-value { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Rows whose control is a <select>: stacked (label text above, select
     below spanning the full row width) rather than side-by-side. A
     <select> sizes itself to its longest <option> text regardless of
     flexbox shrink rules in every browser tested, which is exactly what
     used to push one of these past the panel's right edge under the old
     side-by-side layout — width:100% on a full-width block below the label
     can't overflow the row no matter how long its options' text is. */
  .settings-row.select-row label {
    display: block;
  }
  .settings-row.select-row label > span { display: block; margin-bottom: 4px; }
  .settings-row select {
    background: var(--code-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 12px;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  .settings-row.disabled label { opacity: .45; }
  .settings-group-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 8px;
  }

  /* ── Sessions panel ────────────────────────────────────────────────── */
  #sessions-panel {
    display: none;
    position: absolute;
    top: 48px;
    left: 20px;
    width: 280px;
    max-height: 70vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 20;
    overflow: hidden;
    flex-direction: column;
  }
  #sessions-panel.open { display: flex; }
  #sessions-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  #new-chat-wrap { position: relative; }
  #new-chat-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    text-transform: none;
    letter-spacing: normal;
    font-weight: 600;
    cursor: pointer;
  }

  /* New-chat project picker: which project (existing, or a freshly typed
     subdirectory) the new session should start in. Defaults effectively to
     "just continue in the current project" — that row is listed first and
     marked, so the zero-effort case is still just one extra click, not a
     detour, while the deliberate cross-project case is right there too. */
  #new-chat-picker {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    width: 260px;
    max-height: 280px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 25;
    text-transform: none;
    letter-spacing: normal;
    font-weight: 400;
  }
  #new-chat-picker.show { display: block; }
  .new-chat-backend-row {
    display: flex;
    gap: 6px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  .new-chat-backend-btn {
    flex: 1;
    padding: 5px 8px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
  }
  .new-chat-backend-btn:hover { border-color: var(--accent); }
  .new-chat-backend-btn.selected {
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .new-chat-project-item {
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .new-chat-project-item:hover { background: var(--code-bg); }
  .new-chat-project-item.current { color: var(--accent); font-weight: 600; }
  .new-chat-custom-row { padding: 8px 14px; }
  .new-chat-custom-row input {
    width: 100%;
    background: var(--code-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: var(--mono);
  }
  #sessions-view-toggle {
    display: flex;
    gap: 2px;
    padding: 8px 14px 0;
  }
  .sessions-tab {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 5px 10px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
  }
  .sessions-tab.active { color: var(--accent); background: var(--code-bg); }

  #sessions-list { overflow-y: auto; }
  .session-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    position: relative;
  }
  .session-item:last-child { border-bottom: none; }
  .session-item:hover { background: var(--code-bg); }
  .session-item.current { background: var(--code-bg); border-left: 3px solid var(--accent); }
  .session-title {
    font-size: 13px;
    color: var(--text);
    padding-right: 60px; /* room for hover actions */
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0; /* required for the text child's overflow/ellipsis to work inside a flex parent */
  }
  /* The truncatable part of the title lives in its own flex child now —
     .session-title itself used to carry white-space:nowrap/overflow:hidden/
     text-overflow:ellipsis directly, with the badge appended as a plain
     trailing text-node sibling. That meant a long enough title (anything
     that actually needed the ellipsis) clipped the badge right along with
     the truncated text, since both were just inline content in the same
     nowrap box — a short title like "TRUMPET" happened to never trigger
     it. Isolating truncation to this span and giving the badge
     flex-shrink:0 below means the badge always renders regardless of
     title length or which side it's placed on (see badgePosition
     setting). */
  .session-title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    /* flex-grow: 0 (not 1) is deliberate: growing to fill the row would be
       visually invisible in "before" placement (nothing marks the box's
       edge), but in "after" placement it drags the badge all the way to
       the far edge even for a short title like "TRUMPET" that never
       needed the space — looking detached from its own title. flex-
       shrink: 1 (via the "auto" below) still lets a long title shrink
       down to the available width and truncate exactly as before; it
       just no longer expands past its own content when it doesn't need
       to. */
    flex: 0 1 auto;
  }
  .session-title-input {
    font-size: 13px;
    font-family: var(--sans);
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 4px;
    width: calc(100% - 8px);
  }
  .session-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Cross-session awareness: visible without switching to that session.
     A pending decision (permission or question) takes visual priority over
     a plain inFlight dot (still just running) — it's more actionable, and
     the two decision kinds get distinct colors/tooltips rather than one
     generic "permission" badge for both, since a question isn't actually a
     permission at all. */
  .session-badge {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0; /* never let the title text's overflow squeeze this out */
    background: var(--green);
  }
  .session-badge.needs-permission {
    background: var(--accent);
    animation: badge-pulse 1.4s ease-in-out infinite;
  }
  .session-badge.needs-question {
    background: var(--purple);
    animation: badge-pulse 1.4s ease-in-out infinite;
  }
  @keyframes badge-pulse { 50% { opacity: .35; } }

  /* Grouped-by-project layout: a section header per project, sorted (like
     the flat view) by that group's own most-recent session. */
  .session-group-header {
    padding: 8px 14px 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }

  /* Unreachable sessions (project directory no longer resolves — see the
     'Unreachable sessions' setting): visibly inert, not just dim text —
     there's genuinely nothing to click here, unlike every other row. */
  .session-item.session-unreachable {
    cursor: default;
    opacity: .55;
  }
  .session-item.session-unreachable:hover { background: none; }
  .unreachable-note {
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    border-top: 1px solid var(--border);
  }

  /* Open-in-new-tab affordance, separate from the main clickable row (which
     stays a plain div with its own click handler) rather than making the
     whole row an <a> — the row already nests interactive children
     (rename-on-dblclick, archive/delete buttons), and anchors with nested
     interactive elements are a real minefield for click/navigation
     semantics; a small dedicated link sidesteps all of that. */
  .session-open-tab {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .session-open-tab:hover { color: var(--text); background: var(--border); }

  .session-actions {
    position: absolute;
    top: 8px;
    right: 10px;
    display: none;
    gap: 4px;
  }
  .session-item:hover .session-actions { display: flex; }
  .session-action-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 11px;
    cursor: pointer;
  }
  .session-action-btn:hover { border-color: var(--accent); color: var(--text); }
  .session-action-btn.session-delete-btn:hover { border-color: #f87171; color: #f87171; }
  .session-action-btn:disabled { opacity: .35; cursor: not-allowed; }
  .session-action-btn:disabled:hover { border-color: var(--border); color: var(--muted); }

  /* ── Message feed ──────────────────────────────────────────────────── */
  #feed {
    position: relative;
    overflow-y: auto;
    padding: 28px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    /* scroll-behavior is set from JS (applySettings) per the "Auto-scroll
       animation" setting, not hardcoded here — see the autoscroll-anim
       select and the pinnedToBottom/autoScrolling logic near scrollBottom(). */
  }
  #feed::-webkit-scrollbar { width: 6px; }
  #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  #new-pill {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    display: none;
    z-index: 15;
  }
  #new-pill.show { display: block; }

  /* ── Turn-in-flight indicator + backend controls row ─────────────────── */
  /* One shared flex row, directly above #input-bar: the ephemeral
     "Thinking…" / "Running `Bash`… (12s)" turn-indicator on the left (same
     position/behavior as before this row existed — it just no longer gets
     a whole line to itself), model/mode switchers + the auto-approve
     checkbox right-aligned on the SAME line. #turn-indicator takes the
     available space (flex:1) so it can still wrap/ellipsize independently
     without pushing the controls off to the right when both are showing
     at once (a long "Running `SomeVeryLongToolName`…" line alongside an
     active auto-approve checkbox, say). */
  /* No justify-content: space-between here — with #turn-indicator hidden
     (display:none, its default state whenever no turn is running), it's
     not a flex item at all, which left #controls-row as space-between's
     lone child and sitting at the main-start (left) instead of the right —
     the "auto-approve dances between left and right" bug. #controls-row's
     own margin-left:auto below is what pins it to the right edge
     unconditionally, regardless of whether the indicator is present. */
  #status-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 20px 0;
  }
  #turn-indicator {
    display: none;
    flex: 1;
    min-width: 0;
    font-size: var(--status-font-size);
    color: var(--muted);
    font-style: italic;
  }
  #turn-indicator.show { display: block; }

  /* ── Backend controls row (model/mode switchers, auto-approve) ───────── */
  /* Each <select> stays hidden (not just empty) whenever the active
     session's backend has no such concept at all (e.g. Claude Code has no
     mode/agent concept) rather than showing an empty, useless dropdown —
     see loadModes()/loadModels(). Font-size is the same --status-font-size
     variable #turn-indicator uses (and the existing "Status text size"
     settings slider already controls) rather than a hardcoded size, so the
     two visually match and stay in sync with that setting automatically. */
  #controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-left: auto; /* always pinned right, independent of #turn-indicator's visibility */
    font-size: var(--status-font-size);
    color: var(--muted);
  }
  #controls-row select {
    display: none;
    background: var(--code-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: var(--status-font-size);
    max-width: 220px;
  }
  #controls-row select.show { display: inline-block; }
  #auto-approve-row {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
  }
  #auto-approve-row input[type="checkbox"] {
    width: 1.15em;
    height: 1.15em;
  }
  /* Deliberately the same amber used for the context-usage warning
     threshold — both are "pay attention" states, not errors. */
  #auto-approve-row.active { color: #f59e0b; font-weight: 600; }

  /* ── Input bar ─────────────────────────────────────────────────────── */
  #input-bar {
    position: relative;
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    background: var(--bg);
  }
  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #palette-btn, #stop-btn, #send-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  #palette-btn { font-family: var(--mono); padding: 9px 12px; }
  #send-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
  #send-btn:disabled, #palette-btn:disabled { opacity: .5; cursor: not-allowed; }
  #stop-btn { background: #f87171; border-color: #f87171; color: #fff; display: none; }
  #stop-btn.show { display: block; }
  #send-btn.hide-for-stop { display: none; }

  #prompt-input {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 200px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--sans);
    font-size: var(--font-size);
    line-height: 1.4;
  }
  #prompt-input:disabled { opacity: .6; }
  #prompt-input:focus { outline: 1px solid var(--accent); }

  /* ── Command palette ──────────────────────────────────────────────── */
  #palette-dropdown {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 20px;
    right: 20px;
    max-height: 260px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #palette-dropdown.show { display: block; }
  .palette-item {
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .palette-item:last-child { border-bottom: none; }
  .palette-item:hover { background: var(--code-bg); }
  .palette-empty { padding: 10px 14px; color: var(--muted); font-size: 13px; }

  /* ── Permission / question cards ──────────────────────────────────── */
  .perm-card { display: flex; flex-direction: column; gap: 10px; }
  .perm-q-text { font-weight: 600; color: var(--heading); }
  .perm-tool-summary {
    font-family: var(--mono);
    font-size: .85em;
    color: var(--muted);
  }
  .perm-question { display: flex; flex-direction: column; gap: 6px; }
  .perm-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .perm-option-btn {
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .perm-option-btn:hover { border-color: var(--accent); }
  .perm-option-btn.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .perm-option-btn.perm-allow:hover { border-color: var(--green); }
  .perm-option-btn.perm-deny:hover { border-color: #f87171; }
  .perm-submit-btn {
    align-self: flex-start;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .perm-submit-btn:disabled { opacity: .4; cursor: not-allowed; }
  .perm-resolved { color: var(--muted); font-size: .9em; font-style: italic; }
  /* "Other…" always sits alongside whatever fixed options the model
     supplied, matching the real AskUserQuestion tool's guaranteed free-text
     escape hatch — dashed border sets it apart from the fixed choices. */
  .perm-option-btn.perm-other-btn { border-style: dashed; }
  .perm-other-textarea {
    display: none;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text);
    border-radius: 7px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    resize: none;
    max-height: 200px;
    overflow-y: auto;
  }
  .perm-other-textarea.show { display: block; }
  .perm-other-textarea:focus { outline: none; border-color: var(--accent); }

  /* ── Message bubble ─────────────────────────────────────────────────── */
  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fadein .2s ease;
    position: relative;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }

  .msg-label {
    font-size: var(--label-font-size);
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 4px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .msg-label .ts {
    font-size: .9em;
    font-weight: 400;
    letter-spacing: normal;
    text-transform: none;
    color: var(--muted);
    opacity: .7;
  }
  .msg-label .model {
    font-size: .9em;
    font-weight: 500;
    letter-spacing: normal;
    text-transform: none;
    color: var(--muted);
    opacity: .8;
    margin-left: 0px;
    margin-right: 0px;
  }
  .msg-label .model:empty { display: none; }
  .msg-label .ts:empty { display: none; }
  .msg.user   .msg-label { color: var(--accent); }
  .msg.assistant .msg-label { color: var(--muted); }
  .msg.tool   .msg-label { color: var(--green); }
  .msg.agent  .msg-label { color: var(--purple); }
  .msg.thinking .msg-label { color: var(--purple); }
  .msg.permission .msg-label { color: var(--accent); }
  .msg.permission .msg-body { border-color: var(--accent); }
  .msg.hidden-empty { display: none; }

  /* thinking blocks: distinct from assistant text, subdued/italic like the
     TUI's collapsed thinking display. Content is plain text, streamed by
     appending (never markdown/KaTeX-parsed — a long reasoning transcript
     stays boxed, styled, capped and scrollable instead of re-rendering
     per token). Three gear-menu modes select the element's classes here:
       hide     -> .hidden-thought        (not rendered at all)
       collapse -> no .expanded, body hidden until the header is clicked
       show     -> .expanded, body visible, capped like long tool diffs */
  .msg.thinking .msg-body {
    display: none;
    font-style: italic;
    color: var(--muted);
    background: var(--code-bg);
    padding: 8px 14px;
    font-size: .9em;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
  }
  .msg.thinking.expanded .msg-body { display: block; }
  .msg.thinking.hidden-thought { display: none; }
  .msg.thinking .msg-think-toggle {
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }
  .msg.thinking .msg-think-toggle::before { content: '▸ '; }
  .msg.thinking.expanded .msg-think-toggle::before { content: '▾ '; }
  .msg.thinking .msg-think-toggle:hover { text-decoration: underline; }
  .msg.thinking .msg-label .ts { margin-left: auto; }
  .msg.thinking .msg-think-toggle .model { color: var(--muted); opacity: .8; margin-left: 0; margin-right: 0; }

  /* per-delta streaming: raw text appended into the bubble (no full
     markdown re-render per token — that re-flows the whole bubble every
     chunk and makes long streams janky). Finalize swaps to a clean render. */
  .msg-body.raw { white-space: pre-wrap; }

  /* tool bubbles can now hold real diffs (Edit/Write), not just a one-liner —
     cap height so a huge diff doesn't dominate the feed */
  .msg.tool .msg-body pre { max-height: 400px; overflow-y: auto; }

  /* whole-message copy button (assistant only) */
  .msg-copy-btn {
    position: absolute;
    top: 22px;
    right: 0;
    background: var(--border);
    color: var(--muted);
    border: none;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
  }
  .msg.assistant:hover .msg-copy-btn { opacity: 1; }
  .msg-copy-btn:hover { background: var(--accent); color: #fff; }

  /* agent report: raw, collapsed by default */
  .agent-summary {
    cursor: pointer;
    color: var(--muted);
    font-size: .85em;
    user-select: none;
  }
  .agent-raw {
    display: none;
    white-space: pre-wrap;
    font-family: var(--mono);
    font-size: .82em;
    color: var(--muted);
    margin-top: 10px;
  }
  .agent-body.expanded .agent-raw { display: block; }

  .msg-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    line-height: 1.7;
  }
  .msg.user .msg-body {
    background: var(--user-bg);
    border-color: var(--user-border);
  }
  /* tool blocks: same three gear-menu modes as thinking blocks above, via
     the same class mechanism:
       hide     -> .hidden-tool          (not rendered at all)
       collapse -> no .expanded, body hidden until the header is clicked
       show     -> .expanded, body visible, diffs capped and scrollable */
  .msg.tool .msg-body {
    display: none;
    padding: 8px 14px;
    font-size: .88em;
    color: var(--muted);
    background: var(--code-bg);
    /* renderToolBody() emits plain escaped text outside of fenced code
       blocks (no <p>/<br> from marked anymore) — this is what keeps its
       own newlines (e.g. a multi-line one-off summary) visible. */
    white-space: pre-wrap;
  }
  .msg.tool.expanded .msg-body { display: block; }
  .msg.tool.hidden-tool { display: none; }
  .msg.tool .msg-tool-toggle {
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }
  .msg.tool .msg-tool-toggle::before { content: '▸ '; }
  .msg.tool.expanded .msg-tool-toggle::before { content: '▾ '; }
  .msg.tool .msg-tool-toggle:hover { text-decoration: underline; }
  .msg.tool .msg-tool-toggle .model { color: var(--muted); opacity: .8; margin-left: 0; margin-right: 0; }
  .msg.tool .msg-label .ts { margin-left: auto; }
  .msg.tool .msg-body p { margin: 0; } /* dead now marked.parse() no longer runs here; harmless if a stray <p> ever appears */

  /* streaming cursor */
  .msg-body.streaming::after {
    content: '▋';
    display: inline;
    color: var(--accent);
    animation: blink .8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Markdown inside bubbles ────────────────────────────────────────── */
  .msg-body h1, .msg-body h2, .msg-body h3 {
    font-weight: 600;
    margin: 1.1em 0 .5em;
    color: var(--heading);
  }
  .msg-body h1 { font-size: 1.3em; }
  .msg-body h2 { font-size: 1.15em; }
  .msg-body h3 { font-size: 1em; }
  .msg-body p  { margin: .6em 0; }
  .msg-body ul, .msg-body ol { padding-left: 1.4em; margin: .6em 0; }
  .msg-body li { margin: .3em 0; }

  .msg-body strong { color: var(--heading); font-weight: 600; }
  .msg-body em { color: var(--em-color); }
  .msg-body a  { color: var(--accent); text-decoration: none; }
  .msg-body a:hover { text-decoration: underline; }
  .msg-body hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* inline code */
  .msg-body code:not(pre code) {
    font-family: var(--mono);
    font-size: .875em;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--inline-code-color);
  }

  /* fenced code blocks */
  .msg-body pre {
    background: var(--code-bg) !important;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: .8em 0;
    position: relative;
  }
  .msg-body pre code {
    font-family: var(--mono);
    font-size: .82em;
    background: none !important;
    border: none !important;
    padding: 0 !important;
    color: inherit;
  }

  /* copy button */
  .copy-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--border);
    color: var(--muted);
    border: none;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
  }
  .msg-body pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--accent); color: #fff; }

  /* ── KaTeX overrides ────────────────────────────────────────────────── */
  .katex-display {
    overflow-x: auto;
    padding: 6px 0;
    margin: .8em 0 !important;
  }
  .katex { font-size: 1.05em; }

  /* ── Empty state ────────────────────────────────────────────────────── */
  #empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }
  #empty .icon {
    font-size: 36px;
    opacity: .4;
  }
  #empty code {
    font-family: var(--mono);
    font-size: .85em;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
  }

  /* ── Blockquote ─────────────────────────────────────────────────────── */
  .msg-body blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 14px;
    color: var(--muted);
    margin: .6em 0;
  }

  /* ── Table ──────────────────────────────────────────────────────────── */
  .msg-body table {
    border-collapse: collapse;
    width: 100%;
    margin: .8em 0;
    font-size: .9em;
  }
  .msg-body th, .msg-body td {
    border: 1px solid var(--border);
    padding: 7px 12px;
    text-align: left;
  }
  .msg-body th { background: var(--code-bg); color: var(--heading); font-weight: 600; }
  .msg-body tr:nth-child(even) td { background: var(--zebra-row); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="sessions-btn" title="Sessions">☰</button>
    <div class="logo" id="app-logo"></div>
    <span id="app-title-wrap">PodPrompt<span id="backend-badge"></span></span>
    <div id="context-usage-wrap" title="Context window usage">
      <div id="context-usage-bar"><div id="context-usage-fill"></div></div>
      <div id="context-usage-label"></div>
    </div>
    <div id="plan-usage-wrap"></div>
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-label">connecting…</span>
    </div>
    <button id="export-btn" title="Export conversation as Markdown">⬇</button>
    <button id="settings-btn" title="Settings">⚙</button>
  </header>

  <div id="sessions-panel">
    <div id="sessions-panel-header">
      <span>Sessions</span>
      <div id="new-chat-wrap">
        <button id="new-chat-btn">+ New chat</button>
        <div id="new-chat-picker"></div>
      </div>
    </div>
    <div id="sessions-view-toggle">
      <button class="sessions-tab active" data-view="active">Active</button>
      <button class="sessions-tab" data-view="archived">Archived</button>
    </div>
    <div id="sessions-list"></div>
  </div>

  <div id="settings-panel">
    <div class="settings-columns">
      <div class="settings-col">
        <div class="settings-group">
          <div class="settings-group-title">Display</div>
          <div class="settings-row">
            <label>Font size <span class="row-value" id="font-size-val">15px</span></label>
            <input type="range" id="font-size-slider" min="8" max="40" step="1" value="15">
          </div>
          <div class="settings-row">
            <label>Content width <span class="row-value" id="width-val">860px</span></label>
            <input type="range" id="width-slider" min="360" max="2600" step="20" value="860">
          </div>
          <div class="settings-row">
            <label>Label size <span class="row-value" id="label-size-val">11px</span></label>
            <input type="range" id="label-size-slider" min="6" max="32" step="1" value="11">
          </div>
          <div class="settings-row">
            <label>Status text size <span class="row-value" id="status-size-val">12px</span></label>
            <input type="range" id="status-size-slider" min="6" max="32" step="1" value="12">
          </div>
          <div class="settings-row">
            <label><span>Light theme</span> <input type="checkbox" id="theme-toggle"></label>
          </div>
          <div class="settings-row select-row">
            <label><span>Auto-scroll animation</span>
              <select id="autoscroll-anim">
                <option value="smooth" selected>Smooth</option>
                <option value="instant">Instant</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Sessions sort order</span>
              <select id="sessions-sort">
                <option value="created">Created time (default)</option>
                <option value="lastModified">Last modified</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Show model name on</span>
              <select id="show-model-on">
                <option value="model-only" selected>MODEL bubbles only</option>
                <option value="all-bubbles">All bubbles</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Thinking blocks</span>
              <select id="thinking-mode">
                <option value="collapse" selected>Collapsed (click to open)</option>
                <option value="show">Show (streamed, scrollable)</option>
                <option value="hide">Hide</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Tool calls</span>
              <select id="tool-mode">
                <option value="collapse">Collapsed (click to open)</option>
                <option value="show" selected>Show (scrollable)</option>
                <option value="hide">Hide</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="settings-col">
        <div class="settings-group">
          <div class="settings-group-title">Sessions</div>
          <div class="settings-row select-row">
            <label><span>Layout</span>
              <select id="sessions-layout">
                <option value="flat" selected>Flat</option>
                <option value="grouped">Grouped by project</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Unreachable sessions</span>
              <select id="unreachable-mode">
                <option value="hidden">Hidden</option>
                <option value="count" selected>Show count</option>
                <option value="shown">Show, greyed out</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Status badge position</span>
              <select id="badge-position">
                <option value="after" selected>After title</option>
                <option value="before">Before title</option>
              </select>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">Timestamps</div>
          <div class="settings-row select-row">
            <label><span>Format</span>
              <select id="ts-format">
                <option value="hidden">Hidden</option>
                <option value="time" selected>Time only</option>
                <option value="datetime">Date + time</option>
              </select>
            </label>
          </div>
          <div class="settings-row" id="ts-24h-row">
            <label><span>24-hour time</span> <input type="checkbox" id="ts-24h"></label>
          </div>
          <div class="settings-row" id="ts-tz-row">
            <label><span>Show time zone</span> <input type="checkbox" id="ts-tz"></label>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">Usage</div>
          <div class="settings-row select-row">
            <label><span>Reset time format</span>
              <select id="usage-reset-format">
                <option value="absolute" selected>Absolute (e.g. 2:20 PM)</option>
                <option value="relative">Relative (e.g. in 3 hr 31 min)</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="feed">
    <div id="empty">
      <div class="icon">⌨</div>
      <p>Waiting for messages…</p>
      <p>Type a prompt below to get started.</p>
    </div>
  </div>
  <button id="new-pill">↓ New messages</button>
  <div id="status-row">
    <div id="turn-indicator"></div>
    <div id="controls-row">
      <select id="model-select" title="Model"></select>
      <select id="mode-select" title="Agent / mode"></select>
      <label id="auto-approve-row" title="Automatically approve all tool permission requests for this session, until turned back off">
        <input type="checkbox" id="auto-approve-toggle"> Auto-approve
      </label>
    </div>
  </div>

  <div id="input-bar">
    <div id="palette-dropdown"></div>
    <div id="input-row">
      <button id="palette-btn" title="Commands">/</button>
      <textarea id="prompt-input" rows="1" placeholder="Message the agent… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send-btn">Send</button>
      <button id="stop-btn">Stop</button>
    </div>
  </div>
</div>

<script>
// ── marked config ────────────────────────────────────────────────────────────
marked.setOptions({
  breaks: true,
  gfm: true,
});

const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  const language = hljs.getLanguage(lang) ? lang : 'plaintext';
  const highlighted = hljs.highlight(code, { language }).value;
  return `<pre><button class="copy-btn" onclick="copyCode(this)">copy</button><code class="hljs language-${language}">${highlighted}</code></pre>`;
};
marked.use({ renderer });

function copyCode(btn) {
  const code = btn.nextElementSibling.innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'copied!';
    setTimeout(() => btn.textContent = 'copy', 1500);
  });
}

// Tool bubbles are command lines, file paths, and diffs — never meant to go
// through the *prose* markdown pipeline (a stray "**" flag or "_" in a shell
// command/path could get misread as bold/italic, "#" at line-start as a
// heading, etc.). The one deliberate exception is the fenced code block
// formatToolSummary() (driver-side) wraps Edit/MultiEdit/Write diffs in —
// that still gets the same hljs syntax highlighting every other code fence
// gets, just extracted directly here instead of handing the whole bubble to
// marked.parse(), so nothing *outside* the fence is at risk of being
// reinterpreted as markdown. Everything outside a fence is escaped and
// inserted as literal text, unprocessed.
const TOOL_FENCE_RE = /```([^\n`]*)\n([\s\S]*?)```/g;

function renderToolBody(text) {
  let out = '';
  let last = 0;
  let m;
  TOOL_FENCE_RE.lastIndex = 0;
  while ((m = TOOL_FENCE_RE.exec(text))) {
    out += escapeHtml(text.slice(last, m.index));
    const lang = hljs.getLanguage(m[1]) ? m[1] : 'plaintext';
    const highlighted = hljs.highlight(m[2], { language: lang }).value;
    out += `<pre><button class="copy-btn" onclick="copyCode(this)">copy</button><code class="hljs language-${lang}">${highlighted}</code></pre>`;
    last = TOOL_FENCE_RE.lastIndex;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

// ── KaTeX render ─────────────────────────────────────────────────────────────
// Math is extracted and rendered to HTML *before* marked.parse() runs, so
// markdown (in particular `breaks: true`, which turns newlines into <br>)
// can't mangle multi-line LaTeX like \begin{aligned}/\begin{pmatrix}.
let mathStore = [];

function extractMath(text) {
  mathStore = [];
  // Backtick-delimited spans (fenced ```code blocks``` and inline `code`)
  // are matched FIRST and returned untouched, purely to make the regex
  // engine consume and skip past them — this lets someone write out a
  // literal LaTeX-looking string (`$x$`, a ```diff block with a bare $1,
  // etc.) inside code without it being pulled out and rendered as math.
  const pattern = /```[\s\S]*?```|`[^`\n]*?`|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\$\n]+?)\$/g;
  return text.replace(pattern, (match, disp1, disp2, inl1, inl2) => {
    if (disp1 === undefined && disp2 === undefined && inl1 === undefined && inl2 === undefined) {
      return match; // matched a code span/fence, not a math delimiter
    }
    const isDisplay = disp1 !== undefined || disp2 !== undefined;
    const src = disp1 ?? disp2 ?? inl1 ?? inl2;
    const idx = mathStore.push({ src, isDisplay }) - 1;
    return `@@MATH${idx}@@`;
  });
}

function injectMath(html) {
  return html.replace(/@@MATH(\d+)@@/g, (match, i) => {
    const { src, isDisplay } = mathStore[i];
    try {
      return katex.renderToString(src, { displayMode: isDisplay, throwOnError: false });
    } catch (e) {
      return match;
    }
  });
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
const feed   = document.getElementById('feed');
const empty  = document.getElementById('empty');
const dot    = document.getElementById('status-dot');
const label  = document.getElementById('status-label');
const msgs   = {};   // id → { el, rawText, role, tsEl, revealTimer }
const feedOrder = []; // ids in the order they were created, for export

function setStatus(state, text) {
  dot.className = state;
  label.textContent = text;
}

const turnIndicator = document.getElementById('turn-indicator');
const contextUsageWrap  = document.getElementById('context-usage-wrap');
const contextUsageFill  = document.getElementById('context-usage-fill');
const contextUsageLabel = document.getElementById('context-usage-label');
const planUsageWrap     = document.getElementById('plan-usage-wrap');
const modelSelect       = document.getElementById('model-select');
const modeSelect        = document.getElementById('mode-select');
const autoApproveRow    = document.getElementById('auto-approve-row');
const autoApproveToggle = document.getElementById('auto-approve-toggle');

// Whether loadModels()/loadModes() have reached a DEFINITIVE answer for the
// session currently being viewed — either "this backend has no such concept
// at all" (server returns null) or "here's the real list" (a non-empty
// available[]). Deliberately distinct from "got a response": a backend that
// DOES support models/modes can still legitimately answer with an empty
// available[] right after a fresh driver.mjs restart, before any turn
// anywhere has populated its shared, process-wide model/mode cache yet (see
// backends/claude-code.mjs's knownModels) — that's the one case worth
// retrying, since the same session's *next* turn ending is likely to have
// populated it. Once genuinely resolved one way or the other, further
// retries would just be pinging for an answer that isn't going to change.
let modelsResolved = false;
let modesResolved = false;
// Which backend each picker's last successful resolution was fetched for —
// `null` until it resolves, else the exact backend id sent in the request.
// When `undefined` it means the request went out WITHOUT a backend param
// (sessionBackends didn't know it yet at fetch time), i.e. driver.mjs served
// the CLI-default backend for that session — indistinguishable from the
// "wrong backend" bug, so the mismatch resolver below treats it as a
// mismatch too. Compared against backendForCurrentSession() on every
// refreshSessionsList() tick; see resyncPickersIfNeeded().
let modelsResolvedBackend = null;
let modesResolvedBackend = null;

// Open-ended, capped-backoff auto-retry for the empty-available/unavailable/
// unreachable cases below. Retrying solely on turn_end (es.onopen can also
// miss it, see loadDriverConfig) left the picker hidden forever whenever the
// very first answer wasn't resolved AND the user hadn't sent a prompt yet —
// e.g. the opencode backend's /config/providers fetch racing `opencode
// serve`'s bind window right after a container start (the picker simply
// never appeared until a turn completed). This used to give up permanently
// after a fixed handful of attempts; it now keeps retrying, with growing
// backoff, for as long as the session stays unresolved (bounded only by the
// session actually being switched away from — resetBackendControlsDisplay()
// clears these timers/counts on every switch) — a real ceiling now that
// OpenCode's cold start or a crash-and-restart (see driver.mjs) can
// genuinely take longer than any fixed budget accounted for, and the
// "unavailable"/"unreachable" states below are explicitly meant to keep
// waiting rather than dead-end.
const PICKER_RETRY_BASE_MS = 2000;
const PICKER_RETRY_CEILING_MS = 20000;
let modelsRetryCount = 0;
let modesRetryCount = 0;
let modelsRetryTimer = null;
let modesRetryTimer = null;

function nextPickerRetryDelayMs(attempt) {
  return Math.min(PICKER_RETRY_BASE_MS * 2 ** attempt, PICKER_RETRY_CEILING_MS);
}

// Monotonic fetch sequence counters + session-identity capture for
// loadModels()/loadModes(), mirroring refreshSessionsList()'s sessionsFetchSeq
// staleness guard below. Without these, a /models or /modes response for the
// *previous* session could land after a session switch and overwrite the
// picker for whatever session is now being viewed — including flipping the
// one-shot modelsResolved/modesResolved flag for the wrong session, which
// would then block every subsequent fetch until the next full switch.
let modelsFetchSeq = 0;
let modesFetchSeq = 0;

function schedulePickerRetry(kind) {
  if (kind === 'models') {
    if (modelsRetryTimer || modelsResolved) return;
    const delay = nextPickerRetryDelayMs(modelsRetryCount++);
    modelsRetryTimer = setTimeout(() => { modelsRetryTimer = null; loadModels(); }, delay);
  } else {
    if (modesRetryTimer || modesResolved) return;
    const delay = nextPickerRetryDelayMs(modesRetryCount++);
    modesRetryTimer = setTimeout(() => { modesRetryTimer = null; loadModes(); }, delay);
  }
}

// Reset to the "nothing known yet" state — called on every session switch
// (viewSession()) so a freshly-viewed session never shows a stale reading
// left over from whatever was viewed before it, for the brief window
// before that session's own resync (resyncTurnStatus/loadModes/loadModels,
// all called from es.onopen) completes.
function resetBackendControlsDisplay() {
  contextUsageWrap.classList.remove('show');
  contextUsageFill.classList.remove('warn', 'crit', 'compacting');
  planUsageWrap.classList.remove('show');
  lastPlanUsageStatus = null;
  autoApproveToggle.checked = false;
  autoApproveRow.classList.remove('active');
  modelSelect.classList.remove('show');
  modelSelect.innerHTML = '';
  modeSelect.classList.remove('show');
  modeSelect.innerHTML = '';
  modelsResolved = false;
  modesResolved = false;
  modelsResolvedBackend = null;
  modesResolvedBackend = null;
  clearTimeout(modelsRetryTimer); modelsRetryTimer = null;
  clearTimeout(modesRetryTimer); modesRetryTimer = null;
  modelsRetryCount = 0;
  modesRetryCount = 0;
  setModelBlockReason(null);
  // Invalidate any in-flight loadModels()/loadModes() for the session we're
  // leaving, so a stale response can't apply itself to the next session.
  modelsFetchSeq++;
  modesFetchSeq++;
}

function setTurnIndicator(text) {
  if (!text) {
    turnIndicator.classList.remove('show');
    turnIndicator.textContent = '';
    return;
  }
  turnIndicator.textContent = text;
  turnIndicator.classList.add('show');
}

function removeEmpty() {
  if (empty.parentNode) empty.remove();
}

function labelFor(role) {
  if (role === 'user') return 'You';
  if (role === 'tool') return 'Tool';
  // 'agent' is reserved for a future sub-agent bubble type — no backend
  // emits it yet (both backends' plain model-response text uses role
  // 'assistant', which falls through to 'Model' below), but the CSS
  // (.msg.agent) and this label are already wired up for whenever one does.
  if (role === 'agent') return 'Agent';
  if (role === 'thinking') return 'Thinking';
  if (role === 'permission') return 'Permission';
  return 'Model';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTs(iso) {
  if (!iso || settings.tsFormat === 'hidden') return '';
  const opts = { hour: '2-digit', minute: '2-digit', hour12: !settings.hour24 };
  if (settings.tsFormat === 'datetime') {
    opts.year = 'numeric';
    opts.month = 'short';
    opts.day = 'numeric';
  }
  if (settings.showTz) opts.timeZoneName = 'short';
  try {
    return new Date(iso).toLocaleString([], opts);
  } catch (e) {
    return '';
  }
}

// Timestamp settings (format/12h-24h/timezone) apply retroactively, since
// they're cheap to recompute — every rendered message keeps its raw ISO
// string precisely so this can re-derive the display text on demand.
function refreshTimestamps() {
  for (const id of feedOrder) {
    const entry = msgs[id];
    if (entry && entry.tsEl) entry.tsEl.textContent = formatTs(entry.ts);
  }
}

// Show model name on MODEL bubbles
function refreshModelNames() {
  for (const id of feedOrder) {
    const entry = msgs[id];
    if (entry && entry.modelEl) {
      const show = settings.showModelOn === 'all-bubbles' ? entry.role !== 'user' : entry.role === 'assistant';
      if (show && entry.model) {
        entry.modelEl.textContent = entry.model;
      } else {
        entry.modelEl.textContent = '';
      }
    }
  }
}

// Countdown form of a reset timestamp — "in 3 hr 31 min", matching the
// wording Claude Desktop uses for the same underlying data. Deliberately
// not reusing formatTs's opts (12h/24h/tz only make sense for a clock-face
// reading, not a duration) — this is a from-scratch relative render, not a
// variant of it.
function formatRelativeReset(iso) {
  if (!iso) return '';
  const deltaMs = new Date(iso).getTime() - Date.now();
  if (!Number.isFinite(deltaMs)) return '';
  if (deltaMs <= 0) return 'shortly';
  const totalMin = Math.round(deltaMs / 60000);
  const hr = Math.floor(totalMin / 60);
  const min = totalMin % 60;
  if (hr <= 0) return `in ${min} min`;
  if (min === 0) return `in ${hr} hr`;
  return `in ${hr} hr ${min} min`;
}

// Last plan_usage status received for whatever session is currently being
// viewed — kept around (rather than only ever rendering the bar once, when
// the status first arrives) so renderPlanUsage() can be re-run any time
// something that affects its *display* changes without a new turn having
// happened: settings.planResetFormat (absolute/relative) and the same
// tsFormat/hour24/showTz settings the message bubbles use, both handled by
// applySettings() calling this the same way it calls refreshTimestamps().
// Cleared by resetBackendControlsDisplay() on every session switch so a
// settings change made while viewing session B can't redisplay session A's
// stale reading.
let lastPlanUsageStatus = null;

function renderPlanUsage() {
  const s = lastPlanUsageStatus;
  if (!s) return;
  const WARN_THRESHOLD = 70;
  // Not named `window` — that'd shadow the global browser window object.
  const rateWindow = s.rate_limits?.five_hour?.utilization != null
    ? s.rate_limits.five_hour
    : (s.rate_limits?.seven_day?.utilization != null ? s.rate_limits.seven_day : null);
  if (s.subscription_type && rateWindow) {
    const pct = Math.round(rateWindow.utilization);
    const resetStr = rateWindow.resets_at
      ? (settings.planResetFormat === 'relative' ? formatRelativeReset(rateWindow.resets_at) : formatTs(rateWindow.resets_at))
      : '';
    // Percentage always shown now (used to disappear behind just the reset
    // time) — the reset time is appended when available, not swapped in.
    planUsageWrap.textContent = resetStr ? `${pct}% · resets ${resetStr}` : `${pct}%`;
    planUsageWrap.title = `Subscription: ${s.subscription_type} — ${pct}% of usage window used`;
    planUsageWrap.classList.toggle('warn', pct >= WARN_THRESHOLD);
    planUsageWrap.classList.add('show');
  } else {
    planUsageWrap.classList.remove('show');
  }
}

function getOrCreate(id, role) {
  if (msgs[id]) return msgs[id];

  removeEmpty();
  feedOrder.push(id);

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  if (role === 'agent') {
    // Async subagent reports are raw and often long — collapsed by default,
    // click to expand. Rendered as plain text, not markdown, since the
    // content is XML-ish tool output rather than prose.
    wrap.innerHTML = `<div class="msg-label">${labelFor(role)}<span class="model"></span><span class="ts"></span></div>
                      <div class="msg-body agent-body">
                        <div class="agent-summary">▸ agent report — click to expand</div>
                        <pre class="agent-raw"></pre>
                      </div>`;
    const bodyEl = wrap.querySelector('.agent-body');
    bodyEl.querySelector('.agent-summary').addEventListener('click', () => {
      bodyEl.classList.toggle('expanded');
    });
    feed.appendChild(wrap);
    msgs[id] = {
      el: bodyEl,
      rawEl: bodyEl.querySelector('.agent-raw'),
      tsEl: wrap.querySelector('.ts'),
      modelEl: wrap.querySelector('.model'),
      rawText: '', ts: null, role, revealTimer: null, permId: id,
    };
    return msgs[id];
  }

  if (role === 'thinking') {
    // Reasoning/chain-of-thought — never markdown-parsed, never a copy
    // button, and collapsed (or hidden) per settings.thinking. The header is
    // the toggle: click to expand/collapse when in collapse mode.
    wrap.innerHTML = `<div class="msg-label"><span class="msg-think-toggle">Thinking <span class="model"></span><span class="ts"></span></span></div>
                      <div class="msg-body"></div>`;
    wrap.querySelector('.msg-think-toggle').addEventListener('click', () => wrap.classList.toggle('expanded'));
    feed.appendChild(wrap);
    msgs[id] = {
      el: wrap.querySelector('.msg-body'),
      tsEl: wrap.querySelector('.ts'),
      modelEl: wrap.querySelector('.model'),
      rawText: '', ts: null, role, revealTimer: null, permId: id, wrap,
    };
    applyThinkingVisibility(msgs[id]);
    return msgs[id];
  }

  if (role === 'tool') {
    // Tool bubbles follow the same three display modes as thinking blocks
    // (see settings.tools): hidden, collapsed with the header as the toggle,
    // or always-expanded. Content still renders via renderToolBody() so the
    // Edit/MultiEdit/Write diff fences keep their hljs highlighting.
    wrap.innerHTML = `<div class="msg-label"><span class="msg-tool-toggle">Tool <span class="model"></span><span class="ts"></span></span></div>
                      <div class="msg-body"></div>`;
    wrap.querySelector('.msg-tool-toggle').addEventListener('click', () => wrap.classList.toggle('expanded'));
    feed.appendChild(wrap);
    msgs[id] = {
      el: wrap.querySelector('.msg-body'),
      tsEl: wrap.querySelector('.ts'),
      modelEl: wrap.querySelector('.model'),
      rawText: '', ts: null, role, revealTimer: null, permId: id, wrap,
    };
    applyToolsVisibility(msgs[id]);
    return msgs[id];
  }

  wrap.innerHTML = `<div class="msg-label">${labelFor(role)}<span class="model"></span><span class="ts"></span></div>
                    <div class="msg-body${role === 'assistant' ? ' streaming' : ''}"></div>
                    ${role === 'assistant' ? '<button class="msg-copy-btn">copy</button>' : ''}`;
  feed.appendChild(wrap);

  const body = wrap.querySelector('.msg-body');
  msgs[id] = { el: body, tsEl: wrap.querySelector('.ts'), modelEl: wrap.querySelector('.model'), rawText: '', ts: null, role, revealTimer: null, permId: id, model: null, hasVisibleContent: false };

  const copyBtn = wrap.querySelector('.msg-copy-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(msgs[id].rawText || '').then(() => {
        copyBtn.textContent = 'copied!';
        setTimeout(() => copyBtn.textContent = 'copy', 1500);
      });
    });
  }

  return msgs[id];
}

function applyThinkingVisibility(entry) {
  if (!entry || !entry.wrap || entry.role !== 'thinking') return;
  entry.wrap.classList.toggle('hidden-thought', settings.thinking === 'hide');
  if (settings.thinking === 'show') entry.wrap.classList.add('expanded');
  else entry.wrap.classList.remove('expanded');
}

function applyThinkingMode() {
  for (const id of feedOrder) {
    const en = msgs[id];
    if (en && en.role === 'thinking') applyThinkingVisibility(en);
  }
}

function applyToolsVisibility(entry) {
  if (!entry || !entry.wrap || entry.role !== 'tool') return;
  entry.wrap.classList.toggle('hidden-tool', settings.tools === 'hide');
  if (settings.tools === 'show') entry.wrap.classList.add('expanded');
  else entry.wrap.classList.remove('expanded');
}

function applyToolsMode() {
  for (const id of feedOrder) {
    const en = msgs[id];
    if (en && en.role === 'tool') applyToolsVisibility(en);
  }
}

function renderBody(entry) {
  if (entry.role === 'thinking') {
    // Plain text, never marked.parse() — reasoning is streamed verbatim and
    // must keep its exact whitespace/line breaks through every delta.
    entry.el.classList.remove('streaming');
    entry.el.textContent = entry.rawText || '';
    return;
  }
  if (entry.role === 'agent') {
    entry.rawEl.textContent = entry.rawText || '';
    return;
  }
  if (entry.role === 'permission') {
    renderPermissionCard(entry);
    return;
  }
  if (entry.role === 'tool') {
    // No math extraction and no marked.parse() here at all — see
    // renderToolBody() above for why (bare `$` in shell params/diffs isn't
    // LaTeX, and prose markdown constructs shouldn't apply to command
    // output/paths). Fenced code (the Edit/MultiEdit/Write diff blocks)
    // still gets hljs syntax highlighting via renderToolBody()'s own
    // fence extraction.
    entry.el.innerHTML = renderToolBody(entry.rawText || '');
    return;
  }
  const html = marked.parse(extractMath(entry.rawText || ''));
  entry.el.innerHTML = injectMath(html);
}

// Live-formats a streaming bubble (markdown/KaTeX/hljs via renderBody, same
// as a finished message) instead of leaving it as an unformatted text dump
// until the turn ends — restores pre-existing behavior a prior fix
// regressed (that fix appended raw text nodes per delta and only ever
// called renderBody() once, at finalize, specifically to stop re-running
// marked.parse()+hljs.highlight() on the WHOLE accumulated bubble on every
// single token, which was the real source of a different choppiness
// complaint). The fix for that problem doesn't require skipping formatting
// entirely — it only requires bounding how often the expensive full
// re-parse+re-render happens, independent of how many stream_delta events
// arrive. Coalescing into "at most once per animation frame" does exactly
// that: however many deltas land between paints (a dense opencode burst can
// be a dozen), they collapse into the one renderBody() call that runs on
// the next frame, so total render work scales with actual frames painted
// (~60/sec ceiling), never with raw event count.
function scheduleStreamRender(entry) {
  if (entry.renderRaf) return; // already scheduled — the next frame will pick up this delta's text too
  entry.renderRaf = requestAnimationFrame(() => {
    entry.renderRaf = null;
    try {
      renderBody(entry);
    } catch (e) {
      // Partial/still-incomplete markdown (an unclosed fence, an
      // in-progress $…$ span) is normally harmless — marked/KaTeX just
      // render it as literal text until the closing delimiter arrives a
      // delta or two later — but if some edge case ever does throw, don't
      // let it silently stop this bubble from ever updating again: the
      // renderRaf flag above is already cleared, so the next delta's
      // scheduleStreamRender() call will still schedule a fresh attempt
      // (same defensive spirit as revealText()'s own try/catch below).
      console.error('Error during live stream render:', e);
    }
    scrollBottom();
  });
}

// ── Permission / AskUserQuestion cards ──────────────────────────────────────
// entry.rawText is JSON: {kind: 'permission'|'question', toolName, toolInput}.
// entry.resolved/resolvedText are set locally once acted on — there's no
// server-side memory of resolution state, so a stale reconnect could show
// live buttons for an already-resolved request again; clicking them just
// gets a 404 from driver.mjs (handled below), not a crash.
async function resolvePermission(id, payload) {
  try {
    const res = await fetch(`${driverBase}/permission-response`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, ...payload }),
    });
    return res.ok;
  } catch (e) {
    console.error('Failed to resolve permission:', e);
    return false;
  }
}

function renderPermissionCard(entry) {
  let data;
  try {
    data = JSON.parse(entry.rawText || '{}');
  } catch (e) {
    entry.el.textContent = entry.rawText || '';
    return;
  }

  // entry.resolved/resolvedText are the instant, purely-local flag this same
  // tab sets the moment it clicks Allow/Deny/submit (before the round trip
  // to the driver even completes). data.resolved/resolvedText are the
  // durable, server-broadcast version driver.mjs now sends once it actually
  // records the decision — present on reload/reconnect, or in a second tab,
  // where entry.resolved was never set locally at all.
  if (entry.resolved || data.resolved) {
    const text = entry.resolved ? entry.resolvedText : data.resolvedText;
    entry.el.innerHTML = `<div class="perm-resolved">${escapeHtml(text || 'Resolved')}</div>`;
    return;
  }

  const { kind, toolName, toolInput } = data;
  entry.el.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'perm-card';

  if (kind === 'question') {
    const questions = toolInput?.questions || [];
    // Per-question selection state. `chosen` holds the labels of any real
    // (non-"Other") options picked so far — a single label for an ordinary
    // question, any number for a multiSelect one. `otherOn`/`otherText`
    // track the free-text "Other" option independently, since its value can
    // keep changing after it's been picked (unlike a fixed option label).
    // This mirrors the real AskUserQuestion tool, which always guarantees
    // an "Other" choice alongside whatever fixed options it supplies.
    const state = questions.map(() => ({ chosen: new Set(), otherOn: false }));

    const submitBtn = document.createElement('button');
    submitBtn.className = 'perm-submit-btn';
    submitBtn.textContent = questions.length > 1 ? 'Submit answers' : 'Submit answer';
    submitBtn.disabled = true;

    // The full set of labels currently selected for question qi, in the
    // order: fixed options first (declaration order, via Set insertion),
    // then the free-typed "Other" text last, if active and non-blank.
    const otherTextareas = [];
    function labelsFor(qi) {
      const labels = [...state[qi].chosen];
      const otherVal = otherTextareas[qi] ? otherTextareas[qi].value.trim() : '';
      if (state[qi].otherOn && otherVal) labels.push(otherVal);
      return labels;
    }
    function updateSubmitEnabled() {
      submitBtn.disabled = !questions.every((q, qi) => labelsFor(qi).length > 0);
    }

    questions.forEach((q, qi) => {
      const qDiv = document.createElement('div');
      qDiv.className = 'perm-question';
      const qText = document.createElement('div');
      qText.className = 'perm-q-text';
      qText.textContent = q.question || q.header || `Question ${qi + 1}`;
      qDiv.appendChild(qText);

      const optsDiv = document.createElement('div');
      optsDiv.className = 'perm-options';

      const otherTextarea = document.createElement('textarea');
      otherTextarea.className = 'perm-other-textarea';
      otherTextarea.rows = 1;
      otherTextarea.placeholder = 'Type your own answer… (Shift+Enter for newline)';
      otherTextareas[qi] = otherTextarea;

      (q.options || []).forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'perm-option-btn';
        btn.textContent = opt.label;
        if (opt.description) btn.title = opt.description;
        btn.addEventListener('click', () => {
          if (q.multiSelect) {
            if (state[qi].chosen.has(opt.label)) {
              state[qi].chosen.delete(opt.label);
              btn.classList.remove('selected');
            } else {
              state[qi].chosen.add(opt.label);
              btn.classList.add('selected');
            }
          } else {
            // Exclusive: this option replaces any prior option AND turns
            // off "Other" — only one answer makes sense at a time.
            state[qi].chosen.clear();
            state[qi].chosen.add(opt.label);
            optsDiv.querySelectorAll('.perm-option-btn').forEach((b) => b.classList.remove('selected'));
            btn.classList.add('selected');
            if (state[qi].otherOn) {
              state[qi].otherOn = false;
              otherBtn.classList.remove('selected');
              otherTextarea.classList.remove('show');
            }
          }
          updateSubmitEnabled();
        });
        optsDiv.appendChild(btn);
      });

      // "Other" is always offered, exactly like the real tool — never
      // conditional on the options list the model happened to supply.
      const otherBtn = document.createElement('button');
      otherBtn.className = 'perm-option-btn perm-other-btn';
      otherBtn.textContent = 'Other…';
      otherBtn.addEventListener('click', () => {
        state[qi].otherOn = !state[qi].otherOn;
        if (state[qi].otherOn && !q.multiSelect) {
          // Exclusive: picking "Other" replaces any fixed option.
          state[qi].chosen.clear();
          optsDiv.querySelectorAll('.perm-option-btn:not(.perm-other-btn)')
            .forEach((b) => b.classList.remove('selected'));
        }
        otherBtn.classList.toggle('selected', state[qi].otherOn);
        otherTextarea.classList.toggle('show', state[qi].otherOn);
        if (state[qi].otherOn) {
          otherTextarea.focus();
          autoResizeTextarea(otherTextarea);
        }
        updateSubmitEnabled();
      });
      optsDiv.appendChild(otherBtn);

      otherTextarea.addEventListener('input', () => {
        autoResizeTextarea(otherTextarea);
        updateSubmitEnabled();
      });
      // Enter submits (like the main prompt box) unless Shift is held; the
      // textarea is single-question, so there's no ambiguity about which
      // answer this newline-vs-submit choice applies to.
      otherTextarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!submitBtn.disabled) submitBtn.click();
        }
      });

      qDiv.appendChild(optsDiv);
      qDiv.appendChild(otherTextarea);
      card.appendChild(qDiv);
    });

    submitBtn.addEventListener('click', async () => {
      submitBtn.disabled = true;
      const structured = questions.map((q, qi) => {
        const labels = labelsFor(qi);
        return { header: q.header || q.question, answer: q.multiSelect ? labels : (labels[0] ?? '') };
      });
      const formatted = questions
        .map((q, qi) => `${q.header || q.question}: ${labelsFor(qi).join(', ')}`)
        .join('; ');
      const ok = await resolvePermission(entry.permId, { answer: formatted, answers: structured });
      entry.resolved = true;
      entry.resolvedText = ok ? `Answered: ${formatted}` : 'This request already expired.';
      renderPermissionCard(entry);
    });
    card.appendChild(submitBtn);
  } else {
    const qText = document.createElement('div');
    qText.className = 'perm-q-text';
    qText.innerHTML = `Approve <code>${escapeHtml(toolName || 'tool')}</code>?`;
    card.appendChild(qText);

    const actions = document.createElement('div');
    actions.className = 'perm-options';

    const allowBtn = document.createElement('button');
    allowBtn.className = 'perm-option-btn perm-allow';
    allowBtn.textContent = 'Allow';
    allowBtn.addEventListener('click', async () => {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      const ok = await resolvePermission(entry.permId, { allow: true });
      entry.resolved = true;
      entry.resolvedText = ok ? 'Allowed' : 'This request already expired.';
      renderPermissionCard(entry);
    });

    const denyBtn = document.createElement('button');
    denyBtn.className = 'perm-option-btn perm-deny';
    denyBtn.textContent = 'Deny';
    denyBtn.addEventListener('click', async () => {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      const ok = await resolvePermission(entry.permId, { allow: false });
      entry.resolved = true;
      entry.resolvedText = ok ? 'Denied' : 'This request already expired.';
      renderPermissionCard(entry);
    });

    actions.appendChild(allowBtn);
    actions.appendChild(denyBtn);
    card.appendChild(actions);
  }

  entry.el.appendChild(card);
}

// Messages arrive whole, not token-by-token — reveal them word-by-word so
// they still feel live instead of popping in all at once.
// Duration is capped so long responses don't take forever to display.
function revealText(entry, fullText) {
  const words = fullText.split(/(\s+)/).filter(w => w.length > 0);
  const totalWords = words.length || 1;
  const steps = Math.min(totalWords, 40);
  const totalDurationMs = Math.min(900, Math.max(200, totalWords * 12));
  const stepMs = totalDurationMs / steps;
  const wordsPerStep = Math.ceil(totalWords / steps);
  let shown = 0;

  clearInterval(entry.revealTimer);
  entry.el.classList.add('streaming');

  entry.revealTimer = setInterval(() => {
    try {
      shown = Math.min(totalWords, shown + wordsPerStep);
      entry.rawText = words.slice(0, shown).join('');
      renderBody(entry);
      scrollBottom();
    } catch (e) {
      // If rendering ever throws (a markdown/KaTeX edge case), force
      // completion instead of retrying the same failing render forever —
      // otherwise this interval never reaches the cleanup below, and the
      // streaming cursor is left blinking on that bubble permanently.
      console.error('Error during message reveal, forcing completion:', e);
      shown = totalWords;
    } finally {
      if (shown >= totalWords) {
        clearInterval(entry.revealTimer);
        entry.el.classList.remove('streaming');
      }
    }
  }, stepMs);
}

// Autoscroll-lock: only force-scroll on new content if the user was already
// pinned to the bottom. If they've scrolled up to reread something, show a
// pill instead of yanking them back down on every reveal tick.
//
// This has to stay correct under BOTH `scroll-behavior: smooth` (an
// animated, multi-frame scroll, ~300-500ms) and `scroll-behavior: auto`
// (an instant jump) — see the "Auto-scroll animation" setting. The naive
// version of this (recompute pinnedToBottom on every 'scroll' event) only
// works for the instant case. Under 'smooth', a programmatic scroll-to-
// bottom fires 'scroll' events for its intermediate, not-yet-at-bottom
// frames too. If new content arrives mid-animation — e.g. a permission
// bubble landing right after a multi-row tool bubble — one of those
// intermediate frames can get sampled as "the user scrolled away", flipping
// pinnedToBottom to false and abandoning the in-flight scroll short of the
// real bottom. That's the "auto-scroll gets stuck partway" bug, and it also
// explains the pill showing up even when you're basically already at the
