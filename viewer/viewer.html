refreshNotifyUi();

fontSlider.addEventListener('input', () => {
  settings.fontSize = Number(fontSlider.value);
  fontVal.textContent = settings.fontSize + 'px';
  applySettings();
  saveSettings();
});

// Width reflows the whole feed, which fights with the drag if applied live —
// 'input' fires continuously while dragging, so only update the value label
// there; the actual resize happens on 'change', once the mouse is released.
widthSlider.addEventListener('input', () => {
  widthVal.textContent = widthSlider.value + 'px';
});
widthSlider.addEventListener('change', () => {
  settings.width = Number(widthSlider.value);
  widthVal.textContent = settings.width + 'px';
  applySettings();
  saveSettings();
});

labelSlider.addEventListener('input', () => {
  settings.labelFontSize = Number(labelSlider.value);
  labelVal.textContent = settings.labelFontSize + 'px';
  applySettings();
  saveSettings();
});

// The status line this slider controls is normally only visible mid-turn,
// so there's usually nothing on-screen to judge the size against while
// dragging. Fake a preview line for the duration of the drag (only if
// there isn't a real one already showing — a real turn already gives you
// something to look at), and drop it again once the mouse is released.
let statusSizePreview = false;
statusSlider.addEventListener('input', () => {
  settings.statusFontSize = Number(statusSlider.value);
  statusVal.textContent = settings.statusFontSize + 'px';
  applySettings();
  saveSettings();
  if (!turnInFlight) {
    statusSizePreview = true;
    setTurnIndicator('Thinking… (preview)');
  }
});
statusSlider.addEventListener('change', () => {
  if (statusSizePreview && !turnInFlight) {
    setTurnIndicator(null);
  }
  statusSizePreview = false;
});

themeToggle.addEventListener('change', () => {
  settings.theme = themeToggle.checked ? 'light' : 'dark';
  applySettings();
  saveSettings();
});

// Ticking the box IS the user gesture the permission prompt requires —
// browsers refuse a requestPermission() that isn't tied to one, and a user
// who dismisses or blocks the prompt can never be asked again from script,
// so this is deliberately the only place it is ever called.
notifyToggle.addEventListener('change', async () => {
  settings.notify = notifyToggle.checked;
  if (notifyToggle.checked) {
    // Prime the audio graph while the gesture is still in scope: an
    // AudioContext created later, from an SSE callback, starts suspended
    // under every browser's autoplay policy and the beep is never heard.
    primeAudio();
    // Only asked when it can still succeed. Once a user has picked "block",
    // calling this again is a no-op forever, and the box staying ticked is
    // correct — the tab-title flag still works, and refreshNotifyUi says so.
    if (notifySupported() && notifyPermission() === 'default') {
      try { await Notification.requestPermission(); } catch { /* treated as not-granted below */ }
    }
  }
  saveSettings();
  refreshNotifyUi();
  updateMetaSubscription();
});

notifySound.addEventListener('change', () => {
  settings.notifySound = notifySound.checked;
  saveSettings();
  if (notifySound.checked) primeAudio();
});

// ── Sub-agents: roster, Task-bubble status, child-session banner ──────────
// A sub-agent IS a session here, so opening one is just viewSession(). What
// this adds is the two ways to reach one — a live status line on the Task
// bubble that spawned it, and a roster of all of them — plus the banner that
// makes a child session honest about being read-only.
// ── Messaging: inbox, budgets, pause ────────────────────────────────────
// The safety half of the messaging UI, and deliberately built BEFORE
// anything can start a turn on its own: the breaker ships before the thing
// it stops.
// ── Jump to latest ──────────────────────────────────────────────────────
// A feed item rather than a floating control: it is only reachable by
// scrolling to the top, which is exactly when it is useful. The existing
// new-message pill covers "something arrived while you were away"; this
// covers "nothing is new, but I have read my way up here".
const jumpLatest = document.getElementById('jump-latest');
const JUMP_LATEST_MIN_SCREENS = 1.2; // a screenful, plus a little, so it never appears on a short feed

function refreshJumpLatest() {
  if (!jumpLatest) return;
  const worthIt = feed.scrollHeight > feed.clientHeight * JUMP_LATEST_MIN_SCREENS;
  jumpLatest.classList.toggle('show', worthIt);
}

if (jumpLatest) {
  const jump = () => { pinnedToBottom = true; feed.scrollTop = feed.scrollHeight; };
  jumpLatest.addEventListener('click', jump);
  jumpLatest.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jump(); }
  });
  // Content can change height without an insert (a streaming bubble growing,
  // thinking blocks expanding, the window resizing).
  window.addEventListener('resize', refreshJumpLatest);
}

// ── Full history (Claude Code only) ─────────────────────────────────────
// Unlike every other setting here this one is NOT in localStorage: it
// decides what server.py fetches into a log shared by every tab, so two
// tabs disagreeing would fight over one cache. It lives in the driver and
// persists per-install.
const deepHistoryRow = document.getElementById('deep-history-row');
const deepHistoryToggle = document.getElementById('deep-history-toggle');
const deepHistoryLabel = document.getElementById('deep-history-label');

function refreshDeepHistoryUi() {
  if (!deepHistoryRow) return;
  // Greyed rather than hidden for OpenCode: a control that vanishes reads as
  // a bug, one that explains itself teaches what the backends do differently.
  const isOpencode = resolvedBackendForIndicator() === 'opencode';
  deepHistoryRow.classList.toggle('disabled', isOpencode);
  if (deepHistoryToggle) deepHistoryToggle.disabled = isOpencode;
  // Tooltip rather than a standing note: see the markup comment. Same text,
  // same two cases, no permanent three lines of panel.
  if (deepHistoryLabel) {
    deepHistoryLabel.title = isOpencode
      ? 'OpenCode already loads a session\u2019s full history, so this does nothing there.'
      : 'Claude Code hides turns from before a conversation was compacted. Loading them is '
        + 'slower and uses more memory on long sessions. This affects what you SEE \u2014 '
        + 'agents can always read the full history. Turning it off takes effect on the next load.';
  }
}

async function loadDeepHistorySetting() {
  if (!driverBase || !deepHistoryToggle) return;
  try {
    const d = await fetch(`${driverBase}/deep-history`).then(r => r.json());
    deepHistoryToggle.checked = !!d.enabled;
  } catch { /* leave as-is; a failed read must not flip a stored setting */ }
  refreshDeepHistoryUi();
}

if (deepHistoryToggle) {
  deepHistoryToggle.addEventListener('change', async () => {
    if (!driverBase) return;
    const enabled = deepHistoryToggle.checked;
    try {
      await fetch(`${driverBase}/deep-history`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled }),
      });
    } catch { return; }
    // Turning it ON reloads so the newly-available history actually appears;
    // the driver has already dropped server.py's seed. Turning it OFF does
    // NOT reload: un-rendering thousands of bubbles would mean clearing the
    // feed and losing your place, for no gain. It applies next time.
    if (enabled) location.reload();
  });
}

// ── The autonomy strip (§10, AD4) ───────────────────────────────────────
// What the envelope button, its panel, the budget chip and the preset menu
// all collapsed into. The design rule: when nothing is wrong, this costs
// NOTHING — no header button, no chip, no panel. The strip exists only while
// autonomous work is paused, uncapped, or holding parked mail.
//
// It lives in the window chrome above the feed, deliberately not inside it:
// the condition is global, so it must not scroll away, and whichever session
// you happen to have open is where you should be able to unblock it.
const autonomyStrip = document.getElementById('paused-strip');
const asText = document.getElementById('ps-text');
const asActions = document.getElementById('ps-actions');

let autonomyState = { state: 'open', count: 0, pauseAfter: 20, uncappedUntil: null, parked: 0, parkedSessions: 0 };

// AD5: every absolute time is resolved HERE, in the browser, and the driver
// only ever receives epoch ms. The container is almost certainly on UTC, so
// a driver that tried to interpret "8 AM" would be wrong in a way that stays
// invisible until it bites.
function fmtWhen(ms) {
  const d = new Date(ms);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  return sameDay ? time : `${d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}, ${time}`;
}
function fmtUntilRelative(ms) {
  const mins = Math.max(0, Math.round((ms - Date.now()) / 60000));
  if (mins < 60) return `in ${mins} min`;
  const h = Math.round(mins / 60);
  return `in ${h} hour${h === 1 ? '' : 's'}`;
}
// The next occurrence of a given local hour — so "8:00 AM" set at 7 AM means
// an hour away, not tomorrow. Never a guess for the user either way, because
// the menu renders the resolved date next to every entry.
function nextLocalHour(hour) {
  const d = new Date();
  d.setHours(hour, 0, 0, 0);
  if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
  return d.getTime();
}

async function refreshAutonomy() {
  if (!driverBase) return;
  try {
    autonomyState = await (await fetch(`${driverBase}/autonomy`)).json();
  } catch { return; }
  renderAutonomyStrip();
  renderAutonomySetting();
}

// ── The autonomy setting: one control, two modes ────────────────────────
const autonomyMode = document.getElementById('autonomy-mode');
const autonomyTurnsRow = document.getElementById('autonomy-turns-row');
const autonomyTurns = document.getElementById('autonomy-turns');
const autonomyUntilRow = document.getElementById('autonomy-until-row');
const autonomyUntil = document.getElementById('autonomy-until');
const TURN_PRESETS = [5, 10, 20, 50, 100];

// <input type="datetime-local"> speaks LOCAL wall-clock with no zone, so it
// has to be fed and read in local terms. The driver never interprets a
// wall-clock time (AD5) — the browser resolves it to epoch ms and sends
// that — which is why this conversion lives here and only here.
function toLocalInputValue(ms) {
  const d = new Date(ms);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

// Reflects the LIVE state rather than the last thing clicked: an unattended
// window can lapse on its own, and another tab can change any of this.
// Driven from refreshAutonomy so there is one source of truth.
function renderAutonomySetting() {
  if (!autonomyMode) return;
  // Never rewrite a field being edited — a poll landing between keystrokes
  // would yank the value out from under the user.
  if (document.activeElement === autonomyTurns || document.activeElement === autonomyUntil) return;
  const a = autonomyState;
  if (a.state === 'uncapped') {
    if (a.uncappedUntil) {
      autonomyMode.value = 't:custom';
      autonomyUntil.value = toLocalInputValue(a.uncappedUntil);
    } else {
      autonomyMode.value = 't:never';
    }
  } else {
    const n = Number(a.pauseAfter);
    autonomyMode.value = TURN_PRESETS.includes(n) ? `n:${n}` : 'n:custom';
    autonomyTurns.value = String(n || 20);
  }
  syncAutonomyRows();
}

function syncAutonomyRows() {
  const v = autonomyMode.value;
  autonomyTurnsRow.classList.toggle('disabled', v !== 'n:custom');
  autonomyUntilRow.classList.toggle('disabled', v !== 't:custom');
  autonomyTurns.disabled = v !== 'n:custom';
  autonomyUntil.disabled = v !== 't:custom';
}

function applyAutonomyMode() {
  const v = autonomyMode.value;
  syncAutonomyRows();
  if (v.startsWith('n:')) {
    // Picking ANY supervised option also ends an unattended window: it is
    // the obvious thing to reach for when you want supervision back, and a
    // separate "cancel" control would be a second way to say the same thing.
    const n = v === 'n:custom' ? Number(autonomyTurns.value) : Number(v.slice(2));
    if (!Number.isFinite(n) || n < 1) return;   // custom field mid-edit
    autonomyPost({ pauseAfter: n }).then(() => autonomyPost({}));
    return;
  }
  if (v === 't:never') { autonomyPost({ lift: true, until: null }); return; }
  if (v === 't:1h')  { autonomyPost({ lift: true, until: Date.now() + 3600e3 }); return; }
  if (v === 't:4h')  { autonomyPost({ lift: true, until: Date.now() + 4 * 3600e3 }); return; }
  if (v === 't:8am') { autonomyPost({ lift: true, until: nextLocalHour(8) }); return; }
  if (v === 't:custom') {
    // Seed a sensible target rather than posting nothing: an empty picker
    // with no default is a dead end.
    if (!autonomyUntil.value) autonomyUntil.value = toLocalInputValue(nextLocalHour(8));
    const ms = new Date(autonomyUntil.value).getTime();
    if (!Number.isFinite(ms) || ms <= Date.now()) return;  // wait for a real time
    autonomyPost({ lift: true, until: ms });
  }
}

if (autonomyMode) {
  autonomyMode.addEventListener('change', applyAutonomyMode);
  // `change`, not `input`: committing per keystroke would post a budget of
  // 2 on the way to typing 200.
  autonomyTurns.addEventListener('change', applyAutonomyMode);
  autonomyUntil.addEventListener('change', applyAutonomyMode);
}

// MD9: the strip now has two independent halves — held mail on the left,
// autonomy state on the right — and either alone is reason enough to show
// it. Both renderers call this rather than each toggling `.show`, or
// whichever ran last would hide the other's half.
function stripHasAutonomyState() {
  return autonomyState.state === 'paused' || autonomyState.state === 'uncapped';
}
function updateStripVisibility() {
  autonomyStrip.classList.toggle('show', stripHasAutonomyState() || heldMail.length > 0);
}

function renderAutonomyStrip() {
  const a = autonomyState;
  updateStripVisibility();
  // The old third state — "N messages waiting", counting inbox.stuck()
  // across every session — is gone. It double-announced mail the left half
  // now owns, and its count was global while the action was local, which is
  // exactly why it fired for three messages belonging to the session on
  // screen. Mail visibility is the left half's business alone.
  if (!stripHasAutonomyState()) { asText.textContent = ''; asActions.innerHTML = ''; return; }

  if (a.state === 'uncapped') {
    asText.textContent = a.uncappedUntil
      ? `⚡ Autonomous work is uncapped until ${fmtWhen(a.uncappedUntil)} (${fmtUntilRelative(a.uncappedUntil)}).`
      : '⚡ Autonomous work is uncapped until you turn it back on.';
  } else {
    const where = a.parkedSessions > 1 ? ` across ${a.parkedSessions} sessions` : '';
    asText.textContent =
      `⏸ Autonomous work paused — ${a.count} turns${where} since you were last active.`;
  }

  asActions.innerHTML = '';
  const btn = (label, title, fn, cls) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (title) b.title = title;
    if (cls) b.className = cls;
    b.addEventListener('click', fn);
    asActions.appendChild(b);
    return b;
  };
  if (a.state === 'uncapped') {
    btn('Cap it now', 'Restore the pause-after limit', () => autonomyPost({}));
  } else {
    if (a.state === 'paused') {
      btn(`Allow ${a.pauseAfter} more`, 'Let autonomous work continue', () => autonomyPost({ allow: true }));
    }
    btn("Don't pause ▾", 'Lift the limit for a while', (e) => { e.stopPropagation(); toggleLiftMenu(); });
  }
  btn('Stop everything', 'Abort every running turn', async () => {
    if (!confirm('Stop every running turn?\n\nWork in progress will be lost.')) return;
    await fetch(`${driverBase}/stop-all`, { method: 'POST' });
    refreshAutonomy();
  }, 'danger');
}

// Four fixed choices plus a custom one. Every entry renders its RESOLVED
// absolute time, not just the named one — "for 4 hours" crosses midnight
// with exactly the same ambiguity that makes a bare "8:00 AM" unclear at
// 7 AM. If the custom entry turns out to be the one always reached for, the
// fixed list is wrong and should shrink; the presets this replaced had four
// options and were never touched.
function liftChoices() {
  const now = Date.now();
  return [
    { label: 'for 1 hour',  until: now + 60 * 60 * 1000 },
    { label: 'for 4 hours', until: now + 4 * 60 * 60 * 1000 },
    { label: 'until 8:00 AM', until: nextLocalHour(8) },
  ];
}

function toggleLiftMenu() {
  const existing = document.getElementById('lift-menu');
  if (existing) { existing.remove(); return; }
  const menu = document.createElement('div');
  menu.id = 'lift-menu';
  for (const c of liftChoices()) {
    const row = document.createElement('div');
    row.className = 'lift-row';
    row.innerHTML = `<span>${c.label}</span><span class="lift-when">${fmtWhen(c.until)}</span>`;
    row.addEventListener('click', () => { menu.remove(); autonomyPost({ lift: true, until: c.until }); });
    menu.appendChild(row);
  }
  // Native datetime-local: date AND time, no library, and it covers "and the
  // day, if needed" by construction.
  const customRow = document.createElement('div');
  customRow.className = 'lift-row';
  customRow.innerHTML = '<span>until…</span>';
  const input = document.createElement('input');
  input.type = 'datetime-local';
  const d = new Date(nextLocalHour(8));
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  input.value = d.toISOString().slice(0, 16);
  input.addEventListener('click', (e) => e.stopPropagation());
  input.addEventListener('change', () => {
    const ms = new Date(input.value).getTime();
    if (!Number.isFinite(ms) || ms <= Date.now()) { alert('Pick a time in the future.'); return; }
    menu.remove();
    autonomyPost({ lift: true, until: ms });
  });
  customRow.appendChild(input);
  menu.appendChild(customRow);

  const foreverRow = document.createElement('div');
  foreverRow.className = 'lift-row';
  foreverRow.innerHTML = '<span>until I turn it back on</span>';
  foreverRow.addEventListener('click', () => { menu.remove(); autonomyPost({ lift: true, until: null }); });
  menu.appendChild(foreverRow);

  autonomyStrip.appendChild(menu);
  setTimeout(() => document.addEventListener('click', function once() {
    menu.remove(); document.removeEventListener('click', once);
  }), 0);
}

async function autonomyPost(body) {
  try {
    // One route for every cap action now. MD7 deleted /presence, so `allow`
    // is an explicit branch on /autonomy-cap rather than a presence ping
    // dressed up as one.
    await fetch(`${driverBase}/autonomy-cap`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch {}
  refreshAutonomy();
}


// ── MD9: the mail interface, in the strip's left half ───────────────────
// It used to live in the feed, forced last. That was wrong twice over: the
// feed SCROLLS, so the only control that could unblock the session hid
// itself the moment you scrolled up, and the strip was separately
// announcing the same held mail from the chrome — the same fact stated in
// two places, which is what made it look like a bug.
//
// Scoped to the session on screen, which loses nothing: mail parks with
// reason "watched" only while a VISIBLE tab is looking at that session (a
// hidden tab reports visible:false, noteViewing deletes the entry and the
// sweep releases the mail), so there is no reachable state where held mail
// exists somewhere a visible tab is not already showing it. A second window
// on another session shows its own count, full stop.
let heldMail = [];
let mailExpanded = false;

const mailHeadEl = document.getElementById('ps-mail');
const mailListEl = document.getElementById('ps-mail-list');

async function refreshMail() {
  if (!driverBase || !currentSessionId) { heldMail = []; renderMailBar(); return; }
  try {
    const d = await (await fetch(
      `${driverBase}/inbox?session=${encodeURIComponent(currentSessionId)}`)).json();
    // Only mail addressed TO this session, and only what is actually
    // waiting on a decision. Queued mail resolves itself in seconds and a
    // bar that flickered for it would train the eye to ignore the bar.
    heldMail = (d.entries || []).filter(
      (e) => e.state === 'parked' && e.to?.id === currentSessionId);
    // Approved, but the session is mid-turn so it cannot be delivered yet.
    // Without this the bar empties the instant you click and nothing visibly
    // happens until the turn ends — which is indistinguishable from the
    // click having been swallowed, and swallowing it is exactly what the old
    // code did.
    approvedPending = (d.entries || []).filter(
      (e) => e.state === 'queued' && e.approved && e.to?.id === currentSessionId).length;
  } catch { return; }
  renderMailBar();
}

let approvedPending = 0;

function renderMailBar() {
  const el = mailHeadEl;
  if (!heldMail.length && approvedPending) {
    // Nothing left needing a decision, but something is still on its way.
    el.classList.add('show');
    el.innerHTML = '';
    mailListEl.innerHTML = '';
    mailExpanded = false;
    autonomyStrip.classList.remove('mail-open');
    const note = document.createElement('span');
    note.className = 'mb-toggle';
    note.textContent = `${approvedPending} message${approvedPending === 1 ? '' : 's'} — delivering when this turn ends`;
    note.title = 'You approved these. They are waiting for the current turn to finish.';
    el.appendChild(note);
    updateStripVisibility();
    return;
  }
  if (!heldMail.length) {
    el.classList.remove('show');
    el.innerHTML = '';
    mailListEl.innerHTML = '';
    mailExpanded = false;
    autonomyStrip.classList.remove('mail-open');
    updateStripVisibility();
    return;
  }
  const n = heldMail.length;
  const checked = new Set(
    [...mailListEl.querySelectorAll('.mb-row input:checked')].map((c) => c.dataset.id));
  // Checked by default: delivering everything is the common intent, so the
  // frequent case stays one click and unchecking is the exception.
  const isChecked = (id) => (el.classList.contains('show') ? checked.has(id) : true);

  el.classList.add('show');
  el.innerHTML = '';
  updateStripVisibility();

  const head = el;
  const toggle = document.createElement('span');
  toggle.className = 'mb-toggle';
  // A single message names its sender in the collapsed line — "1 message
  // waiting" alone would make you expand it just to learn who it is.
  toggle.textContent = n === 1
    ? `✉ ${heldMail[0].fromHandle ? '@' + heldMail[0].fromHandle : 'a peer'} — ${(heldMail[0].text || '').replace(/^\[[^\]]+\]\s*/, '').slice(0, 44)}`
    : `✉ ${n} messages waiting`;
  toggle.addEventListener('click', () => { mailExpanded = !mailExpanded; renderMailBar(); });
  head.appendChild(toggle);

  const deliver = document.createElement('button');
  deliver.className = 'mb-deliver';
  head.appendChild(deliver);

  // The list is a sibling overlay on the strip, not a child of the head —
  // the head is an inline flex row, and an expanding block inside it would
  // stretch the strip instead of hanging below it.
  const list = mailListEl;
  list.innerHTML = '';
  autonomyStrip.classList.toggle('mail-open', mailExpanded);
  for (const e of heldMail) {
    const row = document.createElement('label');
    row.className = 'mb-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.dataset.id = e.id;
    cb.checked = isChecked(e.id);
    cb.addEventListener('change', updateDeliverLabel);
    const who = document.createElement('span');
    who.className = 'mb-who';
    who.textContent = e.fromHandle ? '@' + e.fromHandle : 'peer';
    const txt = document.createElement('span');
    txt.className = 'mb-text';
    txt.textContent = (e.text || '').replace(/^\[[^\]]+\]\s*/, '').slice(0, 90);
    const drop = document.createElement('button');
    drop.className = 'mb-drop';
    drop.textContent = '✕';
    drop.title = 'Discard without delivering';
    drop.addEventListener('click', async (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      await mailPost({ action: 'discard', entryId: e.id });
    });
    row.appendChild(cb); row.appendChild(who); row.appendChild(txt); row.appendChild(drop);
    list.appendChild(row);
  }

  function updateDeliverLabel() {
    const k = list.querySelectorAll('.mb-row input:checked').length;
    deliver.textContent = k === n ? (n === 1 ? 'Deliver' : `Deliver all ${n}`) : `Deliver ${k}`;
    deliver.disabled = k === 0;
  }
  updateDeliverLabel();
  deliver.addEventListener('click', async () => {
    const ids = [...list.querySelectorAll('.mb-row input:checked')].map((c) => c.dataset.id);
    if (!ids.length) return;
    deliver.disabled = true;
    await mailPost({ action: 'deliver', sessionId: currentSessionId, entryIds: ids });
  });
}

async function mailPost(body) {
  try {
    await fetch(`${driverBase}/inbox-action`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch { /* a failed action must not take the feed down */ }
  await refreshMail();
}

// ── MD1/MD7: viewing, not presence ──────────────────────────────────────
// This REPLACES the old presence ping. That one fired on any keydown,
// mousedown or focus and reset the autonomy counter — the weakest available
// signal doing nearly all the work, so a stray trackpad brush silently
// re-armed twenty autonomous turns. The driver now infers presence from the
// requests that represent the user actually DIRECTING it (MD7), and nothing
// about presence is reported from here at all.
//
// What IS reported is visibility, per session: "a human is looking at this
// conversation", which is what decides whether an arriving message waits
// (MD1). Deliberately a heartbeat rather than a one-shot flag, so a tab that
// crashes or is closed releases its hold on the driver's TTL instead of
// stranding mail forever (MD3).
const VIEWING_HEARTBEAT_MS = 20000;
let viewingTimer = null;
let lastViewingKey = '';

function viewingIsVisible() {
  return document.visibilityState === 'visible';
}

// `force` bypasses the de-dup so a session switch or a visibility flip is
// reported immediately rather than waiting for the next heartbeat.
function reportViewing(force = false) {
  if (!driverBase || !currentSessionId) return;
  const visible = viewingIsVisible();
  const key = `${currentSessionId}:${visible}`;
  if (!force && key === lastViewingKey) return;
  lastViewingKey = key;
  fetch(`${driverBase}/viewing`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: currentSessionId, visible }),
  }).then(() => refreshMail()).catch(() => {});
}

// Hidden is debounced; visible is not. Glancing at another tab for two
// seconds should not fire off a delivery, but coming back must take effect
// at once (MD3).
// MD10: only a VISIBLE tab reports. Going hidden says nothing, because the
// driver no longer acts on a hidden report — a hold now lapses purely from
// the absence of fresh reports, after a 120s grace. The old 4-second
// debounce existed to tell the driver "released now", which dumped held mail
// the moment you glanced at another window; the heartbeat already stops on
// its own when the tab is hidden, so silence carries the same information
// without the eager release.
document.addEventListener('visibilitychange', () => {
  if (viewingIsVisible()) reportViewing(true);
});

function startViewingHeartbeat() {
  clearInterval(viewingTimer);
  viewingTimer = setInterval(() => { if (viewingIsVisible()) reportViewing(true); }, VIEWING_HEARTBEAT_MS);
}

// ── Continue after a turn that ended badly ──────────────────────────────
// Sits above the input bar, never inside it: a control that appears and
// vanishes inside the bar moves Send at exactly the moment you are reaching
// for it. It clears when the next turn starts by ANY route — Continue, Send,
// or a peer message waking the session — which is one rule instead of three.
const resumeBar = document.getElementById('resume-bar');
const resumeText = document.getElementById('resume-text');
const resumeBtn = document.getElementById('resume-btn');
const resumeDismiss = document.getElementById('resume-dismiss');

const RESUME_WORDING = {
  restart: 'The previous turn was interrupted when the environment restarted.',
  aborted: 'You stopped the previous turn before it finished.',
  error: 'The previous turn ended with an error.',
  // Worded as infrastructure, not failure: the turn's work was fine, the
  // model provider simply stopped responding mid-generation.
  stalled: 'The model provider stopped responding mid-generation.',
};

// §15. The CATEGORY outranks the reason, because a usage limit arrives under
// both "error" and "stalled" and the wording above would misdescribe it as a
// fault. Naming it correctly is the difference between the user hunting for
// a bug and the user waiting two minutes.
const RESUME_CATEGORY_WORDING = {
  rate_limited: 'The previous turn was cut short by a usage limit.',
  overloaded: 'The model provider was overloaded and stopped responding.',
  quota_exhausted: 'The previous turn was cut short: this account is out of credits.',
};

// A session can legitimately sleep for hours waiting out a five-hour limit.
// §13e trained everyone to read a silent session as broken, so a scheduled
// wait has to announce itself — otherwise the correct behaviour looks
// exactly like the bug it replaced.
function describeResumePlan(d) {
  if (d.resumeBlocked === 'quota_exhausted') {
    return ' It will not retry on its own — the limit needs credits or a reset.';
  }
  if (d.resumeBlocked === 'strikes-exhausted') {
    return ' Automatic retries are exhausted; continuing is up to you.';
  }
  if (!d.resumeAt) return '';
  const at = new Date(d.resumeAt);
  if (Number.isNaN(at.getTime())) return '';
  const mins = Math.round((at.getTime() - Date.now()) / 60000);
  // "in 3 minutes" is easier to act on than a wall-clock time for short
  // waits; a clock time is easier for long ones, where the user wants to
  // know whether to go and do something else.
  const when = mins <= 0 ? 'any moment now'
    : mins < 90 ? `in ~${mins} minute${mins === 1 ? '' : 's'}`
    : `at ${at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  const attempt = d.resumeAttempt && d.resumeMaxAttempts
    ? ` (attempt ${d.resumeAttempt} of ${d.resumeMaxAttempts})` : '';
  return d.resumeScheduled
    ? ` Waiting for the limit to reset — resuming ${when}${attempt}.`
    : ` It will retry by itself ${when}${attempt}.`;
}


// Messages are appended to the feed, so a resume bar that merely lives there
// would drift upward as the turn's output arrives. Re-appending on every show
// keeps it as the last thing in the conversation, which is the only position
// that reads correctly ("...and that is where it stopped").
function placeResumeBar() {
  // MD9: nothing else competes for the bottom of the feed any more. The mail
  // bar used to live here and anchor it, so Continue had to sit just above;
  // mail moved to the strip, so Continue is simply last.
  if (resumeBar.parentElement !== feed || feed.lastElementChild !== resumeBar) {
    feed.appendChild(resumeBar);
  }
  // Only when already following along. Yanking the view down on someone who
  // has deliberately scrolled back is the behaviour the pinning logic exists
  // to prevent, and this is not important enough to be an exception.
  if (pinnedToBottom) performAutoScroll();
}

async function refreshResumeBar() {
  // Never offered on a sub-agent transcript — its input bar is hidden for
  // the same reason, and its parent is the one that should restart it.
  if (!driverBase || !currentSessionId || currentSessionIsChild) {
    resumeBar.classList.remove('show');
    return;
  }
  let d;
  try {
    d = await fetch(`${driverBase}/resume-state?sessionId=${encodeURIComponent(currentSessionId)}`)
      .then(r => r.json());
  } catch {
    return; // a failed poll must not hide a control the user may want
  }
  if (!d.available) {
    resumeBar.classList.remove('show');
    return;
  }
  const why = RESUME_CATEGORY_WORDING[d.category]
    || RESUME_WORDING[d.reason]
    || 'The previous turn ended abnormally.';
  // Suppressed for a usage limit: the raw provider text is long, repeats
  // what the sentence above already says, and crowds out the one new piece
  // of information the user actually needs — when it resumes.
  const detail = (d.error && !d.category) ? ` ${String(d.error).slice(0, 120)}` : '';
  const tool = d.lastTool ? ` (during ${d.lastTool})` : '';
  resumeText.textContent = `${why}${tool}${detail}${describeResumePlan(d)}`;
  resumeBar.classList.add('show');
  placeResumeBar();
}

resumeBtn.addEventListener('click', async () => {
  if (!driverBase || !currentSessionId) return;
  resumeBar.classList.remove('show');
  try {
    await fetch(`${driverBase}/continue`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId }),
    });
  } catch {
    refreshResumeBar(); // put it back if the call never landed
  }
});

// Dismiss hides it for now without resolving anything; the next poll or
// session switch brings it back, because the turn really did die.
resumeDismiss.addEventListener('click', () => resumeBar.classList.remove('show'));

// Budget preset for this session. One control, collapsed to the preset name,
// carrying the same envelope as the panel button so it reads as part of the
// messaging subsystem rather than another model setting.
//
// Deliberately quiet: it shows only the preset name, never a live counter.
// Most turns spend no budget at all, and a number ticking during ordinary
// chat is exactly the kind of signal people stop seeing — the same reason
// the panel badge counts only genuinely stuck mail.
const rosterBtn = document.getElementById('roster-btn');
const rosterPanel = document.getElementById('roster-panel');
const subagentBanner = document.getElementById('subagent-banner');
const saTypeEl = document.getElementById('sa-type');
const saParentBtn = document.getElementById('sa-parent-btn');
const saPromoteBtn = document.getElementById('sa-promote-btn');

let subAgents = [];            // roster for the session being viewed
// HD1's other half: delegated sessions this session created. Deliberately a
// separate list from subAgents — they are not sub-agents, they are sessions,
// and nothing should ever render them into the roster.
let delegatedChildren = [];
// Where this session was delegated from: { parentSessionId, bubbleId }.
// Supplied by /turn-status, a direct driver-to-browser route.
let delegationAnchor = null;
let currentSessionIsChild = false;
let currentSessionParent = null;
// True while the sub-agent being VIEWED is itself still running. A child
// session has no turn state of its own in the browser — turnInFlight tracks
// whatever session this tab is connected to — so this is read from the
// parent's roster, which is the only place a child's liveness is known.
let currentSessionBlocked = false;

async function refreshSubAgents() {
  if (!driverBase) return;
  try {
    const res = await fetch(`${driverBase}/sub-agents?sessionId=${encodeURIComponent(currentSessionId)}`);
    if (!res.ok) return;
    const data = await res.json();
    subAgents = data.subAgents || [];
    delegatedChildren = data.delegatedChildren || [];
  } catch {
    return; // transient; the next turn event retries
  }
  renderRoster();
  refreshTaskBubbles();
  refreshDelegateBubbles();
  refreshChildLiveness();
}

// When viewing a sub-agent, ask its PARENT's roster whether it is still
// running — that is what gates Promote. Skipped entirely for an ordinary
// session, which has turnInFlight for this.
async function refreshChildLiveness() {
  if (!currentSessionIsChild || !currentSessionParent || !driverBase) {
    if (currentSessionBlocked) { currentSessionBlocked = false; applySubAgentBanner(); }
    return;
  }
  try {
    const res = await fetch(`${driverBase}/sub-agents?sessionId=${encodeURIComponent(currentSessionParent)}`);
    if (!res.ok) return;
    const mine = ((await res.json()).subAgents || []).find((s) => s.agentId === currentSessionId);
    const blocked = !!mine && (mine.status === 'running' || mine.status === 'pending' || !!mine.awaiting);
    if (blocked !== currentSessionBlocked) { currentSessionBlocked = blocked; applySubAgentBanner(); }
  } catch { /* leave the last known answer standing */ }
}

function rosterRunningCount() {
  return subAgents.filter((s) => s.status === 'running' || s.status === 'pending').length;
}

function renderRoster() {
  const running = rosterRunningCount();
  rosterBtn.classList.toggle('show', subAgents.length > 0);
  // ↳ ("child of") rather than a gear — the gear is the settings button two
  // slots along, and two gears in one header read as two ways into settings.
  rosterBtn.textContent = running ? `↳ ${running}` : `↳ ${subAgents.length}`;
  rosterBtn.title = running
    ? `${running} sub-agent${running === 1 ? '' : 's'} running (${subAgents.length} total this session)`
    : `${subAgents.length} sub-agent${subAgents.length === 1 ? '' : 's'} in this session`;

  rosterPanel.innerHTML = '';
  if (!subAgents.length) {
    const empty = document.createElement('div');
    empty.className = 'roster-empty';
    empty.textContent = 'No sub-agents in this session yet.';
    rosterPanel.appendChild(empty);
    return;
  }
  for (const sa of subAgents) {
    const row = document.createElement('div');
    row.className = 'roster-row';

    const dot = document.createElement('div');
    // Waiting outranks running for the dot too — it is the state that needs
    // you, so it must not look like the one that does not.
    dot.className = `roster-dot ${sa.awaiting ? 'waiting' : (sa.status || '')}`;
    row.appendChild(dot);

    const main = document.createElement('div');
    main.className = 'roster-main';
    const title = document.createElement('div');
    title.className = 'roster-title';
    title.textContent = sa.description || sa.subagentType || 'sub-agent';
    const meta = document.createElement('div');
    meta.className = 'roster-meta';
    meta.textContent = subAgentMetaLine(sa);
    main.appendChild(title);
    main.appendChild(meta);
    row.appendChild(main);

    // Only a running sub-agent can be stopped, and stopping one leaves its
    // siblings and the parent turn alone — that is the whole point of a
    // per-row control rather than the turn-level Stop.
    // Offered for every running sub-agent now that claude-code's Task has a
    // stop path too (the stopTask control on the parent's live query; an
    // opencode child is a real session and aborts normally). The driver
    // answers 501 if a backend turns out not to support it, and the button
    // says so rather than leaving a row that looks stopped and is not.
    if (sa.status === 'running' || sa.status === 'pending') {
      const stop = document.createElement('button');
      stop.className = 'roster-stop';
      stop.textContent = 'Stop';
      stop.title = 'Stop just this sub-agent';
      stop.addEventListener('click', async (e) => {
        e.stopPropagation();
        stop.disabled = true;
        try {
          const res = await fetch(`${driverBase}/abort-subagent`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: sa.agentId }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            stop.textContent = body.reason === 'unsupported' ? "can't stop" : 'failed';
            stop.title = body.error || 'Could not stop this sub-agent.';
          }
        } catch { /* the next refresh will show the real state */ }
        refreshSubAgents();
      });
      row.appendChild(stop);
    } else if (sa.status !== 'running' && sa.status !== 'pending') {
      // Only once it has stopped. Shaped like archiving a session, not
      // deleting one: the transcript stays where it is, this just stops the
      // sub-agent being tracked so it leaves the roster. Actual deletion
      // happens only when the parent session is deleted, which cascades.
      const forget = document.createElement('button');
      forget.className = 'roster-stop';
      forget.textContent = 'Forget';
      forget.title = 'Remove from this list. The transcript is kept, and is deleted only if this session is deleted.';
      forget.addEventListener('click', async (e) => {
        e.stopPropagation();
        forget.disabled = true;
        try {
          await fetch(`${driverBase}/forget-sub-agent`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: sa.agentId }),
          });
        } catch { /* the refresh below shows whatever actually happened */ }
        refreshSubAgents();
      });
      row.appendChild(forget);
    }

    row.addEventListener('click', () => {
      rosterPanel.classList.remove('open');
      openSubAgentAtBlocker(sa);
    });
    rosterPanel.appendChild(row);
  }
}

function subAgentMetaLine(sa) {
  const bits = [];
  if (sa.subagentType) bits.push(sa.subagentType);
  // "waiting" rather than "running": a sub-agent blocked on a permission is
  // not working, and unlike running it will not resolve on its own.
  if (sa.awaiting) bits.push(sa.awaiting === 'question' ? 'waiting for your answer' : 'waiting for your approval');
  else if (sa.status) bits.push(sa.status);
  // The model-written one-line status, when agentProgressSummaries supplied
  // one — more informative than the raw tool name when present.
  if (sa.summary) bits.push(sa.summary);
  if (sa.lastTool) bits.push(`→ ${sa.lastTool}`);
  if (sa.usage?.total_tokens) bits.push(`${sa.usage.total_tokens.toLocaleString()} tok`);
  if (sa.usage?.duration_ms) bits.push(`${Math.round(sa.usage.duration_ms / 1000)}s`);
  if (sa.backend) bits.push(sa.backend);
  return bits.join(' · ');
}

rosterBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  rosterPanel.classList.toggle('open');
  if (rosterPanel.classList.contains('open')) refreshSubAgents();
});
document.addEventListener('click', (e) => {
  if (!rosterPanel.contains(e.target) && e.target !== rosterBtn) rosterPanel.classList.remove('open');
});

// A Task tool bubble names a sub-agent but says nothing about it. This
// attaches the live status, and makes the bubble the natural way in.
// Open a sub-agent and land on the exact card it is blocked by. Used by the
// Agent bubble's "waiting" link and the roster row alike, so both behave the
// same way — getting to the session was never the hard part, finding the one
// card in it was.
function openSubAgentAtBlocker(sa) {
  const parent = sa.parentSessionId || currentSessionId;
  if (sa.agentId !== currentSessionId) {
    viewSession(sa.agentId, { knownChild: true, knownParent: parent });
  }
  if (sa.awaitingId) scrollToBubbleWhenReady(sa.awaitingId);
}

function refreshTaskBubbles() {
  for (const sa of subAgents) {
    const live = taskBubbleFor(sa);
    if (!live) continue;
    live.innerHTML = '';
    const text = document.createElement('span');
    text.textContent = subAgentMetaLine(sa) + ' · ';
    const open = document.createElement('span');
    open.className = 'task-open' + (sa.awaiting ? ' task-waiting' : '');
    open.textContent = sa.awaiting ? 'review the request' : 'open transcript';
    open.addEventListener('click', (e) => {
      e.stopPropagation();
      openSubAgentAtBlocker(sa);
    });
    live.appendChild(text);
    live.appendChild(open);
  }
}

// HD1: a delegated child is NOT in the roster, so its bubble cannot be fed by
// refreshTaskBubbles(). Its status comes from the session record instead —
// which the sessions poll already fetches, so this needs no new request and
// no new endpoint. Matched by delegateToolUseId, the tool_use id of the
// delegate_session call that created it, which is also that bubble's own id.
//
// Claude Code only: OpenCode's ToolContext exposes no per-call id, so
// delegateToolUseId is null there and these bubbles simply keep their default
// rendering. The nested row in the session list is the cross-backend surface.
// What a delegated child's state actually is, in words — §13d.
//
// The old vocabulary was running / idle / waiting-for-you, which had no way
// to say "this died" or "this is waiting out a usage limit". A child whose
// turn was killed rendered as `idle`, identical to one that had finished its
// work: §15's bug, one level up. Severity drives colour, because a failure
// nobody notices is the thing this whole area keeps getting wrong.
function delegateStatus(s) {
  if (s.pendingKind === 'question') return { text: 'waiting for your answer', sev: 'warn' };
  if (s.pendingKind === 'permission') return { text: 'waiting for your approval', sev: 'warn' };
  if (s.inFlight) return { text: 'running', sev: '' };

  const h = s.turnHealth;
  if (!h) return { text: 'idle', sev: '' };

  // A human stop is the one "down" state the user created on purpose, so it
  // is reported plainly rather than as a fault.
  if (h.stopped) return { text: 'stopped by you', sev: '' };

  if (h.resumeBlocked === 'quota_exhausted') {
    return { text: 'stopped — out of credit', sev: 'bad' };
  }
  if (h.resumeBlocked === 'strikes-exhausted') {
    return { text: 'failed — retries exhausted, needs you', sev: 'bad' };
  }
  if (h.resumeAt) {
    const at = new Date(h.resumeAt);
    const mins = Math.round((at.getTime() - Date.now()) / 60000);
    const when = mins <= 0 ? 'any moment'
      : mins < 90 ? `in ~${mins}m`
      : `at ${at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    // Scheduled means a backend told us when service resumes; that is a
    // wait, not a fault, and must not be coloured like one.
    return h.resumeScheduled
      ? { text: `waiting out a usage limit — resuming ${when}`, sev: 'warn' }
      : { text: `failed — retrying ${when}`, sev: 'warn' };
  }
  return { text: `failed — ${h.reason}`, sev: 'bad' };
}

// Built ONCE per bubble, then only its status text is updated.
//
// THE BUG THIS FIXES: this function used to do `entry.el.innerHTML = ''` on
// every sessions poll, which destroyed the delegation prompt a second after
// it appeared and would have reset any expand state every few seconds. A
// periodic refresh that throws away user-facing state is a bug independently
// of the collapse control — which is exactly why §13d deferred the collapse
// until this was fixed rather than building on top of it.
const delegateUI = new WeakMap();

function refreshDelegateBubbles() {
  for (const s of delegatedChildren) {
    if (!s.toolUseId) continue;
    const entry = msgs[s.toolUseId];
    if (!entry || !entry.el) continue;

    let ui = delegateUI.get(entry.el);
    if (!ui) {
      // The body currently holds the rendered delegation prompt. Move it —
      // do not discard it — into the collapsible half, so the prompt
      // survives and becomes the thing the header expands.
      const detail = document.createElement('div');
      detail.className = 'delegate-detail';
      while (entry.el.firstChild) detail.appendChild(entry.el.firstChild);

      const head = document.createElement('div');
      head.className = 'delegate-head';
      const title = document.createElement('span');
      title.className = 'delegate-title';
      const status = document.createElement('span');
      status.className = 'delegate-status';
      const open = document.createElement('span');
      open.className = 'task-open';
      open.addEventListener('click', (e) => {
        e.stopPropagation();   // or opening the session also toggles the fold
        // Deliberately NOT knownChild: a delegated session is promptable, so
        // it must open with its input bar and controls intact.
        viewSession(s.sessionId);
      });
      head.append(title, status, open);
      head.addEventListener('click', () => entry.el.classList.toggle('expanded'));

      entry.el.classList.add('delegate');
      entry.el.append(head, detail);
      ui = { title, status, open };
      delegateUI.set(entry.el, ui);
    }

    // The per-poll update: text only, so expand state and the prompt below
    // are untouched.
    const st = delegateStatus(s);
    ui.title.textContent = s.title || 'delegated session';
    ui.status.textContent = '· ' + st.text + (s.backend ? ' · ' + s.backend : '') + ' ·';
    ui.status.className = 'delegate-status' + (st.sev ? ' ' + st.sev : '');
    ui.open.textContent = s.pendingKind ? 'review the request' : 'open session';
    ui.open.classList.toggle('task-waiting', !!s.pendingKind);
  }
}

// Matched by the spawning tool_use id, which IS the Task bubble's own id —
// broadcast() uses the tool_use id for tool bubbles, so no extra bookkeeping
// is needed to tie the two together.
function taskBubbleFor(sa) {
  const toolUseId = sa.toolUseId || sa.native?.toolUseId;
  if (!toolUseId) return null;
  const entry = msgs[toolUseId];
  return entry && entry.el ? entry.el : null;
}

// Shown on a sub-agent's own session. Prompting one is refused by the driver
// (it is a record of delegated work, not a conversation), so the input bar is
// hidden rather than left there to fail.
function applySubAgentBanner() {
  subagentBanner.classList.toggle('show', currentSessionIsChild);
  // Promotion severs the parent link, so offering it while the sub-agent is
  // still working would let the user detach something mid-flight — out of
  // the parent's abort cascade and out of its roster, still running where
  // nobody is watching. The driver refuses it too; this stops the button
  // looking available in the first place. `currentSessionBlocked` covers the
  // case that prompted this: a sub-agent parked on a permission is still
  // running, however idle it looks.
  const busy = turnInFlight || !!awaitingInput || currentSessionBlocked;
  saPromoteBtn.disabled = busy;
  // HD6: "Keep", not "Promote". The roster's other action is Forget, and
  // Keep/Forget is a true antonym pair — both remove the row, differing only
  // in where it ends up. ("Session" was rejected as a button word: it is a
  // noun, so it reads as a label rather than an action.)
  saPromoteBtn.title = busy
    ? 'This sub-agent is still running — stop it, or answer what it is waiting on, before keeping it.'
    : 'Keep as a session of its own';
  const inputBar = document.getElementById('input-bar') || promptInput.closest('div');
  if (inputBar) inputBar.style.display = currentSessionIsChild ? 'none' : '';
  // The model picker, mode picker and Auto-approve all change how a session
  // RUNS, and a sub-agent transcript is not something the user runs — its
  // model and permissions were decided by the parent that delegated to it.
  // Leaving them live would offer settings that either do nothing or, worse,
  // quietly alter a child's next turn after it is kept. Hidden with the
  // input bar, and restored by Keep.
  const controlsRow = document.getElementById('controls-row');
  if (controlsRow) controlsRow.style.display = currentSessionIsChild ? 'none' : '';
}

saParentBtn.addEventListener('click', () => {
  if (currentSessionParent) viewSession(currentSessionParent);
});

saPromoteBtn.addEventListener('click', async () => {
  if (!currentSessionParent) return;
  saPromoteBtn.disabled = true;
  try {
    const res = await fetch(`${driverBase}/keep-session`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId }),
    });
    if (res.ok) {
      // It is an ordinary session now: promptable, listed on its own, and no
      // longer swept up by its old parent's archive/delete.
      currentSessionIsChild = false;
      currentSessionParent = null;
      applySubAgentBanner();
      refreshSessionsList({ full: true });
      // Said plainly, because the transcript above is misleading on its own:
      // it is the sub-agent's real record, but the model that answers your
      // next prompt here has not read it. A Claude Code sub-agent runs inside
      // its parent's process rather than as a session of its own, so there is
      // no conversation to resume — promoting gives you a session that starts
      // empty, with that transcript kept above it for reference.
      showLocalNotice(
        '*(Promoted to its own session. The transcript above is kept for reference, '
        + 'but the model starts here with an empty context — it has not read it. '
        + 'Quote anything you want it to work from.)*'
      );
    }
  } catch { /* leave the banner as-is; the next resync re-reads the truth */ }
  saPromoteBtn.disabled = false;
});

// ── Global pending-approval indicator ─────────────────────────────────────
// Driven by the driver's /pending-approvals, refreshed on the same meta
// pings the sessions panel uses. Clicking jumps to the oldest waiting ask —
// switching session first if it belongs to another one, which is the common
// case now that a sub-agent's card lives in its own child session.
const pendingApprovalsBtn = document.getElementById('pending-approvals-btn');
let pendingApprovalsList = [];

async function refreshPendingApprovals() {
  if (!driverBase) return;
  try {
    const res = await fetch(`${driverBase}/pending-approvals`);
    if (!res.ok) return;
    const data = await res.json();
    pendingApprovalsList = Array.isArray(data.pending) ? data.pending : [];
  } catch {
    return; // transient; the next ping retries
  }
  renderPendingApprovals();
}

function renderPendingApprovals() {
  const n = pendingApprovalsList.length;
  pendingApprovalsBtn.classList.toggle('show', n > 0);
  if (!n) return;
  const elsewhere = pendingApprovalsList.filter((p) => p.sessionId !== currentSessionId).length;
  pendingApprovalsBtn.textContent = n === 1 ? '1 waiting' : `${n} waiting`;
  pendingApprovalsBtn.title = elsewhere
    ? `${n} approval${n === 1 ? '' : 's'} waiting on you (${elsewhere} in another session) — click to go to the oldest`
    : `${n} approval${n === 1 ? '' : 's'} waiting on you in this session`;
}

pendingApprovalsBtn.addEventListener('click', () => {
  const oldest = pendingApprovalsList
    .slice()
    .sort((a, b) => String(a.askedAt || '').localeCompare(String(b.askedAt || '')))[0];
  if (!oldest) return;
  if (oldest.sessionId !== currentSessionId) viewSession(oldest.sessionId);
  // The card may not be rendered yet when the session was just switched —
  // history arrives over SSE a moment later — so the scroll is deferred
  // until the bubble actually exists, with a bounded number of attempts
  // rather than an open-ended retry.
  scrollToBubbleWhenReady(oldest.id);
});

function scrollToBubbleWhenReady(bubbleId, attemptsLeft = 20) {
  const entry = msgs[bubbleId];
  if (entry && entry.wrap) {
    entry.wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
    entry.wrap.classList.add('flash-target');
    setTimeout(() => entry.wrap.classList.remove('flash-target'), 1600);
    return;
  }
  if (attemptsLeft <= 0) return;
  setTimeout(() => scrollToBubbleWhenReady(bubbleId, attemptsLeft - 1), 150);
}

// ── Attention: desktop notifications, tab-title flag, sound ───────────────
// Three channels, deliberately layered. The tab-title flag is the only one
// that always works (no permission, no secure context) so it is the floor;
// the OS notification is the upgrade when the browser allows it; the sound
// is opt-in on top. Every channel is gated on the user actually being away
// — the single biggest reason notification features get switched off is
// firing them at someone who is already looking at the screen.

function notifySupported() { return typeof window.Notification === 'function'; }
function notifyPermission() { return notifySupported() ? Notification.permission : 'unsupported'; }

function refreshNotifyUi() {
  notifySoundRow.classList.toggle('disabled', !settings.notify);
  notifySound.disabled = !settings.notify;
  let msg = '';
  if (settings.notify) {
    const perm = notifyPermission();
    if (!notifySupported()) {
      // Overwhelmingly Safari on http://localhost: unlike Chrome and Firefox
      // it declines to treat a plain-HTTP loopback origin as a secure
      // context, so the constructor simply isn't there. Same story for
      // anyone reaching the viewer over a LAN address under --host-network.
      msg = 'Desktop notifications need a secure context, which this browser does not grant to a plain-HTTP address. The tab title will still flag a finished turn.';
    } else if (perm === 'denied') {
      msg = 'Notifications are blocked for this site — re-allow them in your browser’s site settings. The tab title will still flag a finished turn.';
    } else if (perm !== 'granted') {
      msg = 'Notification permission was dismissed. Untick and re-tick this box to be asked again; meanwhile the tab title will still flag a finished turn.';
    }
  }
  notifyNote.textContent = msg;
  notifyNote.classList.toggle('show', !!msg);
}

// document.hidden alone is not enough: it stays false for the active tab of
// a window that is itself buried behind an editor, which is the single most
// common way to be "away" from the viewer. hasFocus() catches that.
function userIsAway() { return document.hidden || !document.hasFocus(); }

const NOTIFY_BASE_TITLE = document.title;
let notifyTitleMark = null;
function setTitleMark(mark) {
  if (notifyTitleMark === mark) return;
  notifyTitleMark = mark;
  document.title = mark ? mark + ' ' + NOTIFY_BASE_TITLE : NOTIFY_BASE_TITLE;
}
function clearTitleMark() { setTitleMark(null); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) clearTitleMark(); });
window.addEventListener('focus', clearTitleMark);

let notifyAudioCtx = null;
function primeAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!notifyAudioCtx) notifyAudioCtx = new Ctx();
    if (notifyAudioCtx.state === 'suspended') notifyAudioCtx.resume();
  } catch { /* no audio available; the other channels still work */ }
}
// Returns whether a sound was actually produced, which is what decides
// whether the OS notification gets muted — resume() is async and can simply
// fail (no user activation yet), so assuming the beep played would leave a
// notification that is silent in both channels.
async function beep() {
  if (!settings.notifySound) return false;
  primeAudio();
  if (!notifyAudioCtx) return false;
  if (notifyAudioCtx.state === 'suspended') {
    try { await notifyAudioCtx.resume(); } catch { return false; }
  }
  if (notifyAudioCtx.state !== 'running') return false;
  try {
    const t = notifyAudioCtx.currentTime;
    const osc = notifyAudioCtx.createOscillator();
    const gain = notifyAudioCtx.createGain();
    osc.frequency.value = 880;
    // Ramped rather than switched: an abrupt start/stop on a sine clicks.
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    osc.connect(gain).connect(notifyAudioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.26);
    return true;
  } catch { return false; }
}

// An AudioContext built without user activation starts suspended and cannot
// be resumed until the page has been interacted with. Typing a prompt counts,
// so after a reload this is almost always primed well before the turn it
// belongs to ends — without it, the first notification after every reload
// would be silent.
//
// Gated on the sound setting rather than registered unconditionally: the
// overwhelming majority of page loads never enable this, and they should not
// be made to build an audio graph on their first click for nothing. Kept
// listening (rather than {once:true}) until it has actually primed, so
// turning the setting on later is still picked up by the next interaction.
const AUDIO_PRIME_EVENTS = ['pointerdown', 'keydown'];
function primeAudioOnInteraction() {
  if (!settings.notifySound) return;
  primeAudio();
  if (notifyAudioCtx && notifyAudioCtx.state === 'running') {
    for (const evt of AUDIO_PRIME_EVENTS) window.removeEventListener(evt, primeAudioOnInteraction);
  }
}
for (const evt of AUDIO_PRIME_EVENTS) {
  window.addEventListener(evt, primeAudioOnInteraction, { passive: true });
}

// Exactly one tab wins a given (session, class) event. Web Locks is the
// standard cross-tab election primitive and needs no coordination protocol:
// whoever asks first while the lock is free gets it, everyone else is handed
// null and bails. Without this, opening a second tab — which by default
// lands on the SAME session, since resolveInitialSessionId falls back to the
// shared lastViewedSessionId — would double every beep.
function claimOnce(key, holdMs = 1500) {
  if (!navigator.locks || typeof navigator.locks.request !== 'function') return Promise.resolve(true);
  // The hold is deliberately NOT on the caller's critical path. navigator
  // .locks resolves its request promise only once the callback settles, so
  // awaiting the hold inside would delay every notification by holdMs. The
  // outcome is reported the instant it is known; the lock keeps itself held
  // in the background purely so a tab whose SSE delivery lagged by a few
  // hundred ms finds it taken rather than firing a duplicate.
  return new Promise((settle) => {
    let decided = false;
    const decide = (won) => { if (!decided) { decided = true; settle(won); } };
    // try/catch as well as .catch: a synchronous throw would otherwise escape
    // this executor, reject the promise, and take fireAttention's await down
    // with it — losing the notification entirely over a dedup optimisation.
    try {
      navigator.locks.request('pp-notify:' + key, { ifAvailable: true }, (lock) => {
        decide(!!lock);
        if (!lock) return undefined;
        return new Promise((release) => setTimeout(release, holdMs));
      }).catch(() => decide(true));
    } catch { decide(true); }
  });
}

// Session titles for cross-session notification bodies. The sessions panel's
// cache is only populated once that panel has been opened, so a tab that has
// never opened it needs its own lookup — fetched at most once and refreshed
// only on a miss, since this is cosmetic and must never delay a notification.
const notifyTitleCache = new Map();
let notifyTitleFetch = null;
// Same derivation buildSessionItem uses, so a notification names a session
// exactly as the sessions panel does.
function sessionTitleOf(s) { return s.customTitle || s.summary || s.firstPrompt || ''; }
function rememberSessionTitles(list) {
  for (const s of list || []) {
    const t = s && s.sessionId ? sessionTitleOf(s) : '';
    if (t) notifyTitleCache.set(s.sessionId, t);
  }
}
function sessionLabel(sessionId) {
  // The sessions panel keeps its own cache the moment it has ever been
  // opened — reuse it before spending a request.
  if (!notifyTitleCache.has(sessionId) && lastSessionsResult) {
    rememberSessionTitles(lastSessionsResult.sessions);
  }
  if (notifyTitleCache.has(sessionId)) return notifyTitleCache.get(sessionId);
  // Deliberately NOT awaited. /sessions is a heavyweight call on the driver
  // (a full multi-backend enumeration with a realpath per project), and a
  // notification that arrives late or not at all because a cosmetic label
  // lookup stalled would be a much worse bug than a generic label. Warm the
  // cache for next time and name it generically this time.
  if (driverBase && !notifyTitleFetch) {
    notifyTitleFetch = (async () => {
      try {
        const res = await fetch(driverBase + '/sessions');
        if (res.ok) rememberSessionTitles((await res.json()).sessions);
      } catch { /* cosmetic only */ }
      notifyTitleFetch = null;
    })();
  }
  return 'another session';
}

async function fireAttention({ sessionId, cls, ref, mark, title, body, sticky }) {
  if (!settings.notify) return;

  // Read once, up front: everything below awaits, and currentSessionId can
  // change under us if the user switches session mid-flight — which would
  // otherwise flip the label and the click behaviour halfway through.
  const isCurrent = sessionId === currentSessionId;

  // The title flag describes THIS tab, so it only ever reflects the session
  // this tab is actually showing — flagging it for someone else's session
  // would point the user at the wrong conversation when they come back.
  if (isCurrent && userIsAway()) setTitleMark(mark);

  // Distinct events of the same class must not collapse into each other:
  // `ref` (a permission card's id) keeps two approvals raised seconds apart
  // as two notifications, since the turn is blocked on the second just as
  // much as the first. Turn ends need no ref — arming already guarantees one
  // per turn.
  const dedup = sessionId + ':' + cls + (ref ? ':' + ref : '');

  // Claim order, most-entitled first: a FOCUSED tab showing this session
  // goes at 0ms, any other tab showing it at 50ms, everyone else at 150ms.
  // The focused one must get there first because its job is to win and then
  // suppress (below) on every tab's behalf — if it bailed out early instead,
  // some background tab showing an unrelated session would take the lock and
  // announce a turn the user is sitting and watching finish.
  const delay = isCurrent ? (document.hasFocus() ? 0 : 50) : 150;
  if (delay) await new Promise((r) => setTimeout(r, delay));
  if (!(await claimOnce(dedup))) return;

  // Decided only after winning the claim, and scoped to THIS session: being
  // parked on session T with S finishing in the background is still worth a
  // notification — it is only watching S itself finish that isn't.
  if (isCurrent && !userIsAway()) return;

  // Awaited so `silent` below reflects whether a sound actually came out.
  const beeped = await beep();
  if (!notifySupported() || notifyPermission() !== 'granted') return;
  try {
    const label = isCurrent ? null : sessionLabel(sessionId);
    const n = new Notification(title, {
      body: label ? label + ' — ' + body : body,
      // Same tag ⇒ the browser replaces rather than stacks, and with
      // renotify unset the replacement is silent. Belt-and-braces with the
      // lock above: it also collapses repeats across reloads of this tab.
      tag: 'podprompt:' + dedup,
      // Turn ends share one tag per session (there is no per-turn id to key
      // on), so without renotify a second finished turn would quietly
      // *replace* an undismissed first one and never alert at all. renotify
      // keeps the replace — one card per session rather than a stack of
      // five — while still announcing each one.
      renotify: true,
      // A blocked turn is waiting on a human and should not quietly expire
      // off-screen; a finished one is just information.
      requireInteraction: !!sticky,
      // Muted only if our own beep genuinely played a moment ago, so the two
      // sounds don't double up. If it didn't — muted tab, no user activation
      // yet, sound switched off — the platform's default notification sound
      // is left well alone rather than suppressed for nothing.
      silent: beeped,
    });
    n.onclick = () => {
      window.focus();
      clearTitleMark();
      if (sessionId !== currentSessionId) viewSession(sessionId);
      n.close();
    };
  } catch { /* some platforms reject the constructor; other channels already ran */ }
}

// Per-session arming. A turn_end only means something if this page saw the
// matching turn_start, which keeps a reconnect, a session switch, or a
// replayed backlog from announcing a turn that ended long ago.
// Map rather than Set so stale arms can age out: a turn_start whose
// turn_end never arrives (stream drop, driver restart) would otherwise sit
// in here for the lifetime of the page, and a much later unrelated turn_end
// for that session would find it armed and fire.
const notifyArmed = new Map();
const ARM_TTL_MS = 6 * 60 * 60 * 1000;
function armSession(sessionId) {
  const now = Date.now();
  for (const [id, t] of notifyArmed) if (now - t > ARM_TTL_MS) notifyArmed.delete(id);
  notifyArmed.set(sessionId, now);
}
function disarmSession(sessionId) {
  const armedAt = notifyArmed.get(sessionId);
  notifyArmed.delete(sessionId);
  return armedAt !== undefined && Date.now() - armedAt <= ARM_TTL_MS;
}

const TURN_END_NOTICES = {
  completed: { mark: '●', title: 'Turn finished', body: 'Ready for your next prompt.' },
  error: { mark: '✗', title: 'Turn failed', body: 'The turn ended with an error.' },
};

function notifyTurnEnd(sessionId, reason) {
  // Only turns this page watched start to finish, and never a Stop the user
  // just clicked themselves — they are standing right there and know.
  if (!disarmSession(sessionId)) return;
  const notice = TURN_END_NOTICES[reason || 'completed'];
  if (!notice) return; // 'aborted' is deliberately silent
  // The parent's turn ending and its sub-agents finishing are different
  // facts (D6): background children outlive the call that spawned them, so
  // "ready for your next prompt" is true while work is still running. Saying
  // both keeps the notification honest instead of implying silence.
  let body = notice.body;
  if (sessionId === currentSessionId) {
    const running = rosterRunningCount();
    if (running) body += ` ${running} sub-agent${running === 1 ? '' : 's'} still running.`;
  }
  fireAttention({ sessionId, cls: 'turn', mark: notice.mark, title: notice.title, body });
}

function notifyNeedsInput(sessionId, kind, ref) {
  fireAttention({
    sessionId,
    cls: 'input',
    ref,
    mark: '?',
    title: kind === 'question' ? 'Waiting on your answer' : 'Waiting on your approval',
    body: kind === 'question'
      ? 'The model asked a question and is paused until you answer.'
      : 'A tool needs your approval before the turn can continue.',
    sticky: true,
  });
}

function exportMarkdown() {
  const lines = [];
  for (const id of feedOrder) {
    const entry = msgs[id];
    if (!entry) continue;
    const roleLabel = labelFor(entry.role);
    const modelPart = settings.showModelOn === 'all-bubbles' ? (entry.role !== 'user' ? ` (${entry.model})` : '' ) : (entry.role === 'assistant' ? ` (${entry.model})` : '' );
    lines.push(`### ${roleLabel}${modelPart}`, '', entry.rawText || '', '');
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'conversation.md';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Input bar: talks to driver.mjs directly (a different port from this

let driverBase = null; // resolved from /config before the input bar works

// consumed by the next submitPrompt() call for that same session id (its

// and this map mirrors it so session-keyed calls (/models, /modes, history

// driver.mjs resolves the CLI default (claude-code) — the pickers latch that

  // the pickers were fetched for, they latched the wrong one and must re-fetch.

    modelsRetryCount = 0;

    modesResolved = false;
    modesResolvedBackend = null;
    clearTimeout(modesRetryTimer); modesRetryTimer = null;
    modesRetryCount = 0;
    modeSelect.classList.remove('show');
    modeSelect.innerHTML = '';
    modesFetchSeq++;

  }
}

const promptInput  = document.getElementById('prompt-input');

async function loadDriverConfig() {
  try {
    const res = await fetch('/config');
    const cfg = await res.json();
    driverBase = `${location.protocol}//${location.hostname}:${cfg.driverPort}`;
    // connect() and loadDriverConfig() both fire from the same window.load
    // handler, racing each other — resyncTurnStatus()/loadModes()/
    // loadModels() are also called from es.onopen (see connect()), but ALL
    // THREE silently no-op if driverBase isn't set yet (each starts with
    // `if (!driverBase) return;`), and nothing else ever retries them. If
    // the SSE connection happens to finish opening before this /config
    // fetch resolves — which real-world timing shows can easily go either
    // way — those calls are lost for good: the model/mode switchers and
    // the auto-approve checkbox's resynced state just never appear, with
    // no visible error, until the next full reconnect (if any). Calling
    // them again here, now that driverBase is *definitely* set, guarantees
    // at least one of the two call sites succeeds regardless of which
    // finished first; the redundant second call (whichever fires second)
    // is harmless.
    resyncTurnStatus();
    loadModes();
    loadModels();
    refreshPendingApprovals();
    // Gate state is global and survives restarts, so the strip has to be
    // correct from first paint — not only after something happens to tick
    // it. The poll is the backstop for the two changes nothing notifies this
    // tab about: another tab acting, and an uncapped window lapsing on its
    // own deadline with nobody watching.
    refreshAutonomy();
    setInterval(refreshAutonomy, 20000);
    // MD1: tell the driver what this tab is looking at, and keep saying so.
    reportViewing(true);
    startViewingHeartbeat();
    refreshMail();
    loadDeepHistorySetting();
    // The restart case is precisely when the page has just been reloaded,
    // so this has to be correct from first paint rather than only after
    // something happens to tick it.
    refreshResumeBar();
  } catch (e) {
    console.error('Failed to load /config:', e);
  }
}

// A second, independent reason the textarea can be disabled, alongside

// than a parallel disablement path (see updatePromptDisabled()). Set by
// loadModels() below: 'unavailable' means this session's actual model isn't
// among the currently-confirmed options yet (still-loading provider, or a
// genuinely removed/renamed model); 'unreachable' means the whole backend
// process is down. Both are honest "this can't be sent right now" states,
// not silent failures discovered only after the user hits send.
// Mutable, not the fixed string it used to be — the backend a session is
// bound to is genuinely model-specific ("Claude" was hardcoded here before),
// so this now tracks whichever backend the viewed session resolves to (see
// updateBackendIndicator()) and falls back to a generic placeholder before
// that's known at all. Still just the "no block reason active" fallback —
// modelBlockReason's two states below always take priority over it, exactly
// as before.
let DEFAULT_PROMPT_PLACEHOLDER = promptInput.placeholder;
