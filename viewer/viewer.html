<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PodPrompt</title>

<!-- Applies saved font-size/width/theme before first paint, so there's no
     flash of default sizing on load. Kept intentionally tiny and dependency-free. -->
<script>
(function() {
  try {
    var s = JSON.parse(localStorage.getItem('viewerSettings') || '{}');
    var root = document.documentElement;
    if (s.fontSize) root.style.setProperty('--font-size', s.fontSize + 'px');
    if (s.width) root.style.setProperty('--content-width', s.width + 'px');
    if (s.theme === 'light') root.setAttribute('data-theme', 'light');
  } catch (e) {}
})();
</script>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<!-- marked (markdown) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

<!-- highlight.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
  /* ── Design tokens ─────────────────────────────────────────────────── */
  :root {
    --bg:        #0f1117;
    --surface:   #181c27;
    --border:    #252a38;
    --text:      #d4d8e8;
    --muted:     #5a617a;
    --accent:    #5b8dee;
    --user-bg:   #1a1f2e;
    --user-border: #2a3050;
    --assistant-bg: #181c27;
    --code-bg:   #12151f;
    --green:     #4ade80;
    --purple:    #a78bfa;
    --opencode-accent: #2dd4bf;
    --heading:   #eef0f8;
    --em-color:  #b0bcd8;
    --inline-code-color: #a5b4fc;
    --zebra-row: rgba(255,255,255,.02);
    /* Defined in BOTH themes on purpose. A var() fallback would silently
       win and ignore the theme — which is exactly how the sub-agent roster
       stopped respecting light mode. */
    --warn:      #fbbf24;
    --warn-bg:   #2a2213;
    --danger:    #f87171;
    --sans: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --radius: 10px;
    --font-size: 15px;
    --content-width: 860px;
    --label-font-size: 11px;
    --status-font-size: 12px;
  }

  /* ── Light theme override ─────────────────────────────────────────── */
  /* Values chosen for the same WCAG-friendly contrast a dark-on-light chat
     UI needs (headings/code darker than body text, not near-white
     accents carried over unchanged from the dark palette). */
  :root[data-theme="light"] {
    --bg:        #f4f5fa;
    --surface:   #ffffff;
    --border:    #e1e4ee;
    --text:      #1d2233;
    --muted:     #5b6478;
    --accent:    #3b6fe0;
    --user-bg:   #eaeefb;
    --user-border: #c7d2f4;
    --assistant-bg: #ffffff;
    --code-bg:   #f0f1f6;
    --green:     #15803d;
    --purple:    #7c3aed;
    --opencode-accent: #0d9488;
    --heading:   #10131f;
    --em-color:  #475569;
    --inline-code-color: #4338ca;
    --zebra-row: rgba(15,23,42,.035);
    --warn:      #92400e;
    --warn-bg:   #fef3c7;
    --danger:    #dc2626;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: var(--font-size);
    line-height: 1.65;
  }

  /* ── Layout ────────────────────────────────────────────────────────── */
  #app {
    display: grid;
    grid-template-rows: 48px 1fr auto;
    height: 100vh;
    max-width: var(--content-width);
    margin: 0 auto;
    position: relative;
  }

  /* ── Header ────────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .02em;
  }
  header .logo {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .85;
    flex-shrink: 0;
    transition: background .25s ease;
  }
  /* Per-backend dot color — set via updateBackendIndicator() whenever the
     viewed session's backend is known; falls back to the base --accent
     color above (unchanged from before this existed) while unresolved. */
  header .logo.backend-claude-code { background: var(--accent); }
  header .logo.backend-opencode    { background: var(--opencode-accent); }
  header span { flex: 1; }
  /* ── Backend badge (next to the app title) ────────────────────────────
     Empty/hidden until updateBackendIndicator() knows the viewed session's
     backend (see the same function that colors header .logo above) — a
     freshly-loaded page with no session open yet shows just the bare app
     name, not a stale or default backend label. */
  #backend-badge {
    font-size: .78em;
    font-weight: 400;
    color: var(--muted);
    opacity: .8;
  }
  #backend-badge:empty { display: none; }
  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  #status-dot.live  { background: var(--green); }
  #status-dot.error { background: #f87171; }

  /* ── Context-usage bar (both backends) + plan/spend indicator ───────── */
  /* Hidden until the first context_usage/plan_usage/spend status arrives
     for the currently-viewed session — see the SSE 'status' handler — and
     reset back to hidden on every session switch (viewSession()), so a
     freshly-opened chat never shows a stale reading left over from
     whatever session was viewed before it. */
  #context-usage-wrap {
    display: none;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  #context-usage-wrap.show { display: flex; }
  #context-usage-bar {
    width: 56px;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
  }
  #context-usage-fill {
    height: 100%;
    width: 0%;
    background: var(--green);
    transition: width .4s ease, background .3s ease;
  }
  #context-usage-fill.warn { background: #f59e0b; }
  #context-usage-fill.crit { background: #f87171; }
  /* Actively compacting overrides the percentage color with a pulsing
     accent — a distinct visual state from "just a high percentage",
     mirroring the TUI's own compacting-in-progress display. */
  #context-usage-fill.compacting {
    background: var(--accent) !important;
    animation: compacting-pulse 1.2s ease-in-out infinite;
  }
  @keyframes compacting-pulse { 50% { opacity: .3; } }
  #context-usage-label { font-size: 11px; color: var(--muted); white-space: nowrap; }

  #plan-usage-wrap {
    display: none;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  /* Deliberately the same red as #context-usage-fill.crit, for the same
     "you're in trouble" meaning — but no intermediate amber tier here (see
     the plan_usage handler below for why: this is a plain-text label, not a
     fill bar, so a single normal/warning state reads more cleanly than a
     three-stage gradient would). */
  #plan-usage-wrap.warn { color: #f87171; }
  #plan-usage-wrap.show { display: block; }

  header button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 5px 7px;
    border-radius: 6px;
  }
  header button:hover { background: var(--border); color: var(--text); }

  /* ── Settings panel ────────────────────────────────────────────────── */
  /* Was a single 230px column of ~14 rows — taller than most browser
     windows. Now a fixed-size grid of column groups (see .settings-columns
     below) so it grows wide instead of tall; #settings-panel itself still
     caps its own height and scrolls internally (max-height/overflow-y) as a
     backstop, since a future added row/group could still push total content
     past viewport height even in a 2-column layout, and a panel with no
     escape hatch that overflows off the bottom of the screen is worse than
     one that merely scrolls. */
  #settings-panel {
    display: none;
    position: absolute;
    top: 48px;
    /* Right-anchored, so widening for the third column grows the panel
       LEFTWARDS and its right edge stays flush with the chat area exactly
       as before. */
    right: 20px;
    width: 690px;
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 64px);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 20;
  }
  #settings-panel.open { display: block; }
  .settings-columns {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0 24px;
  }
  /* Narrow windows (or this panel's own max-width kicking in) collapse back
     to one column rather than squeezing two columns into too little space
     — the same reason max-width above exists: nothing here should ever be
     able to push content past the viewport's edge. */
  /* Stepped down rather than straight to one: three columns need roughly
     690px, two need roughly 460px, and squeezing three into a 600px window
     would clip the selects rather than wrap them. Ordered widest-first so
     the narrower rule wins where both match. */
  @media (max-width: 740px) {
    .settings-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 520px) {
    .settings-columns { grid-template-columns: 1fr; }
  }
  .settings-col {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
  }
  .settings-group { min-width: 0; }
  .settings-row { margin-bottom: 14px; font-size: 13px; min-width: 0; }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .settings-row input[type="range"] { width: 100%; margin-top: 6px; }
  .settings-row .row-value { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Rows whose control is a <select>: stacked (label text above, select
     below spanning the full row width) rather than side-by-side. A
     <select> sizes itself to its longest <option> text regardless of
     flexbox shrink rules in every browser tested, which is exactly what
     used to push one of these past the panel's right edge under the old
     side-by-side layout — width:100% on a full-width block below the label
     can't overflow the row no matter how long its options' text is. */
  .settings-row.select-row label {
    display: block;
  }
  .settings-row.select-row label > span { display: block; margin-bottom: 4px; }
  .settings-row select {
    background: var(--code-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 12px;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  /* ── Sub-agents ──────────────────────────────────────────────────────── */
  /* A banner on a sub-agent's own session: it is a record of delegated work,
     not a conversation, so the input bar is hidden and this explains why and
     offers the two things that ARE possible here. */
  #subagent-banner { display: none; }
  #subagent-banner.show {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 0 auto 10px; max-width: var(--content-width, 860px);
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); font-size: 13px;
  }
  #subagent-banner .sa-label { color: var(--muted); }
  #subagent-banner .sa-spacer { flex: 1; }
  #subagent-banner button { font-size: 12px; padding: 2px 8px; }

  /* Roster: this session's sub-agents, with live status. Opened from the
     Task bubble or the header count — the same place both CLIs put it. */
  #roster-panel {
    display: none; position: absolute; right: 10px; top: 44px; z-index: 40;
    width: 340px; max-height: 60vh; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); padding: 8px;
  }
  #roster-panel.open { display: block; }
  .roster-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 5px; cursor: pointer;
  }
  .roster-row:hover { background: var(--code-bg); }
  /* A dot means "this needs your attention or is live" — the same thing it
     means on a session row. A finished sub-agent gets NO dot: giving it a
     green one made the quietest state the most visually prominent, and
     collided with green-means-running elsewhere in the UI. The element is
     still laid out so rows stay aligned. */
  .roster-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: transparent; }
  /* Green for running, matching .session-badge — that is already what "a
     turn is running" looks like everywhere else in this UI. */
  .roster-dot.running, .roster-dot.pending { background: var(--green); animation: badge-pulse 1.4s ease-in-out infinite; }
  /* Blocked on a human: the one state that will not clear on its own, so it
     is held steady rather than pulsing like work in progress. */
  .roster-dot.waiting { background: var(--purple); }
  .roster-dot.failed, .roster-dot.killed { background: #f87171; animation: none; }
  .roster-main { flex: 1; min-width: 0; }
  .roster-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--text); }
  .roster-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roster-stop { font-size: 11px; padding: 1px 6px; }
  .roster-empty { color: var(--muted); font-size: 12.5px; padding: 8px; }

  /* Brief highlight after jumping to a specific card, so the thing you were
     sent to find is obvious on arrival. */
  .flash-target { animation: flash-target 1.6s ease-out; }
  @keyframes flash-target {
    0%, 20% { background: var(--accent); }
    100% { background: transparent; }
  }

  /* The task's own title, sitting in the Agent bubble's label beside the
     role name — "Agent  Quick roster probe  10:42 PM". */
  .msg-label .agent-title {
    text-transform: none;
    letter-spacing: normal;
    font-weight: 500;
    /* No colour of its own: it inherits the label's, so the title reads as
       part of "AGENT <title>" rather than as separate content. Same reason
       .model carries no colour in a MODEL bubble. */
    margin-right: 6px;
  }
  /* The sub-agent's live status, in the bubble body. Deliberately at normal
     body size rather than the small muted treatment a tool one-liner gets:
     this is the substance of the bubble, not a footnote to it. */
  .agent-live { color: var(--muted); }
  /* Deliberately NOT scoped to .agent-live. These rules were written for the
     roster's sub-agent bubbles, whose body carries that class — but
     refreshDelegateBubbles() puts the same .task-open control inside a
     delegate_session TOOL bubble, which does not. The descendant selector
     therefore never matched there, and "open session" rendered as plain
     text: no underline, no accent, not even a pointer cursor. A control
     that cannot be recognised as clickable is not a link. The class name is
     specific enough to stand alone; the .agent-live prefix was only ever an
     accident of where it was first used. */
  .task-open { cursor: pointer; text-decoration: underline; color: var(--accent); }
  .task-open.task-waiting { color: var(--purple); font-weight: 500; }

  /* Global "something is waiting on you" indicator. Hidden unless there is
     actually something, so the header is unchanged in the normal case. It
     exists because a parked approval is otherwise only discoverable by
     already looking at that session — and a sub-agent's card lives in a
     child session the user may never have opened. */
  #pending-approvals-btn {
    display: none;
    background: var(--surface);
    border-color: var(--accent);
    color: var(--accent);
    font-size: 12px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  #pending-approvals-btn.show { display: block; }
  /* Hidden until this session has actually spawned a sub-agent, so the header
     is unchanged for the ordinary case. */
  #roster-btn { display: none; font-size: 12px; padding: 2px 8px; white-space: nowrap; }
  #roster-btn.show { display: block; }

  /* ── Messaging: inbox, budgets, pause ─────────────────────────────────
     ONE header slot for the whole subsystem. The bar already carries four
     icon buttons and three status widgets, and this UI has no generic panel
     menu — panels are opened BY header buttons — so a second slot for the
     same feature was not affordable. */
  #jump-latest { display: none; }
  #jump-latest.show {
    display: block;
    margin: 0 auto 12px; max-width: var(--content-width, 860px);
    padding: 7px 12px; text-align: center; cursor: pointer;
    border: 1px dashed var(--border); border-radius: 6px;
    background: var(--surface); color: var(--muted); font-size: 13px;
  }
  #jump-latest.show:hover { color: var(--accent); border-color: var(--accent); }

  /* Sits ABOVE the input bar rather than inside it. A button that appears
     and vanishes inside the bar moves Send at exactly the moment you are
     reaching for it — and this strip needs room to say WHICH failure
     happened, since that changes what you would do next. */
  #resume-bar { display: none; }
  /* Appearance deliberately unchanged — still centred at the content width,
     still warn-tinted. The vertical margin is ZERO because #feed is a flex
     column with gap:20px: any margin here would STACK on that gap and the
     bar would float away from the conversation it belongs to. Bubbles rely
     on the same gap, which is what makes this sit flush among them. */
  #resume-bar.show {
    display: flex; align-items: center; gap: 10px;
    margin: 0 auto; max-width: var(--content-width, 860px);
    padding: 6px 12px; border: 1px solid var(--warn); border-radius: 6px;
    background: var(--warn-bg); color: var(--warn); font-size: 13px;
  }
  #resume-bar .rb-spacer { flex: 1; }
  #resume-bar button {
    font-size: 12px; padding: 2px 10px;
    border-color: var(--warn); color: var(--warn); background: transparent;
  }
  #resume-bar #resume-dismiss { padding: 2px 7px; }

  /* Generated continuation text. Collapsed to a one-line marker: the point
     is that the turn resumed, not the boilerplate that made it resume. */
  /* opacity applies to the whole container and is the intended effect. The
     background/border-color that used to sit here were inert for the same
     reason as the peer rule above — .msg paints nothing — so they are gone
     rather than left to imply they do something. The body is hidden anyway. */
  .msg.user.from-resume { opacity: .75; }
  .msg.user.from-resume .msg-body { display: none; }
  .msg.user.from-resume .msg-label .role-name,
  .msg.user.from-resume .msg-label .agent-title { color: var(--muted); }

  /* A turn nobody typed. Tinted differently from a user bubble so it is
     obvious at a glance when scrolling back weeks later — the failure this
     prevents is silent: misremembering an agent-caused turn as your own. */
  /* Styled on .msg-BODY, not .msg. `.msg` is a transparent flex container
     with no border — the visible bubble is .msg-body (see
     `.msg.user .msg-body`), and .msg-label sits OUTSIDE it, above, on the
     feed background. Painting .msg therefore drew a surface-coloured strip
     behind the PEER label that no other bubble has, while `border-color`
     did nothing at all because .msg has no border-width or border-style.
     Tinting the body is what every other bubble variant does. */
  /* Collapsible, same mechanism as Thinking and Tool: the body is hidden
     unless .expanded is on the wrapper. Unlike those two, .expanded is added
     by default (see applyOrigin) — a peer message is content, not detail. */
  .msg.user.from-peer .msg-body {
    display: none;
    background: var(--surface);
    border-color: var(--accent);
  }
  .msg.user.from-peer .msg-label .role-name { color: var(--accent); }
  .msg.user.from-peer .msg-label .agent-title { color: var(--accent); }
  .msg.user.from-peer.expanded .msg-body { display: block; }
  .msg.user.from-peer .msg-label .peer-toggle { cursor: pointer; user-select: none; }
  .msg.user.from-peer .msg-label .peer-toggle::before { content: '▸ '; }
  .msg.user.from-peer.expanded .msg-label .peer-toggle::before { content: '▾ '; }
  .msg.user.from-peer .msg-label .peer-toggle:hover { text-decoration: underline; }
  /* Underlined so it reads as a link rather than as part of the label.
     Dotted at rest and solid on hover: a solid underline on an always-
     present label looks like emphasis, while dotted reads as "actionable"
     without competing with the body text for attention. */
  .msg.user.from-peer .msg-label .peer-link {
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 2px;
  }
  .msg.user.from-peer .msg-label .peer-link:hover {
    text-decoration: underline solid;
    filter: brightness(1.25);
  }

  /* Exists ONLY while paused, which is why it can afford to be loud: it
     costs nothing in the normal case. A forgotten pause means a day spent
     wondering why delegation appears broken, so under-signalling here is far
     more expensive than over-signalling. */
  #paused-strip { display: none; }
  #paused-strip.show {
    display: flex; align-items: center; gap: 10px; position: relative;
    padding: 6px 14px; background: var(--warn-bg);
    border-bottom: 1px solid var(--warn); color: var(--warn);
    font-size: 13px;
  }
  #paused-strip .ps-spacer { flex: 1; }
  #paused-strip #ps-actions { display: flex; gap: 6px; align-items: center; }
  #paused-strip button {
    font-size: 12px; padding: 2px 10px;
    border-color: var(--warn); color: var(--warn); background: transparent;
  }
  #paused-strip button.danger { border-color: var(--danger); color: var(--danger); }
  /* Anchored to the strip rather than the button so it cannot be clipped by
     the strip's own overflow, and positioned from the right because the
     actions cluster sits at the right edge. */
  #lift-menu {
    position: absolute; right: 14px; top: 100%; z-index: 42;
    min-width: 260px; padding: 4px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
    box-shadow: 0 6px 20px rgba(0,0,0,.28);
  }
  .lift-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  .lift-row:hover { background: var(--code-bg); }
  /* The resolved absolute time, shown on EVERY entry — "for 4 hours" crosses
     midnight with the same ambiguity that makes a bare "8:00 AM" unclear at
     7 AM, so showing it only on the named one would be the odd choice. */
  .lift-when { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lift-row input[type="datetime-local"] {
    font-size: 12px; background: var(--code-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px;
  }

  .settings-row.disabled label { opacity: .45; }
  /* Explains why notifications are unavailable or blocked. Hidden unless it
     has something to say, so the group stays as compact as the others when
     everything is working. */
  .settings-note {
    display: none;
    font-size: 11px;
    line-height: 1.4;
    color: var(--muted);
    margin-top: 6px;
  }
  .settings-note.show { display: block; }
  .settings-group-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 8px;
  }

  /* ── Sessions panel ────────────────────────────────────────────────── */
  #sessions-panel {
    display: none;
    position: absolute;
    top: 48px;
    left: 20px;
    width: 280px;
    max-height: 70vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 20;
    /* Deliberately NOT overflow:hidden (was, until this comment): the panel
       shrinks to fit however many session rows there are (down to just one
       row on a fresh-ish install, with the rest archived) — it does not
       reserve 70vh unconditionally. #new-chat-picker below is an
       absolutely-positioned popover anchored to the header, and can easily
       need more vertical room than a one-row panel actually has (its
       backend row + project list + custom-subfolder input can run past
       280px). With overflow:hidden here, that popover got hard-clipped at
       the panel's actual (short) bottom edge — cutting off exactly the
       custom-subfolder input. #sessions-list below carries its own
       overflow-y:auto and now its own bottom-corner radius, so this
       panel-level overflow was only ever doing corner-clipping duty, never
       scroll duty — safe to drop.
    */
    overflow: visible;
    flex-direction: column;
  }
  #sessions-panel.open { display: flex; }
  #sessions-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  #new-chat-wrap { position: relative; }
  #new-chat-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    text-transform: none;
    letter-spacing: normal;
    font-weight: 600;
    cursor: pointer;
  }

  /* New-chat project picker: which project (existing, or a freshly typed
     subdirectory) the new session should start in. Defaults effectively to
     "just continue in the current project" — that row is listed first and
     marked, so the zero-effort case is still just one extra click, not a
     detour, while the deliberate cross-project case is right there too. */
  #new-chat-picker {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    width: 260px;
    max-height: 280px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 25;
    text-transform: none;
    letter-spacing: normal;
    font-weight: 400;
  }
  #new-chat-picker.show { display: block; }
  .new-chat-backend-row {
    display: flex;
    gap: 6px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  .new-chat-backend-btn {
    flex: 1;
    padding: 5px 8px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
  }
  .new-chat-backend-btn:hover { border-color: var(--accent); }
  .new-chat-backend-btn.selected {
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .new-chat-project-item {
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .new-chat-project-item:hover { background: var(--code-bg); }
  .new-chat-project-item.current { color: var(--accent); font-weight: 600; }
  .new-chat-custom-row { padding: 8px 14px; }
  .new-chat-custom-row input {
    width: 100%;
    background: var(--code-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: var(--mono);
  }
  #sessions-view-toggle {
    display: flex;
    gap: 2px;
    padding: 8px 14px 0;
  }
  .sessions-tab {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 5px 10px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
  }
  .sessions-tab.active { color: var(--accent); background: var(--code-bg); }

  /* Bottom corners were previously rounded for free by the panel's own
     overflow:hidden; now that the panel is overflow:visible (see comment
     above #sessions-panel), this list — the element whose row backgrounds
     can actually reach the panel's bottom edge — needs to self-clip its own
     corner instead. */
  #sessions-list { overflow-y: auto; border-radius: 0 0 10px 10px; }
  .session-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    position: relative;
  }
  .session-item:last-child { border-bottom: none; }
  .session-item:hover { background: var(--code-bg); }
  .session-item.current { background: var(--code-bg); border-left: 3px solid var(--accent); }
  .session-title {
    font-size: 13px;
    color: var(--text);
    padding-right: 60px; /* room for hover actions */
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0; /* required for the text child's overflow/ellipsis to work inside a flex parent */
  }
  /* The truncatable part of the title lives in its own flex child now —
     .session-title itself used to carry white-space:nowrap/overflow:hidden/
     text-overflow:ellipsis directly, with the badge appended as a plain
     trailing text-node sibling. That meant a long enough title (anything
     that actually needed the ellipsis) clipped the badge right along with
     the truncated text, since both were just inline content in the same
     nowrap box — a short title like "TRUMPET" happened to never trigger
     it. Isolating truncation to this span and giving the badge
     flex-shrink:0 below means the badge always renders regardless of
     title length or which side it's placed on (see badgePosition
     setting). */
  .session-title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    /* flex-grow: 0 (not 1) is deliberate: growing to fill the row would be
       visually invisible in "before" placement (nothing marks the box's
       edge), but in "after" placement it drags the badge all the way to
       the far edge even for a short title like "TRUMPET" that never
       needed the space — looking detached from its own title. flex-
       shrink: 1 (via the "auto" below) still lets a long title shrink
       down to the available width and truncate exactly as before; it
       just no longer expands past its own content when it doesn't need
       to. */
    flex: 0 1 auto;
  }
  .session-title-input {
    font-size: 13px;
    font-family: var(--sans);
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 4px;
    width: calc(100% - 8px);
  }
  .session-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Cross-session awareness: visible without switching to that session.
     A pending decision (permission or question) takes visual priority over
     a plain inFlight dot (still just running) — it's more actionable, and
     the two decision kinds get distinct colors/tooltips rather than one
     generic "permission" badge for both, since a question isn't actually a
     permission at all. */
  .session-badge {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0; /* never let the title text's overflow squeeze this out */
    background: var(--green);
  }
  .session-badge.needs-permission {
    background: var(--accent);
    animation: badge-pulse 1.4s ease-in-out infinite;
  }
  .session-badge.needs-question {
    background: var(--purple);
    animation: badge-pulse 1.4s ease-in-out infinite;
  }
  @keyframes badge-pulse { 50% { opacity: .35; } }

  /* Grouped-by-project layout: a section header per project, sorted (like
     the flat view) by that group's own most-recent session. */
  /* HD5. The twisty is a sibling of the title text, not inside it, so the
     text can still truncate independently. */
  .session-twisty {
    display: inline-block; width: 12px; flex-shrink: 0;
    color: var(--muted); font-size: 10px; cursor: pointer; user-select: none;
  }
  .session-twisty:hover { color: var(--accent); }
  .session-twisty.placeholder { cursor: default; }
  .session-child { position: relative; }
  /* A hairline rail, so several nested rows read as one family rather than
     as rows that happen to be indented. */
  .session-child::before {
    content: ''; position: absolute; left: 4px; top: 0; bottom: 0;
    border-left: 1px solid var(--border);
  }
  /* Carries a COUNT, unlike the per-row badges, so it needs width and a
     readable numeral rather than being a bare dot. */
  .session-agg {
    min-width: 14px; height: 14px; line-height: 14px; padding: 0 3px;
    border-radius: 7px; font-size: 9px; font-weight: 600; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* HD4's family-delete dialog. Deliberately a real modal rather than a
     stacked confirm(): the whole point is to SHOW the blast radius, and
     confirm() cannot render a list of checkboxes. */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100; display: flex;
    align-items: center; justify-content: center; background: rgba(0,0,0,.55);
  }
  .modal-box {
    width: min(480px, 92vw); max-height: 80vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; color: var(--text);
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .modal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .modal-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 10px 0 6px;
  }
  .modal-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 4px; border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  .modal-row:hover { background: var(--code-bg); }
  .modal-row-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-row-why { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .modal-note {
    font-size: 12px; color: var(--muted); margin-top: 12px;
    padding: 8px 10px; background: var(--code-bg); border-radius: 6px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal-actions button.danger { color: var(--danger); border-color: var(--danger); }

  /* MD9: the mail interface, in the strip's LEFT half.
     It used to be a panel in the feed, anchored last. Two things killed
     that: it scrolled out of view (appended as the feed's last child, so
     scrolling up hid the only control that could unblock the session), and
     it duplicated the strip, which was already announcing the same held
     mail from the chrome. The strip never scrolls and was already the place
     you look when something needs you.
     Scoped to the session on screen, which costs nothing: mail can only be
     held for a session a VISIBLE tab is watching, so a second tab shows its
     own count and there is no cross-session state to aggregate. */
  #ps-mail { display: none; align-items: center; gap: 10px; }
  #ps-mail.show { display: inline-flex; }
  #paused-strip .mb-toggle { cursor: pointer; user-select: none; }
  #paused-strip .mb-toggle::before { content: '▸ '; }
  #paused-strip.mail-open .mb-toggle::before { content: '▾ '; }
  #paused-strip .mb-toggle:hover { text-decoration: underline; }
  /* Overlays rather than pushing the feed down, and anchored to the STRIP
     from the left (the lift menu above does the same from the right) so it
     cannot be clipped by the strip's own overflow. */
  #ps-mail-list { display: none; }
  #paused-strip.mail-open #ps-mail-list {
    display: block;
    position: absolute; left: 14px; top: 100%; z-index: 42;
    min-width: 420px; max-width: 70vw; max-height: 50vh; overflow-y: auto;
    padding: 4px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
    box-shadow: 0 6px 20px rgba(0,0,0,.28);
  }
  #paused-strip .mb-deliver {
    font-size: 12px; padding: 2px 10px;
    border-color: var(--accent); color: var(--accent); background: transparent;
  }
  #paused-strip .mb-deliver:disabled { opacity: .45; cursor: default; }
  #ps-mail-list .mb-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px; border-radius: 5px; cursor: pointer;
  }
  #ps-mail-list .mb-row:hover { background: var(--code-bg); }
  #ps-mail-list .mb-who { color: var(--accent); flex-shrink: 0; }
  #ps-mail-list .mb-text {
    flex: 1; min-width: 0; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #ps-mail-list .mb-drop {
    font-size: 11px; padding: 0 5px; flex-shrink: 0;
    color: var(--muted); border-color: var(--border); background: transparent;
  }
  #ps-mail-list .mb-drop:hover { color: var(--danger); border-color: var(--danger); }

  .session-group-header {
    padding: 8px 14px 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }

  /* Unreachable sessions (project directory no longer resolves — see the
     'Unreachable sessions' setting): visibly inert, not just dim text —
     there's genuinely nothing to click here, unlike every other row. */
  .session-item.session-unreachable {
    cursor: default;
    opacity: .55;
  }
  .session-item.session-unreachable:hover { background: none; }
  .unreachable-note {
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    border-top: 1px solid var(--border);
  }

  /* Open-in-new-tab affordance, separate from the main clickable row (which
     stays a plain div with its own click handler) rather than making the
     whole row an <a> — the row already nests interactive children
     (rename-on-dblclick, archive/delete buttons), and anchors with nested
     interactive elements are a real minefield for click/navigation
     semantics; a small dedicated link sidesteps all of that. */
  .session-open-tab {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .session-open-tab:hover { color: var(--text); background: var(--border); }

  .session-actions {
    position: absolute;
    top: 8px;
    right: 10px;
    display: none;
    gap: 4px;
  }
  .session-item:hover .session-actions { display: flex; }
  .session-action-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 11px;
    cursor: pointer;
  }
  .session-action-btn:hover { border-color: var(--accent); color: var(--text); }
  .session-action-btn.session-delete-btn:hover { border-color: #f87171; color: #f87171; }
  .session-action-btn:disabled { opacity: .35; cursor: not-allowed; }
  .session-action-btn:disabled:hover { border-color: var(--border); color: var(--muted); }

  /* ── Message feed ──────────────────────────────────────────────────── */
  #feed {
    position: relative;
    overflow-y: auto;
    padding: 28px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    /* scroll-behavior is set from JS (applySettings) per the "Auto-scroll
       animation" setting, not hardcoded here — see the autoscroll-anim
       select and the pinnedToBottom/autoScrolling logic near scrollBottom(). */
  }
  #feed::-webkit-scrollbar { width: 6px; }
  #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  #new-pill {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    display: none;
    z-index: 15;
  }
  #new-pill.show { display: block; }

  /* ── Turn-in-flight indicator + backend controls row ─────────────────── */
  /* One shared flex row, directly above #input-bar: the ephemeral
     "Thinking…" / "Running `Bash`… (12s)" turn-indicator on the left (same
     position/behavior as before this row existed — it just no longer gets
     a whole line to itself), model/mode switchers + the auto-approve
     checkbox right-aligned on the SAME line. #turn-indicator takes the
     available space (flex:1) so it can still wrap/ellipsize independently
     without pushing the controls off to the right when both are showing
     at once (a long "Running `SomeVeryLongToolName`…" line alongside an
     active auto-approve checkbox, say). */
  /* No justify-content: space-between here — with #turn-indicator hidden
     (display:none, its default state whenever no turn is running), it's
     not a flex item at all, which left #controls-row as space-between's
     lone child and sitting at the main-start (left) instead of the right —
     the "auto-approve dances between left and right" bug. #controls-row's
     own margin-left:auto below is what pins it to the right edge
     unconditionally, regardless of whether the indicator is present. */
  #status-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 20px 0;
  }
  #turn-indicator {
    display: none;
    flex: 1;
    min-width: 0;
    font-size: var(--status-font-size);
    color: var(--muted);
    font-style: italic;
  }
  #turn-indicator.show { display: block; }

  /* ── Backend controls row (model/mode switchers, auto-approve) ───────── */
  /* Each <select> stays hidden (not just empty) whenever the active
     session's backend has no such concept at all (e.g. Claude Code has no
     mode/agent concept) rather than showing an empty, useless dropdown —
     see loadModes()/loadModels(). Font-size is the same --status-font-size
     variable #turn-indicator uses (and the existing "Status text size"
     settings slider already controls) rather than a hardcoded size, so the
     two visually match and stay in sync with that setting automatically. */
  #controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-left: auto; /* always pinned right, independent of #turn-indicator's visibility */
    font-size: var(--status-font-size);
    color: var(--muted);
  }
  #controls-row select {
    display: none;
    background: var(--code-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: var(--status-font-size);
    max-width: 220px;
  }
  #controls-row select.show { display: inline-block; }
  /* The model/mode pickers stay hidden until their options load; this one's
     options are fixed, so it is ready immediately. */
  #auto-approve-row, #auto-deliver-row {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
  }
  #auto-approve-row input[type="checkbox"],
  #auto-deliver-row input[type="checkbox"] {
    width: 1.15em;
    height: 1.15em;
  }
  /* Deliberately the same amber used for the context-usage warning
     threshold — both are "pay attention" states, not errors. */
  #auto-approve-row.active { color: #f59e0b; font-weight: 600; }
  /* MD9: accent, not amber. Auto-approve's amber says "you have lowered a
     guard"; auto-delivery grants nothing and removes no review, it only
     declines to hold mail — so it reads as an active mode, not a warning. */
  #auto-deliver-row.active { color: var(--accent); font-weight: 600; }

  /* ── Input bar ─────────────────────────────────────────────────────── */
  #input-bar {
    position: relative;
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    background: var(--bg);
  }
  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #palette-btn, #stop-btn, #send-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  #palette-btn { font-family: var(--mono); padding: 9px 12px; }
  #send-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
  #send-btn:disabled, #palette-btn:disabled { opacity: .5; cursor: not-allowed; }
  #stop-btn { background: #f87171; border-color: #f87171; color: #fff; display: none; }
  #stop-btn.show { display: block; }
  #send-btn.hide-for-stop { display: none; }

  #prompt-input {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 200px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--sans);
    font-size: var(--font-size);
    line-height: 1.4;
  }
  #prompt-input:disabled { opacity: .6; }
  #prompt-input:focus { outline: 1px solid var(--accent); }

  /* ── Command palette ──────────────────────────────────────────────── */
  #palette-dropdown {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 20px;
    right: 20px;
    max-height: 260px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #palette-dropdown.show { display: block; }
  .palette-item {
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .palette-item:last-child { border-bottom: none; }
  .palette-item:hover { background: var(--code-bg); }
  .palette-empty { padding: 10px 14px; color: var(--muted); font-size: 13px; }

  /* ── Permission / question cards ──────────────────────────────────── */
  .perm-card { display: flex; flex-direction: column; gap: 10px; }
  .perm-q-text { font-weight: 600; color: var(--heading); }
  .perm-tool-summary {
    font-family: var(--mono);
    font-size: .85em;
    color: var(--muted);
  }
  .perm-question { display: flex; flex-direction: column; gap: 6px; }
  .perm-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .perm-option-btn {
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .perm-option-btn:hover { border-color: var(--accent); }
  .perm-option-btn.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .perm-option-btn.perm-allow:hover { border-color: var(--green); }
  .perm-option-btn.perm-deny:hover { border-color: #f87171; }
  .perm-submit-btn {
    align-self: flex-start;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .perm-submit-btn:disabled { opacity: .4; cursor: not-allowed; }
  .perm-resolved { color: var(--muted); font-size: .9em; font-style: italic; }
  /* "Other…" always sits alongside whatever fixed options the model
     supplied, matching the real AskUserQuestion tool's guaranteed free-text
     escape hatch — dashed border sets it apart from the fixed choices. */
  .perm-option-btn.perm-other-btn { border-style: dashed; }
  .perm-other-textarea {
    display: none;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text);
    border-radius: 7px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    resize: none;
    max-height: 200px;
    overflow-y: auto;
  }
  .perm-other-textarea.show { display: block; }
  .perm-other-textarea:focus { outline: none; border-color: var(--accent); }

  /* ── Message bubble ─────────────────────────────────────────────────── */
  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fadein .2s ease;
    position: relative;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }

  .msg-label {
    font-size: var(--label-font-size);
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 4px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .msg-label .ts {
    font-size: .9em;
    font-weight: 400;
    letter-spacing: normal;
    text-transform: none;
    color: var(--muted);
    opacity: .7;
  }
  .msg-label .model {
    font-size: .9em;
    font-weight: 500;
    letter-spacing: normal;
    text-transform: none;
    color: var(--muted);
    opacity: .8;
    margin-left: 0px;
    margin-right: 0px;
  }
  .msg-label .model:empty { display: none; }
  .msg-label .ts:empty { display: none; }
  .msg.user   .msg-label { color: var(--accent); }
  .msg.assistant .msg-label { color: var(--muted); }
  .msg.tool   .msg-label { color: var(--green); }
  .msg.agent  .msg-label { color: var(--purple); }
  .msg.thinking .msg-label { color: var(--purple); }
  .msg.permission .msg-label { color: var(--accent); }
  .msg.permission .msg-body { border-color: var(--accent); }
  .msg.hidden-empty { display: none; }

  /* thinking blocks: distinct from assistant text, subdued/italic like the
     TUI's collapsed thinking display. Content is plain text, streamed by
     appending (never markdown/KaTeX-parsed — a long reasoning transcript
     stays boxed, styled, capped and scrollable instead of re-rendering
     per token). Three gear-menu modes select the element's classes here:
       hide     -> .hidden-thought        (not rendered at all)
       collapse -> no .expanded, body hidden until the header is clicked
       show     -> .expanded, body visible, capped like long tool diffs */
  .msg.thinking .msg-body {
    display: none;
    font-style: italic;
    color: var(--muted);
    background: var(--code-bg);
    padding: 8px 14px;
    font-size: .9em;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
  }
  .msg.thinking.expanded .msg-body { display: block; }
  .msg.thinking.hidden-thought { display: none; }
  .msg.thinking .msg-think-toggle {
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }
  .msg.thinking .msg-think-toggle::before { content: '▸ '; }
  .msg.thinking.expanded .msg-think-toggle::before { content: '▾ '; }
  .msg.thinking .msg-think-toggle:hover { text-decoration: underline; }
  .msg.thinking .msg-label .ts { margin-left: auto; }
  .msg.thinking .msg-think-toggle .model { color: var(--muted); opacity: .8; margin-left: 0; margin-right: 0; }

  /* §13d — the delegate_session bubble.
     A one-line header (title · status · open session) with the delegation
     prompt collapsed behind it, matching how thinking and tool blocks
     already behave. The prompt used to be DESTROYED on every sessions poll
     (innerHTML = ''), so the thing you most wanted to re-read was the one
     thing that vanished a second after it appeared. */
  .delegate-head {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .delegate-head::before { content: '▸'; opacity: .7; }
  .delegate.expanded .delegate-head::before { content: '▾'; }
  .delegate-head:hover .delegate-title { text-decoration: underline; }
  .delegate-title { font-weight: 600; }
  .delegate-status { color: var(--muted); }
  /* The states that are NOT "all is well" have to be distinguishable at a
     glance, or this is the same silent-failure bug in a new coat. */
  .delegate-status.bad { color: var(--danger, #f87171); font-weight: 600; }
  .delegate-status.warn { color: var(--warn, #fbbf24); }
  .delegate-detail {
    display: none;
    margin-top: 8px;
    padding-left: 14px;
    border-left: 2px solid var(--border, #333);
  }
  .delegate.expanded .delegate-detail { display: block; }

  /* per-delta streaming: raw text appended into the bubble (no full
     markdown re-render per token — that re-flows the whole bubble every
     chunk and makes long streams janky). Finalize swaps to a clean render. */
  .msg-body.raw { white-space: pre-wrap; }

  /* tool bubbles can now hold real diffs (Edit/Write), not just a one-liner —
     cap height so a huge diff doesn't dominate the feed */
  .msg.tool .msg-body pre { max-height: 400px; overflow-y: auto; }

  /* whole-message copy button (assistant only) */
  .msg-copy-btn {
    position: absolute;
    top: 22px;
    right: 0;
    background: var(--border);
    color: var(--muted);
    border: none;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
  }
  .msg.assistant:hover .msg-copy-btn { opacity: 1; }
  .msg-copy-btn:hover { background: var(--accent); color: #fff; }

  .msg-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    line-height: 1.7;
  }
  .msg.user .msg-body {
    background: var(--user-bg);
    border-color: var(--user-border);
  }
  /* tool blocks: same three gear-menu modes as thinking blocks above, via
     the same class mechanism:
       hide     -> .hidden-tool          (not rendered at all)
       collapse -> no .expanded, body hidden until the header is clicked
       show     -> .expanded, body visible, diffs capped and scrollable */
  .msg.tool .msg-body {
    display: none;
    padding: 8px 14px;
    font-size: .88em;
    color: var(--muted);
    background: var(--code-bg);
    /* renderToolBody() emits plain escaped text outside of fenced code
       blocks (no <p>/<br> from marked anymore) — this is what keeps its
       own newlines (e.g. a multi-line one-off summary) visible. */
    white-space: pre-wrap;
  }
  .msg.tool.expanded .msg-body { display: block; }
  .msg.tool.hidden-tool { display: none; }
  .msg.tool .msg-tool-toggle {
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }
  .msg.tool .msg-tool-toggle::before { content: '▸ '; }
  .msg.tool.expanded .msg-tool-toggle::before { content: '▾ '; }
  .msg.tool .msg-tool-toggle:hover { text-decoration: underline; }
  .msg.tool .msg-tool-toggle .model { color: var(--muted); opacity: .8; margin-left: 0; margin-right: 0; }
  /* The tool's own name, lifted out of the body into the label. Monospace
     because it is an identifier, and inheriting the label's colour for the
     same reason the Agent title does — it reads as part of "TOOL <name>". */
  .msg.tool .msg-tool-toggle .tool-name {
    font-family: var(--mono);
    text-transform: none;
    letter-spacing: normal;
    margin-right: 6px;
  }
  .msg.tool .msg-tool-toggle .tool-name:empty { display: none; }
  .msg.tool .msg-label .ts { margin-left: auto; }
  .msg.tool .msg-body p { margin: 0; } /* dead now marked.parse() no longer runs here; harmless if a stray <p> ever appears */

  /* streaming cursor */
  .msg-body.streaming::after {
    content: '▋';
    display: inline;
    color: var(--accent);
    animation: blink .8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Markdown inside bubbles ────────────────────────────────────────── */
  .msg-body h1, .msg-body h2, .msg-body h3 {
    font-weight: 600;
    margin: 1.1em 0 .5em;
    color: var(--heading);
  }
  .msg-body h1 { font-size: 1.3em; }
  .msg-body h2 { font-size: 1.15em; }
  .msg-body h3 { font-size: 1em; }
  .msg-body p  { margin: .6em 0; }
  .msg-body ul, .msg-body ol { padding-left: 1.4em; margin: .6em 0; }
  .msg-body li { margin: .3em 0; }

  .msg-body strong { color: var(--heading); font-weight: 600; }
  .msg-body em { color: var(--em-color); }
  .msg-body a  { color: var(--accent); text-decoration: none; }
  .msg-body a:hover { text-decoration: underline; }
  .msg-body hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* inline code */
  .msg-body code:not(pre code) {
    font-family: var(--mono);
    font-size: .875em;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--inline-code-color);
  }

  /* fenced code blocks */
  .msg-body pre {
    background: var(--code-bg) !important;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: .8em 0;
    position: relative;
  }
  .msg-body pre code {
    font-family: var(--mono);
    font-size: .82em;
    background: none !important;
    border: none !important;
    padding: 0 !important;
    color: inherit;
  }

  /* copy button */
  .copy-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--border);
    color: var(--muted);
    border: none;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
  }
  .msg-body pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--accent); color: #fff; }

  /* ── KaTeX overrides ────────────────────────────────────────────────── */
  .katex-display {
    overflow-x: auto;
    padding: 6px 0;
    margin: .8em 0 !important;
  }
  .katex { font-size: 1.05em; }

  /* ── Empty state ────────────────────────────────────────────────────── */
  #empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }
  #empty .icon {
    font-size: 36px;
    opacity: .4;
  }
  #empty code {
    font-family: var(--mono);
    font-size: .85em;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
  }

  /* ── Blockquote ─────────────────────────────────────────────────────── */
  .msg-body blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 14px;
    color: var(--muted);
    margin: .6em 0;
  }

  /* ── Table ──────────────────────────────────────────────────────────── */
  .msg-body table {
    border-collapse: collapse;
    width: 100%;
    margin: .8em 0;
    font-size: .9em;
  }
  .msg-body th, .msg-body td {
    border: 1px solid var(--border);
    padding: 7px 12px;
    text-align: left;
  }
  .msg-body th { background: var(--code-bg); color: var(--heading); font-weight: 600; }
  .msg-body tr:nth-child(even) td { background: var(--zebra-row); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="sessions-btn" title="Sessions">☰</button>
    <div class="logo" id="app-logo"></div>
    <span id="app-title-wrap">PodPrompt<span id="backend-badge"></span></span>
    <div id="context-usage-wrap" title="Context window usage">
      <div id="context-usage-bar"><div id="context-usage-fill"></div></div>
      <div id="context-usage-label"></div>
    </div>
    <div id="plan-usage-wrap"></div>
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-label">connecting…</span>
    </div>
    <button id="roster-btn" title="Sub-agents in this session"></button>
    <button id="pending-approvals-btn" title="Approvals waiting on you"></button>
    <button id="export-btn" title="Export conversation as Markdown">⬇</button>
    <button id="settings-btn" title="Settings">⚙</button>
  </header>

  <div id="paused-strip">
    <span id="ps-mail"></span>
    <span id="ps-text"></span>
    <span class="ps-spacer"></span>
    <span id="ps-actions"></span>
    <div id="ps-mail-list"></div>
  </div>

  <div id="sessions-panel">
    <div id="sessions-panel-header">
      <span>Sessions</span>
      <div id="new-chat-wrap">
        <button id="new-chat-btn">+ New chat</button>
        <div id="new-chat-picker"></div>
      </div>
    </div>
    <div id="sessions-view-toggle">
      <button class="sessions-tab active" data-view="active">Active</button>
      <button class="sessions-tab" data-view="archived">Archived</button>
    </div>
    <div id="sessions-list"></div>
  </div>

  <div id="settings-panel">
    <div class="settings-columns">
      <div class="settings-col">
        <div class="settings-group">
          <div class="settings-group-title">Display</div>
          <div class="settings-row">
            <label>Font size <span class="row-value" id="font-size-val">15px</span></label>
            <input type="range" id="font-size-slider" min="8" max="40" step="1" value="15">
          </div>
          <div class="settings-row">
            <label>Content width <span class="row-value" id="width-val">860px</span></label>
            <input type="range" id="width-slider" min="360" max="2600" step="20" value="860">
          </div>
          <div class="settings-row">
            <label>Label size <span class="row-value" id="label-size-val">11px</span></label>
            <input type="range" id="label-size-slider" min="6" max="32" step="1" value="11">
          </div>
          <div class="settings-row">
            <label>Status text size <span class="row-value" id="status-size-val">12px</span></label>
            <input type="range" id="status-size-slider" min="6" max="32" step="1" value="12">
          </div>
          <div class="settings-row">
            <label><span>Light theme</span> <input type="checkbox" id="theme-toggle"></label>
          </div>
          <div class="settings-row select-row">
            <label><span>Auto-scroll animation</span>
              <select id="autoscroll-anim">
                <option value="smooth" selected>Smooth</option>
                <option value="instant">Instant</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Sessions sort order</span>
              <select id="sessions-sort">
                <option value="created">Created time (default)</option>
                <option value="lastModified">Last modified</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Show model name on</span>
              <select id="show-model-on">
                <option value="model-only" selected>MODEL bubbles only</option>
                <option value="all-bubbles">All bubbles</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Thinking blocks</span>
              <select id="thinking-mode">
                <option value="collapse" selected>Collapsed (click to open)</option>
                <option value="show">Show (streamed, scrollable)</option>
                <option value="hide">Hide</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Tool calls</span>
              <select id="tool-mode">
                <option value="collapse">Collapsed (click to open)</option>
                <option value="show" selected>Show (scrollable)</option>
                <option value="hide">Hide</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="settings-col">
        <div class="settings-group">
          <div class="settings-group-title">Sessions</div>
          <div class="settings-row select-row">
            <label><span>Layout</span>
              <select id="sessions-layout">
                <option value="flat" selected>Flat</option>
                <option value="grouped">Grouped by project</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Unreachable sessions</span>
              <select id="unreachable-mode">
                <option value="hidden">Hidden</option>
                <option value="count" selected>Show count</option>
                <option value="shown">Show, greyed out</option>
              </select>
            </label>
          </div>
          <div class="settings-row select-row">
            <label><span>Status badge position</span>
              <select id="badge-position">
                <option value="after" selected>After title</option>
                <option value="before">Before title</option>
              </select>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">Timestamps</div>
          <div class="settings-row select-row">
            <label><span>Format</span>
              <select id="ts-format">
                <option value="hidden">Hidden</option>
                <option value="time" selected>Time only</option>
                <option value="datetime">Date + time</option>
              </select>
            </label>
          </div>
          <div class="settings-row" id="ts-24h-row">
            <label><span>24-hour time</span> <input type="checkbox" id="ts-24h"></label>
          </div>
          <div class="settings-row" id="ts-tz-row">
            <label><span>Show time zone</span> <input type="checkbox" id="ts-tz"></label>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">Usage</div>
          <div class="settings-row select-row">
            <label><span>Reset time format</span>
              <select id="usage-reset-format">
                <option value="absolute" selected>Absolute (e.g. 2:20 PM)</option>
                <option value="relative">Relative (e.g. in 3 hr 31 min)</option>
              </select>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">Notifications</div>
          <div class="settings-row">
            <label><span>Notify when a turn ends</span> <input type="checkbox" id="notify-toggle"></label>
          </div>
          <div class="settings-row" id="notify-sound-row">
            <label><span>Play a sound</span> <input type="checkbox" id="notify-sound"></label>
          </div>
          <div class="settings-note" id="notify-note"></div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">History</div>
          <!-- The explanation moved to the label's tooltip. It was a
               permanently-visible three-line note explaining a checkbox most
               people set once, and it crowded out settings that change
               behaviour rather than describing it. Kept rather than deleted:
               "agents can always read the full history" is the part that
               stops someone enabling this for the wrong reason. -->
          <div class="settings-row" id="deep-history-row">
            <label id="deep-history-label"><span>Load full history</span> <input type="checkbox" id="deep-history-toggle"></label>
          </div>
        </div>
      </div>

      <!-- Third column: behaviour, not appearance.
           Autonomy is the only setting in this panel that changes what the
           system DOES, so it gets its own column rather than being filed
           among font sizes and badge positions.

           WHY IT IS IN SETTINGS AT ALL. renderAutonomyStrip() returns early
           unless the state is paused or uncapped, so in normal operation
           the strip renders nothing — not even "Don't pause". That made
           unattended work impossible to ARRANGE: you had to start, wait
           however many automatic turns it took to hit the wall, lift the
           cap, and only then walk away. Policy has to be reachable before
           anything has gone wrong; the strip stays purely reactive.

           WHY ONE CONTROL AND NOT TWO. A budget and a time window read as
           contradictory settings — "stop after 20" versus "keep going until
           8am" — and needed a paragraph of prose to explain that they are
           not. They are one choice with two modes, which is what the data
           model already says: pauseAfter is not consulted at all while an
           override is live. A single select cannot express a contradiction,
           and the closed control reads as a sentence describing what the
           system is doing right now. -->
      <div class="settings-col">
        <div class="settings-group">
          <div class="settings-group-title" id="autonomy-group-title"
               title="While running unattended the turn limit does not apply. When the window ends, automatic work stops until you are back — your next message starts a fresh budget.">Autonomy</div>
          <div class="settings-row select-row">
            <label><span>Mode</span>
              <select id="autonomy-mode">
                <optgroup label="Supervised">
                  <option value="n:5">Pause after 5 automatic turns</option>
                  <option value="n:10">Pause after 10 automatic turns</option>
                  <option value="n:20">Pause after 20 automatic turns</option>
                  <option value="n:50">Pause after 50 automatic turns</option>
                  <option value="n:100">Pause after 100 automatic turns</option>
                  <option value="n:custom">Pause after&hellip; (choose below)</option>
                </optgroup>
                <optgroup label="Unattended">
                  <option value="t:1h">Run unattended for 1 hour</option>
                  <option value="t:4h">Run unattended for 4 hours</option>
                  <option value="t:8am">Run unattended until 8:00 AM</option>
                  <option value="t:custom">Run unattended until&hellip; (choose below)</option>
                  <option value="t:never">Run unattended indefinitely</option>
                </optgroup>
              </select>
            </label>
          </div>
          <!-- Greyed rather than hidden, following this panel's own
               convention (see deep-history): a control that vanishes reads
               as a bug, and a fixed height stops the group jumping as you
               move between modes. -->
          <div class="settings-row" id="autonomy-turns-row">
            <label><span>Turns</span>
              <input type="number" id="autonomy-turns" min="1" max="100000" step="1" value="20">
            </label>
          </div>
          <div class="settings-row" id="autonomy-until-row">
            <label><span>Until</span>
              <input type="datetime-local" id="autonomy-until">
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="roster-panel"></div>

  <div id="subagent-banner">
    <span class="sa-label">Sub-agent transcript<span id="sa-type"></span> &mdash; read-only</span>
    <span class="sa-spacer"></span>
    <button id="sa-parent-btn" title="Go back to the session that spawned this sub-agent">↑ Parent session</button>
    <button id="sa-promote-btn" title="Keep as a session of its own">Keep</button>
  </div>

  <div id="feed">
    <!-- Lives INSIDE the feed as its first item rather than floating: it is
         only reachable by scrolling to the top, which is exactly when it is
         wanted. The existing new-message affordance covers "something
         arrived"; this covers "nothing new, but I am a long way up". -->
    <div id="jump-latest" role="button" tabindex="0">↓ Jump to latest message</div>
    <div id="empty">
      <div class="icon">⌨</div>
      <p>Waiting for messages…</p>
      <p>Type a prompt below to get started.</p>
    </div>

    <!-- Lives in the FEED, where a bubble would, rather than in the chrome
         above the input bar. It is a statement about the conversation — this
         turn ended badly, here is what to do about it — so it belongs with
         the conversation, and the chrome stops competing with the status
         bar for the space. Kept as the feed's LAST child by
         placeResumeBar(), which re-appends it whenever it is shown, because
         messages are appended after it. -->
    <div id="resume-bar">
      <span id="resume-text"></span>
      <span class="rb-spacer"></span>
      <button id="resume-btn">Continue</button>
      <button id="resume-dismiss" title="Dismiss">×</button>
    </div>
  </div>
  <button id="new-pill">↓ New messages</button>
  <div id="status-row">
    <div id="turn-indicator"></div>
    <div id="controls-row">
      <select id="model-select" title="Model"></select>
      <select id="mode-select" title="Agent / mode"></select>
      <label id="auto-approve-row" title="Automatically approve all tool permission requests for this session, until turned back off">
        <input type="checkbox" id="auto-approve-toggle"> Auto-approve
      </label>
      <label id="auto-deliver-row" title="Deliver messages to this session immediately, even while you are watching it. Use for a session that is meant to work on its own — otherwise mail is held so it cannot spend the turn you were about to type. On by default for delegated sessions.">
        <input type="checkbox" id="auto-deliver-toggle"> Auto-deliver<span id="auto-deliver-stopped"></span>
      </label>
    </div>
  </div>

  <div id="input-bar">
    <div id="palette-dropdown"></div>
    <div id="input-row">
      <button id="palette-btn" title="Commands">/</button>
      <textarea id="prompt-input" rows="1" placeholder="Message the agent… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send-btn">Send</button>
      <button id="stop-btn">Stop</button>
    </div>
  </div>
</div>

<script>
// ── marked config ────────────────────────────────────────────────────────────
marked.setOptions({
  breaks: true,
  gfm: true,
});

const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  const language = hljs.getLanguage(lang) ? lang : 'plaintext';
  const highlighted = hljs.highlight(code, { language }).value;
  return `<pre><button class="copy-btn" onclick="copyCode(this)">copy</button><code class="hljs language-${language}">${highlighted}</code></pre>`;
};
marked.use({ renderer });

function copyCode(btn) {
  const code = btn.nextElementSibling.innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'copied!';
    setTimeout(() => btn.textContent = 'copy', 1500);
  });
}

// Tool bubbles are command lines, file paths, and diffs — never meant to go
// through the *prose* markdown pipeline (a stray "**" flag or "_" in a shell
// command/path could get misread as bold/italic, "#" at line-start as a
// heading, etc.). The one deliberate exception is the fenced code block
// formatToolSummary() (driver-side) wraps Edit/MultiEdit/Write diffs in —
// that still gets the same hljs syntax highlighting every other code fence
// gets, just extracted directly here instead of handing the whole bubble to
// marked.parse(), so nothing *outside* the fence is at risk of being
// reinterpreted as markdown. Everything outside a fence is escaped and
// inserted as literal text, unprocessed.
const TOOL_FENCE_RE = /```([^\n`]*)\n([\s\S]*?)```/g;

const TOOL_NAME_RE = /^`([^`\n]+)`[ \t]*/;

// Splits "`Bash` ls -la" into its tool name and the rest. Returns null when
// the text is not a tool summary at all — a *(stopped)* marker, an
// *(error: ...)* bubble, a local notice — so those render unchanged.
function splitToolName(text) {
  const m = TOOL_NAME_RE.exec(text || '');
  if (!m) return null;
  let name = m[1];
  const rest = text.slice(m[0].length);
  // MCP tools arrive wire-named as mcp__<server>__<tool>. That prefix is
  // plumbing: it says nothing a reader wants and crowds out the part that
  // does. "mcp__podprompt__message" becomes "message".
  const mcp = /^mcp__[^_]+(?:_[^_]+)*__(.+)$/.exec(name);
  if (mcp) name = mcp[1];
  // A message or delegation reads far better with its target in the title,
  // the same reason the tool name was lifted out of the body at all —
  // otherwise a feed full of peer traffic is a column of identical labels.
  if (name === 'message_session' || name === 'delegate_session') {
    try {
      const args = JSON.parse(rest.trim());
      const target = name === 'message_session' ? args.to : (args.backend ? `${args.backend}` : null);
      if (target) name = `${name} → ${target}`;
    } catch { /* not JSON args — leave the plain name */ }
  }
  return { name, rest };
}

function renderToolBody(text) {
  let out = '';
  let last = 0;
  let m;
  TOOL_FENCE_RE.lastIndex = 0;
  while ((m = TOOL_FENCE_RE.exec(text))) {
    out += escapeHtml(text.slice(last, m.index));
    const lang = hljs.getLanguage(m[1]) ? m[1] : 'plaintext';
    const highlighted = hljs.highlight(m[2], { language: lang }).value;
    out += `<pre><button class="copy-btn" onclick="copyCode(this)">copy</button><code class="hljs language-${lang}">${highlighted}</code></pre>`;
    last = TOOL_FENCE_RE.lastIndex;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

// ── KaTeX render ─────────────────────────────────────────────────────────────
// Math is extracted and rendered to HTML *before* marked.parse() runs, so
// markdown (in particular `breaks: true`, which turns newlines into <br>)
// can't mangle multi-line LaTeX like \begin{aligned}/\begin{pmatrix}.
let mathStore = [];

function extractMath(text) {
  mathStore = [];
  // Backtick-delimited spans (fenced ```code blocks``` and inline `code`)
  // are matched FIRST and returned untouched, purely to make the regex
  // engine consume and skip past them — this lets someone write out a
  // literal LaTeX-looking string (`$x$`, a ```diff block with a bare $1,
  // etc.) inside code without it being pulled out and rendered as math.
  const pattern = /```[\s\S]*?```|`[^`\n]*?`|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\$\n]+?)\$/g;
  return text.replace(pattern, (match, disp1, disp2, inl1, inl2) => {
    if (disp1 === undefined && disp2 === undefined && inl1 === undefined && inl2 === undefined) {
      return match; // matched a code span/fence, not a math delimiter
    }
    const isDisplay = disp1 !== undefined || disp2 !== undefined;
    const src = disp1 ?? disp2 ?? inl1 ?? inl2;
    const idx = mathStore.push({ src, isDisplay }) - 1;
    return `@@MATH${idx}@@`;
  });
}

function injectMath(html) {
  return html.replace(/@@MATH(\d+)@@/g, (match, i) => {
    const { src, isDisplay } = mathStore[i];
    try {
      return katex.renderToString(src, { displayMode: isDisplay, throwOnError: false });
    } catch (e) {
      return match;
    }
  });
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
const feed   = document.getElementById('feed');
const empty  = document.getElementById('empty');
const dot    = document.getElementById('status-dot');
const label  = document.getElementById('status-label');
const msgs   = {};   // id → { el, rawText, role, tsEl, revealTimer }
const feedOrder = []; // ids in the order they were created, for export

function setStatus(state, text) {
  dot.className = state;
  label.textContent = text;
}

const turnIndicator = document.getElementById('turn-indicator');
