// ── Export conversation ─────────────────────────────────────────────────────
function exportMarkdown() {
  const lines = [];
  for (const id of feedOrder) {
    const entry = msgs[id];
    if (!entry) continue;
    lines.push(`### ${labelFor(entry.role)}`, '', entry.rawText || '', '');
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'claude-conversation.md';
  a.click();
  URL.revokeObjectURL(url);
}

exportBtn.addEventListener('click', exportMarkdown);

// ── Input bar: talks to driver.mjs directly (a different port from this
// page's own server.py), not through the SSE connection above ────────────
let driverBase = null; // resolved from /config before the input bar works
let turnInFlight = false;
// Set by the new-chat project picker for a session that doesn't exist yet;
// consumed by the next submitPrompt() call for that same session id (its
// very first prompt), then cleared. viewSession() also clears it if you
// switch to any OTHER session before sending that first prompt, so it can
// never leak into some unrelated session's turn.
let pendingCwdForNewSession = null;

const promptInput  = document.getElementById('prompt-input');
const sendBtn       = document.getElementById('send-btn');
const stopBtn       = document.getElementById('stop-btn');
const paletteBtn    = document.getElementById('palette-btn');
const paletteDropdown = document.getElementById('palette-dropdown');

async function loadDriverConfig() {
  try {
    const res = await fetch('/config');
    const cfg = await res.json();
    driverBase = `${location.protocol}//${location.hostname}:${cfg.driverPort}`;
  } catch (e) {
    console.error('Failed to load /config:', e);
  }
}

function setTurnInFlight(inFlight) {
  turnInFlight = inFlight;
  promptInput.disabled = inFlight;
  sendBtn.classList.toggle('hide-for-stop', inFlight);
  stopBtn.classList.toggle('show', inFlight);
}

// Defense-in-depth: turn_start/turn_end are ephemeral SSE broadcasts, not
// replayed on reconnect. If one is ever missed (a reconnect landing mid-turn,
// a dropped event), this is what recovers — called on every SSE reconnect,
// asks the driver directly rather than trusting only what's been broadcast.
async function resyncTurnStatus() {
  if (!driverBase) return;
  try {
    const res = await fetch(`${driverBase}/turn-status?sessionId=${encodeURIComponent(currentSessionId)}`);
    const data = await res.json();
    setTurnInFlight(!!data.inFlight);
  } catch (e) {
    console.error('Failed to resync turn status:', e);
  }
}

function autoResizeInput() {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + 'px';
}

// Renders a message locally only — not sent to server.py/message_log, not
// synced to other tabs. For client-side observations (submission failures)
// that don't need to persist or replay on reconnect, just be visible now.
function showLocalNotice(text) {
  const id = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const entry = getOrCreate(id, 'tool');
  entry.ts = new Date().toISOString();
  if (entry.tsEl) entry.tsEl.textContent = formatTs(entry.ts);
  entry.rawText = text;
  renderBody(entry);
  scrollBottom();
}

async function submitPrompt() {
  const text = promptInput.value.trim();
  if (!text || turnInFlight || !driverBase) return;
  promptInput.value = '';
  autoResizeInput();
  dismissPalette();
  setTurnInFlight(true);
  // Only meaningful for a brand-new session's very first prompt (see the
  // new-chat project picker) — consumed here regardless of outcome, so a
  // retry after a failed attempt just falls back to the session's default
  // cwd rather than resending a value that may have been the problem.
  const cwdForThisPrompt = pendingCwdForNewSession && pendingCwdForNewSession.sessionId === currentSessionId
    ? pendingCwdForNewSession.cwd
    : undefined;
  pendingCwdForNewSession = null;
  try {
    const body = { sessionId: currentSessionId, text };
    if (cwdForThisPrompt) body.cwd = cwdForThisPrompt;
    const res = await fetch(`${driverBase}/prompt`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      setTurnInFlight(false);
      const errText = await res.text();
      console.error('Prompt submission failed:', errText);
      showLocalNotice(`*(message not sent: ${errText})*`);
    }
    // On success, setTurnInFlight(false) happens via the 'status' SSE event
    // (turn_end) once the driver's runTurn() actually finishes — not here,
    // since the real work happens asynchronously after this 202 response.
  } catch (e) {
    setTurnInFlight(false);
    console.error('Prompt submission failed:', e);
    showLocalNotice(`*(message not sent: ${e.message})*`);
  }
}

promptInput.addEventListener('input', autoResizeInput);
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitPrompt();
  }
});
sendBtn.addEventListener('click', submitPrompt);

stopBtn.addEventListener('click', async () => {
  if (!driverBase) return;
  try {
    await fetch(`${driverBase}/abort`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId }),
    });
  } catch (e) {
    console.error('Abort failed:', e);
  }
});

// ── Command palette ─────────────────────────────────────────────────────────
function dismissPalette() {
  paletteDropdown.classList.remove('show');
  paletteDropdown.innerHTML = '';
}

async function openPalette() {
  if (!driverBase) return;
  if (paletteDropdown.classList.contains('show')) {
    dismissPalette();
    return;
  }
  paletteDropdown.innerHTML = '<div class="palette-empty">Loading…</div>';
  paletteDropdown.classList.add('show');
  try {
    const res = await fetch(`${driverBase}/commands`);
    const cmds = await res.json();
    const visible = (cmds.slash_commands || [])
      .filter((name) => !(cmds.terminal_slash_commands || []).includes(name))
      .sort();
    if (visible.length === 0) {
      paletteDropdown.innerHTML = '<div class="palette-empty">No commands yet — send one message first (the list populates from that session\'s init).</div>';
      return;
    }
    paletteDropdown.innerHTML = '';
    for (const name of visible) {
      const item = document.createElement('div');
      item.className = 'palette-item';
      item.textContent = `/${name}`;
      item.addEventListener('click', () => {
        promptInput.value = `/${name} `;
        autoResizeInput();
        dismissPalette();
        promptInput.focus();
      });
      paletteDropdown.appendChild(item);
    }
  } catch (e) {
    paletteDropdown.innerHTML = '<div class="palette-empty">Failed to load commands.</div>';
    console.error('Failed to load /commands:', e);
  }
}

paletteBtn.addEventListener('click', openPalette);
document.addEventListener('click', (e) => {
  if (paletteDropdown.classList.contains('show') &&
      !paletteDropdown.contains(e.target) && e.target !== paletteBtn) {
    dismissPalette();
  }
});

// ── Session picker ───────────────────────────────────────────────────────────
const sessionsBtn    = document.getElementById('sessions-btn');
const sessionsPanel  = document.getElementById('sessions-panel');
const sessionsList   = document.getElementById('sessions-list');
const newChatBtn     = document.getElementById('new-chat-btn');
const sessionsTabs   = document.querySelectorAll('.sessions-tab');

let sessionsView = 'active'; // 'active' | 'archived'
let lastSessionsResult = null; // cached {sessions} from the last fetch

// Wipes the visible feed and its associated state entirely — used by
// viewSession() when this tab switches to a different session (or a fresh
// one). Any in-flight reveal animations get stopped first so a stale
// setInterval doesn't keep firing against a detached DOM node.
function clearFeed() {
  for (const m of Object.values(msgs)) {
    if (m.revealTimer) clearInterval(m.revealTimer);
  }
  for (const k of Object.keys(msgs)) delete msgs[k];
  feedOrder.length = 0;
  feed.innerHTML = '';
  feed.appendChild(empty);
}

function formatSessionWhen(lastModified) {
  try {
    return new Date(lastModified).toLocaleString([], {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
    });
  } catch (e) {
    return '';
  }
}

function startRenameEdit(titleEl, session) {
  const current = session.customTitle || session.summary || session.firstPrompt || '';
  const input = document.createElement('input');
  input.className = 'session-title-input';
  input.value = current;
  titleEl.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const newTitle = input.value.trim();
    if (save && newTitle && newTitle !== current && driverBase) {
      try {
        await fetch(`${driverBase}/rename-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: session.sessionId, title: newTitle }),
        });
      } catch (e) {
        console.error('Failed to rename session:', e);
      }
    }
    await refreshSessionsList();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

// Builds one session row — shared by both the flat and grouped layouts
// (only the surrounding structure differs between them).
function buildSessionItem(s, wantArchived) {
  // "Current" is purely this tab's own local choice now — there's no
  // server-reported notion of it anymore, so a second tab viewing a
  // different session correctly shows its OWN current session highlighted
  // here, not this tab's.
  const isCurrent = s.sessionId === currentSessionId;
  const item = document.createElement('div');
  item.className = 'session-item' + (isCurrent ? ' current' : '');
  const title = s.customTitle || s.summary || s.firstPrompt || '(untitled)';

  const titleEl = document.createElement('div');
  titleEl.className = 'session-title';

  const titleTextEl = document.createElement('span');
  titleTextEl.className = 'session-title-text';
  titleTextEl.textContent = title;

  // Built once, then placed on whichever side of the (separately
  // truncatable) title text the badgePosition setting asks for — see the
  // .session-title-text CSS comment for why the badge needs to be a
  // sibling of the truncated text rather than trailing content inside it.
  let badge = null;
  if (s.pendingKind === 'question') {
    badge = document.createElement('span');
    badge.className = 'session-badge needs-question';
    badge.title = 'Waiting on an answer';
  } else if (s.pendingKind === 'permission') {
    badge = document.createElement('span');
    badge.className = 'session-badge needs-permission';
    badge.title = 'Waiting on a permission decision';
  } else if (s.inFlight) {
    badge = document.createElement('span');
    badge.className = 'session-badge';
    badge.title = 'A turn is running';
  }
  if (badge && settings.badgePosition === 'before') titleEl.appendChild(badge);
  titleEl.appendChild(titleTextEl);
  if (badge && settings.badgePosition !== 'before') titleEl.appendChild(badge);
  titleEl.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    startRenameEdit(titleEl, s);
  });

  const metaEl = document.createElement('div');
  metaEl.className = 'session-meta';
  // The project tag is redundant once already grouped by project, so it
  // only needs to appear in the flat layout, where sessions from different
  // projects can sit right next to each other.
  const metaParts = [formatSessionWhen(s.lastModified)];
  if (settings.sessionsLayout !== 'grouped' && s.projectLabel) metaParts.push(s.projectLabel);
  metaEl.textContent = metaParts.filter(Boolean).join(' · ');

  const actions = document.createElement('div');
  actions.className = 'session-actions';

  // Deliberate open-in-new-tab affordance: a real <a href="?session=...">
  // rather than making the whole row a link — see the CSS comment on
  // .session-open-tab for why.
  const openTabLink = document.createElement('a');
  openTabLink.className = 'session-open-tab';
  openTabLink.href = `?session=${encodeURIComponent(s.sessionId)}`;
  openTabLink.target = '_blank';
  openTabLink.rel = 'noopener';
  openTabLink.title = 'Open in new tab';
  openTabLink.textContent = '⧉';
  openTabLink.addEventListener('click', (e) => e.stopPropagation());
  actions.appendChild(openTabLink);

  if (wantArchived) {
    const unarchiveBtn = document.createElement('button');
    unarchiveBtn.className = 'session-action-btn';
    unarchiveBtn.textContent = 'Unarchive';
    unarchiveBtn.addEventListener('click', (e) => { e.stopPropagation(); unarchiveSession(s.sessionId); });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'session-action-btn session-delete-btn';
    deleteBtn.textContent = 'Delete';
    deleteBtn.disabled = isCurrent;
    deleteBtn.title = isCurrent ? 'Switch away from this session first' : '';
    deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteSessionFromUi(s.sessionId, title); });

    actions.appendChild(unarchiveBtn);
    actions.appendChild(deleteBtn);
  } else {
    const archiveBtn = document.createElement('button');
    archiveBtn.className = 'session-action-btn';
    archiveBtn.textContent = 'Archive';
    archiveBtn.addEventListener('click', (e) => { e.stopPropagation(); archiveSession(s.sessionId); });
    actions.appendChild(archiveBtn);
  }

  item.appendChild(titleEl);
  item.appendChild(metaEl);
  item.appendChild(actions);
  item.addEventListener('click', () => viewSession(s.sessionId));
  return item;
}

// Unreachable sessions (project directory no longer resolves) get a much
// simpler row — nothing here is actionable, there's no cwd to resume into,
// so no click handler, no rename, no archive/delete.
function buildUnreachableItem(s) {
  const item = document.createElement('div');
  item.className = 'session-item session-unreachable';

  const titleEl = document.createElement('div');
  titleEl.className = 'session-title';
  const titleTextEl = document.createElement('span');
  titleTextEl.className = 'session-title-text';
  titleTextEl.textContent = s.firstPrompt || '(untitled)';
  titleEl.appendChild(titleTextEl);

  const metaEl = document.createElement('div');
  metaEl.className = 'session-meta';
  const parts = [formatSessionWhen(s.lastModified), s.projectLabel];
  if (s.lastKnownHostPath) parts.push(`last at ${s.lastKnownHostPath}`);
  metaEl.textContent = parts.filter(Boolean).join(' · ');
  if (s.lastKnownHostPath) {
    metaEl.title = `Relaunch the script from ${s.lastKnownHostPath} (or wherever it's since moved to) to reach this session again.`;
  }

  item.appendChild(titleEl);
  item.appendChild(metaEl);
  return item;
}

function renderUnreachableFooter(data) {
  if (settings.unreachableMode === 'hidden') return;

  if (settings.unreachableMode === 'count') {
    if (!data.unreachableCount) return;
    const note = document.createElement('div');
    note.className = 'unreachable-note';
    const plural = data.unreachableCount === 1 ? '' : 's';
    note.textContent = `${data.unreachableCount} session${plural} unreachable — the project ${plural ? 'directories' : 'directory'} ${plural ? "aren't" : "isn't"} currently reachable from this workspace.`;
    sessionsList.appendChild(note);
    return;
  }

  // 'shown' — itemized, but only if the fetch actually asked for it
  // (see refreshSessionsList) — falls back to the count if not.
  const list = data.unreachableSessions;
  if (!list) {
    renderUnreachableFooterAsCount(data);
    return;
  }
  if (list.length === 0) return;
  const header = document.createElement('div');
  header.className = 'session-group-header';
  header.textContent = `Unreachable (${list.length})`;
  sessionsList.appendChild(header);
  for (const s of list) {
    sessionsList.appendChild(buildUnreachableItem(s));
  }
}

// Fallback for the 'shown' setting when unreachableSessions wasn't fetched
// yet (e.g. the setting just changed and refreshSessionsList hasn't
// round-tripped again) — degrade to the cheap count rather than show
// nothing at all.
function renderUnreachableFooterAsCount(data) {
  if (!data.unreachableCount) return;
  const note = document.createElement('div');
  note.className = 'unreachable-note';
  note.textContent = `${data.unreachableCount} session(s) unreachable.`;
  sessionsList.appendChild(note);
}

function renderSessionsList() {
  const data = lastSessionsResult;
  if (!data) return;
  const wantArchived = sessionsView === 'archived';
  const sessions = (data.sessions || []).filter((s) => (s.tag === 'archived') === wantArchived);

  // This rebuilds the whole list from scratch every time, including on
  // each periodic poll tick (see startSessionsPoll) — without this, sitting
  // on a long scrolled-down list while the panel polls in the background
  // would silently yank you back to the top every 4 seconds.
  const scrollTop = sessionsList.scrollTop;
  sessionsList.innerHTML = '';

  if (sessions.length === 0) {
    sessionsList.innerHTML = `<div class="palette-empty">${wantArchived ? 'No archived sessions.' : 'No sessions yet.'}</div>`;
  } else if (settings.sessionsLayout === 'grouped') {
    const groups = new Map(); // projectLabel -> sessions[]
    for (const s of sessions) {
      const label = s.projectLabel || '(root)';
      if (!groups.has(label)) groups.set(label, []);
      groups.get(label).push(s);
    }
    // Each group ordered internally by recency (already true — sessions
    // arrives pre-sorted); groups themselves ordered by their own most
    // recent session, so the busiest-lately project floats to the top.
    const sortedGroups = [...groups.entries()].sort((a, b) =>
      Math.max(...b[1].map((s) => s.lastModified || 0)) - Math.max(...a[1].map((s) => s.lastModified || 0)));
    for (const [label, groupSessions] of sortedGroups) {
      const header = document.createElement('div');
      header.className = 'session-group-header';
      header.textContent = `${label} (${groupSessions.length})`;
      sessionsList.appendChild(header);
      for (const s of groupSessions) sessionsList.appendChild(buildSessionItem(s, wantArchived));
    }
  } else {
    for (const s of sessions) sessionsList.appendChild(buildSessionItem(s, wantArchived));
  }

  if (!wantArchived) renderUnreachableFooter(data);
  sessionsList.scrollTop = scrollTop;
}

// `full: false` is the periodic poll tick (see startSessionsPoll) — it
// skips ?includeUnreachable=1 even under the 'shown' setting, since
// itemized unreachable detail needs the driver to read raw transcript
// files directly and doesn't change moment to moment the way turn/
// permission status does; the last full fetch's copy is reused instead of
// re-deriving it on every tick.
// Both the poll timer and pokeSessionsListIfOpen() call this independently
// now, so overlapping requests are routine, not a rare edge case — and
// fetch() gives no ordering guarantee: a slower, earlier-issued request
// (e.g. a poll tick that started just before a turn began) can resolve
// *after* a faster, later one (a poke firing right on turn_start), and
// without this guard its stale response would silently overwrite the
// fresher one merely by arriving last. A monotonic sequence number, with
// only the response matching the most-recently-issued request applied,
// fixes that regardless of resolution order. This would disproportionately
// hit a session whose state is actively toggling (the one you're mid-
// conversation with) while never visibly affecting a frozen one — which
// fits "the current session's badge doesn't show, but a stuck idle one
// does" exactly.
let sessionsFetchSeq = 0;
async function refreshSessionsList({ full = true } = {}) {
  if (!driverBase) return;
  const seq = ++sessionsFetchSeq;
  try {
    const qs = (full && settings.unreachableMode === 'shown') ? '?includeUnreachable=1' : '';
    const res = await fetch(`${driverBase}/sessions${qs}`);
    const data = await res.json();
    if (seq !== sessionsFetchSeq) return; // a newer request has since been issued — this one's stale, drop it
    if (!full && lastSessionsResult?.unreachableSessions) {
      data.unreachableSessions = lastSessionsResult.unreachableSessions;
    }
    lastSessionsResult = data;
    renderSessionsList();
  } catch (e) {
    if (seq !== sessionsFetchSeq) return;
    sessionsList.innerHTML = '<div class="palette-empty">Failed to load sessions.</div>';
    console.error('Failed to load /sessions:', e);
  }
}

// Lets the currently-viewed session's own already-instant SSE signals
// (turn_start/turn_end, a permission or question appearing or resolving)
// also refresh the sessions panel right away, instead of waiting for the
// next poll tick — called from the 'status' and 'message' handlers in
// connect(). This is the case a poll interval alone can't make feel
// instant, since this tab already knows about it the moment it happens; a
// *different* session's turn ending is still bounded by the poll interval
// below, since this tab has no live signal for that at all (each SSE
// stream is scoped to one session by design).
function pokeSessionsListIfOpen() {
  if (sessionsPanel.classList.contains('open')) {
    refreshSessionsList({ full: false });
  }
}

// pokeSessionsListIfOpen() only covers the session THIS tab already has a
// live SSE connection to (whatever it's currently viewing) — a *different*
// session's turn starting/ending has no signal to piggyback on at all,
// since each /events stream is scoped to one session by design. This
// separate, global /events-meta channel (server.py's meta_clients, not
// nested under any one session) fills that gap: any tab with the sessions
// panel open subscribes to it and gets a lightweight ping whenever *any*
// session's turn or permission/question state changes, regardless of
// whether this tab is looking at that session at all.
let metaEventSource = null;
function startMetaSubscription() {
  stopMetaSubscription();
  metaEventSource = new EventSource('/events-meta');
  metaEventSource.addEventListener('change', () => {
    // Self-closing on the next event rather than tracked against every
    // place that can close the panel, same rationale as the poll timer
    // below — simpler than pairing a stop call with each close path, at
    // the cost of one open-but-idle connection until the next change
    // happens anywhere (already the same tradeoff the main per-session
    // /events connections make, which also stay open indefinitely once
    // a tab connects).
    if (!sessionsPanel.classList.contains('open')) {
      stopMetaSubscription();
      return;
    }
    refreshSessionsList({ full: false });
  });
}
function stopMetaSubscription() {
  if (metaEventSource) { metaEventSource.close(); metaEventSource = null; }
}

// Now purely a safety net (the meta subscription above is the real-time
// path) — covers a dropped/buffered SSE connection that hasn't been
// noticed yet, so it can stay slow; no longer the primary mechanism, hence
// the long interval.
let sessionsPollTimer = null;
function startSessionsPoll() {
  clearInterval(sessionsPollTimer);
  sessionsPollTimer = setInterval(() => {
    if (!sessionsPanel.classList.contains('open')) {
      clearInterval(sessionsPollTimer);
      return;
    }
    refreshSessionsList({ full: false });
  }, 20000);
}

async function openSessionsPanel() {
  if (sessionsPanel.classList.contains('open')) {
    sessionsPanel.classList.remove('open');
    stopMetaSubscription();
    return;
  }
  if (!driverBase) return;
  sessionsList.innerHTML = '<div class="palette-empty">Loading…</div>';
  sessionsPanel.classList.add('open');
  await refreshSessionsList();
  startMetaSubscription();
  startSessionsPoll();
}

// Note: there's no more switchSession() here that POSTs to the driver —
// viewSession() (defined up near connect()) is purely client-side now and
// is what every call site below uses. Switching (or starting a new chat)
// no longer needs to check turnInFlight at all: viewing is just an SSE
// subscription, completely decoupled from execution, so leaving a
// session's turn running in the background while you look at something
// else is exactly the point.

async function archiveSession(sessionId) {
  if (!driverBase) return;
  const wasCurrent = sessionId === currentSessionId;
  try {
    await fetch(`${driverBase}/archive-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId }),
    });
    // Archiving doesn't disable resume, so this tab COULD keep viewing an
    // archived session just fine — but if it's the one you're currently
    // looking at, moving to something else automatically (rather than
    // leaving you parked on a session that just vanished from the active
    // list) mirrors what the driver itself used to do server-side before
    // multi-session support removed its single notion of "the" session.
    if (wasCurrent) {
      try {
        const res = await fetch(`${driverBase}/sessions`);
        const data = await res.json();
        const nextActive = (data.sessions || [])
          .filter((s) => s.sessionId !== sessionId && s.tag !== 'archived')
          .sort((a, b) => b.lastModified - a.lastModified)[0];
        viewSession(nextActive ? nextActive.sessionId : crypto.randomUUID());
      } catch (e) {
        console.error('Failed to pick a session to move to after archiving:', e);
        viewSession(crypto.randomUUID());
      }
    }
    await refreshSessionsList();
  } catch (e) {
    console.error('Failed to archive session:', e);
  }
}

async function unarchiveSession(sessionId) {
  if (!driverBase) return;
  try {
    await fetch(`${driverBase}/unarchive-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId }),
    });
    await refreshSessionsList();
  } catch (e) {
    console.error('Failed to unarchive session:', e);
  }
}

async function deleteSessionFromUi(sessionId, title) {
  if (!driverBase) return;
  if (!confirm(`Permanently delete "${title}"? This cannot be undone.`)) return;
  try {
    const res = await fetch(`${driverBase}/delete-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      alert(body.error || 'Failed to delete session.');
    }
    await refreshSessionsList();
  } catch (e) {
    console.error('Failed to delete session:', e);
  }
}

for (const tab of sessionsTabs) {
  tab.addEventListener('click', () => {
    sessionsView = tab.dataset.view;
    for (const t of sessionsTabs) t.classList.toggle('active', t === tab);
    renderSessionsList();
  });
}

sessionsBtn.addEventListener('click', openSessionsPanel);
// ── New-chat project picker ─────────────────────────────────────────────────
const newChatPicker = document.getElementById('new-chat-picker');

function dismissNewChatPicker() {
  newChatPicker.classList.remove('show');
  newChatPicker.innerHTML = '';
}

// No server round-trip needed to actually *create* anything here — a "new
// chat" is just a client-minted id nobody has used before; driver.mjs
// figures out it's brand new (vs. an existing session it just hasn't
// touched yet) the same way either way, the first time a prompt actually
// arrives for it. The cwd (if not the default root) rides along as
// pendingCwdForNewSession and gets attached to that first prompt.
function startNewChatInProject(cwd) {
  const id = crypto.randomUUID();
  pendingCwdForNewSession = cwd ? { sessionId: id, cwd } : null;
  dismissNewChatPicker();
  sessionsPanel.classList.remove('open');
  viewSession(id);
}

async function openNewChatPicker() {
  if (newChatPicker.classList.contains('show')) {
    dismissNewChatPicker();
    return;
  }
  if (!driverBase) return;
  newChatPicker.innerHTML = '<div class="palette-empty">Loading…</div>';
  newChatPicker.classList.add('show');
  try {
    const res = await fetch(`${driverBase}/projects`);
    const data = await res.json();
    // Best-effort only — if the current session isn't in the cached list
    // yet (e.g. panel never opened this tab load), nothing gets marked
    // "current" here, which is purely cosmetic, not a correctness issue.
    const currentCwd = lastSessionsResult?.sessions?.find((s) => s.sessionId === currentSessionId)?.cwd;

    newChatPicker.innerHTML = '';
    for (const p of data.projects || []) {
      const item = document.createElement('div');
      const isCurrent = p.cwd === currentCwd;
      item.className = 'new-chat-project-item' + (isCurrent ? ' current' : '');
      item.textContent = isCurrent ? `${p.label} (current)` : p.label;
      item.addEventListener('click', () => startNewChatInProject(p.cwd === data.root ? undefined : p.cwd));
      newChatPicker.appendChild(item);
    }

    const customRow = document.createElement('div');
    customRow.className = 'new-chat-custom-row';
    const input = document.createElement('input');
    input.placeholder = 'Or type a subdirectory path…';
    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) startNewChatInProject(input.value.trim());
    });
    customRow.appendChild(input);
    newChatPicker.appendChild(customRow);
  } catch (e) {
    newChatPicker.innerHTML = '<div class="palette-empty">Failed to load projects.</div>';
    console.error('Failed to load /projects:', e);
  }
}

newChatBtn.addEventListener('click', openNewChatPicker);
document.addEventListener('click', (e) => {
  if (newChatPicker.classList.contains('show') &&
      !newChatPicker.contains(e.target) && e.target !== newChatBtn) {
    dismissNewChatPicker();
  }
});

document.addEventListener('click', (e) => {
  if (sessionsPanel.classList.contains('open') &&
      !sessionsPanel.contains(e.target) && e.target !== sessionsBtn) {
    sessionsPanel.classList.remove('open');
  }
});

// Wait for KaTeX to load before connecting
window.addEventListener('load', () => {
  connect();
  loadDriverConfig();
});
</script>
</body>
</html>
