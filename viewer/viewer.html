<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Viewer</title>

<!-- Applies saved font-size/width/theme before first paint, so there's no
     flash of default sizing on load. Kept intentionally tiny and dependency-free. -->
<script>
(function() {
  try {
    var s = JSON.parse(localStorage.getItem('viewerSettings') || '{}');
    var root = document.documentElement;
    if (s.fontSize) root.style.setProperty('--font-size', s.fontSize + 'px');
    if (s.width) root.style.setProperty('--content-width', s.width + 'px');
    if (s.theme === 'light') root.setAttribute('data-theme', 'light');
  } catch (e) {}
})();
</script>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<!-- marked (markdown) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

<!-- highlight.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
  /* ── Design tokens ─────────────────────────────────────────────────── */
  :root {
    --bg:        #0f1117;
    --surface:   #181c27;
    --border:    #252a38;
    --text:      #d4d8e8;
    --muted:     #5a617a;
    --accent:    #5b8dee;
    --user-bg:   #1a1f2e;
    --user-border: #2a3050;
    --assistant-bg: #181c27;
    --code-bg:   #12151f;
    --green:     #4ade80;
    --purple:    #a78bfa;
    --heading:   #eef0f8;
    --em-color:  #b0bcd8;
    --inline-code-color: #a5b4fc;
    --zebra-row: rgba(255,255,255,.02);
    --sans: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --radius: 10px;
    --font-size: 15px;
    --content-width: 860px;
    --label-font-size: 11px;
    --status-font-size: 12px;
  }

  /* ── Light theme override ─────────────────────────────────────────── */
  /* Values chosen for the same WCAG-friendly contrast a dark-on-light chat
     UI needs (headings/code darker than body text, not near-white
     accents carried over unchanged from the dark palette). */
  :root[data-theme="light"] {
    --bg:        #f4f5fa;
    --surface:   #ffffff;
    --border:    #e1e4ee;
    --text:      #1d2233;
    --muted:     #5b6478;
    --accent:    #3b6fe0;
    --user-bg:   #eaeefb;
    --user-border: #c7d2f4;
    --assistant-bg: #ffffff;
    --code-bg:   #f0f1f6;
    --green:     #15803d;
    --purple:    #7c3aed;
    --heading:   #10131f;
    --em-color:  #475569;
    --inline-code-color: #4338ca;
    --zebra-row: rgba(15,23,42,.035);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: var(--font-size);
    line-height: 1.65;
  }

  /* ── Layout ────────────────────────────────────────────────────────── */
  #app {
    display: grid;
    grid-template-rows: 48px 1fr auto;
    height: 100vh;
    max-width: var(--content-width);
    margin: 0 auto;
    position: relative;
  }

  /* ── Header ────────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .02em;
  }
  header .logo {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .85;
    flex-shrink: 0;
  }
  header span { flex: 1; }
  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  #status-dot.live  { background: var(--green); }
  #status-dot.error { background: #f87171; }

  header button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 5px 7px;
    border-radius: 6px;
  }
  header button:hover { background: var(--border); color: var(--text); }

  /* ── Settings panel ────────────────────────────────────────────────── */
  #settings-panel {
    display: none;
    position: absolute;
    top: 48px;
    right: 20px;
    width: 230px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 20;
  }
  #settings-panel.open { display: block; }
  .settings-row { margin-bottom: 14px; font-size: 13px; }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .settings-row input[type="range"] { width: 100%; margin-top: 6px; grid-column: 1 / -1; }
  .settings-row .row-value { color: var(--muted); font-variant-numeric: tabular-nums; }
  .settings-row select {
    background: var(--code-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 12px;
  }
  .settings-row.disabled label { opacity: .45; }
  .settings-group-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 8px;
  }

  /* ── Sessions panel ────────────────────────────────────────────────── */
  #sessions-panel {
    display: none;
    position: absolute;
    top: 48px;
    left: 20px;
    width: 280px;
    max-height: 70vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 20;
    overflow: hidden;
    flex-direction: column;
  }
  #sessions-panel.open { display: flex; }
  #sessions-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  #new-chat-wrap { position: relative; }
  #new-chat-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    text-transform: none;
    letter-spacing: normal;
    font-weight: 600;
    cursor: pointer;
  }

  /* New-chat project picker: which project (existing, or a freshly typed
     subdirectory) the new session should start in. Defaults effectively to
     "just continue in the current project" — that row is listed first and
     marked, so the zero-effort case is still just one extra click, not a
     detour, while the deliberate cross-project case is right there too. */
  #new-chat-picker {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    width: 260px;
    max-height: 280px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    z-index: 25;
    text-transform: none;
    letter-spacing: normal;
    font-weight: 400;
  }
  #new-chat-picker.show { display: block; }
  .new-chat-project-item {
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .new-chat-project-item:hover { background: var(--code-bg); }
  .new-chat-project-item.current { color: var(--accent); font-weight: 600; }
  .new-chat-custom-row { padding: 8px 14px; }
  .new-chat-custom-row input {
    width: 100%;
    background: var(--code-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: var(--mono);
  }
  #sessions-view-toggle {
    display: flex;
    gap: 2px;
    padding: 8px 14px 0;
  }
  .sessions-tab {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 5px 10px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
  }
  .sessions-tab.active { color: var(--accent); background: var(--code-bg); }

  #sessions-list { overflow-y: auto; }
  .session-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    position: relative;
  }
  .session-item:last-child { border-bottom: none; }
  .session-item:hover { background: var(--code-bg); }
  .session-item.current { background: var(--code-bg); border-left: 3px solid var(--accent); }
  .session-title {
    font-size: 13px;
    color: var(--text);
    padding-right: 60px; /* room for hover actions */
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0; /* required for the text child's overflow/ellipsis to work inside a flex parent */
  }
  /* The truncatable part of the title lives in its own flex child now —
     .session-title itself used to carry white-space:nowrap/overflow:hidden/
     text-overflow:ellipsis directly, with the badge appended as a plain
     trailing text-node sibling. That meant a long enough title (anything
     that actually needed the ellipsis) clipped the badge right along with
     the truncated text, since both were just inline content in the same
     nowrap box — a short title like "TRUMPET" happened to never trigger
     it. Isolating truncation to this span and giving the badge
     flex-shrink:0 below means the badge always renders regardless of
     title length or which side it's placed on (see badgePosition
     setting). */
  .session-title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    /* flex-grow: 0 (not 1) is deliberate: growing to fill the row would be
       visually invisible in "before" placement (nothing marks the box's
       edge), but in "after" placement it drags the badge all the way to
       the far edge even for a short title like "TRUMPET" that never
       needed the space — looking detached from its own title. flex-
       shrink: 1 (via the "auto" below) still lets a long title shrink
       down to the available width and truncate exactly as before; it
       just no longer expands past its own content when it doesn't need
       to. */
    flex: 0 1 auto;
  }
  .session-title-input {
    font-size: 13px;
    font-family: var(--sans);
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 4px;
    width: calc(100% - 8px);
  }
  .session-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Cross-session awareness: visible without switching to that session.
     A pending decision (permission or question) takes visual priority over
     a plain inFlight dot (still just running) — it's more actionable, and
     the two decision kinds get distinct colors/tooltips rather than one
     generic "permission" badge for both, since a question isn't actually a
     permission at all. */
  .session-badge {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0; /* never let the title text's overflow squeeze this out */
    background: var(--green);
  }
  .session-badge.needs-permission {
    background: var(--accent);
    animation: badge-pulse 1.4s ease-in-out infinite;
  }
  .session-badge.needs-question {
    background: var(--purple);
    animation: badge-pulse 1.4s ease-in-out infinite;
  }
  @keyframes badge-pulse { 50% { opacity: .35; } }

  /* Grouped-by-project layout: a section header per project, sorted (like
     the flat view) by that group's own most-recent session. */
  .session-group-header {
    padding: 8px 14px 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }

  /* Unreachable sessions (project directory no longer resolves — see the
     'Unreachable sessions' setting): visibly inert, not just dim text —
     there's genuinely nothing to click here, unlike every other row. */
  .session-item.session-unreachable {
    cursor: default;
    opacity: .55;
  }
  .session-item.session-unreachable:hover { background: none; }
  .unreachable-note {
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    border-top: 1px solid var(--border);
  }

  /* Open-in-new-tab affordance, separate from the main clickable row (which
     stays a plain div with its own click handler) rather than making the
     whole row an <a> — the row already nests interactive children
     (rename-on-dblclick, archive/delete buttons), and anchors with nested
     interactive elements are a real minefield for click/navigation
     semantics; a small dedicated link sidesteps all of that. */
  .session-open-tab {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .session-open-tab:hover { color: var(--text); background: var(--border); }

  .session-actions {
    position: absolute;
    top: 8px;
    right: 10px;
    display: none;
    gap: 4px;
  }
  .session-item:hover .session-actions { display: flex; }
  .session-action-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 11px;
    cursor: pointer;
  }
  .session-action-btn:hover { border-color: var(--accent); color: var(--text); }
  .session-action-btn.session-delete-btn:hover { border-color: #f87171; color: #f87171; }
  .session-action-btn:disabled { opacity: .35; cursor: not-allowed; }
  .session-action-btn:disabled:hover { border-color: var(--border); color: var(--muted); }

  /* ── Message feed ──────────────────────────────────────────────────── */
  #feed {
    position: relative;
    overflow-y: auto;
    padding: 28px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    /* scroll-behavior is set from JS (applySettings) per the "Auto-scroll
       animation" setting, not hardcoded here — see the autoscroll-anim
       select and the pinnedToBottom/autoScrolling logic near scrollBottom(). */
  }
  #feed::-webkit-scrollbar { width: 6px; }
  #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  #new-pill {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    display: none;
    z-index: 15;
  }
  #new-pill.show { display: block; }

  /* ── Turn-in-flight indicator ──────────────────────────────────────── */
  /* Ephemeral "Thinking…" / "Running `Bash`… (12s)" line — covers the gap
     before any content has streamed in yet, and long-running tool calls.
     Disappears the moment real content starts streaming (see stream_start
     handling) or the turn ends. */
  #turn-indicator {
    display: none;
    padding: 4px 20px 0;
    font-size: var(--status-font-size);
    color: var(--muted);
    font-style: italic;
  }
  #turn-indicator.show { display: block; }

  /* ── Input bar ─────────────────────────────────────────────────────── */
  #input-bar {
    position: relative;
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    background: var(--bg);
  }
  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #palette-btn, #stop-btn, #send-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  #palette-btn { font-family: var(--mono); padding: 9px 12px; }
  #send-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
  #send-btn:disabled, #palette-btn:disabled { opacity: .5; cursor: not-allowed; }
  #stop-btn { background: #f87171; border-color: #f87171; color: #fff; display: none; }
  #stop-btn.show { display: block; }
  #send-btn.hide-for-stop { display: none; }

  #prompt-input {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 200px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--sans);
    font-size: var(--font-size);
    line-height: 1.4;
  }
  #prompt-input:disabled { opacity: .6; }
  #prompt-input:focus { outline: 1px solid var(--accent); }

  /* ── Command palette ──────────────────────────────────────────────── */
  #palette-dropdown {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 20px;
    right: 20px;
    max-height: 260px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #palette-dropdown.show { display: block; }
  .palette-item {
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .palette-item:last-child { border-bottom: none; }
  .palette-item:hover { background: var(--code-bg); }
  .palette-empty { padding: 10px 14px; color: var(--muted); font-size: 13px; }

  /* ── Permission / question cards ──────────────────────────────────── */
  .perm-card { display: flex; flex-direction: column; gap: 10px; }
  .perm-q-text { font-weight: 600; color: var(--heading); }
  .perm-tool-summary {
    font-family: var(--mono);
    font-size: .85em;
    color: var(--muted);
  }
  .perm-question { display: flex; flex-direction: column; gap: 6px; }
  .perm-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .perm-option-btn {
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .perm-option-btn:hover { border-color: var(--accent); }
  .perm-option-btn.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .perm-option-btn.perm-allow:hover { border-color: var(--green); }
  .perm-option-btn.perm-deny:hover { border-color: #f87171; }
  .perm-submit-btn {
    align-self: flex-start;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .perm-submit-btn:disabled { opacity: .4; cursor: not-allowed; }
  .perm-resolved { color: var(--muted); font-size: .9em; font-style: italic; }

  /* ── Message bubble ─────────────────────────────────────────────────── */
  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fadein .2s ease;
    position: relative;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }

  #feed.hide-tools .msg.tool { display: none; }

  .msg-label {
    font-size: var(--label-font-size);
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 4px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .msg-label .ts {
    font-size: .9em;
    font-weight: 400;
    letter-spacing: normal;
    text-transform: none;
    color: var(--muted);
    opacity: .7;
  }
  .msg-label .ts:empty { display: none; }
  .msg.user   .msg-label { color: var(--accent); }
  .msg.assistant .msg-label { color: var(--muted); }
  .msg.tool   .msg-label { color: var(--green); }
  .msg.agent  .msg-label { color: var(--purple); }
  .msg.thinking .msg-label { color: var(--purple); }
  .msg.permission .msg-label { color: var(--accent); }
  .msg.permission .msg-body { border-color: var(--accent); }

  /* thinking blocks: distinct from assistant text, subdued/italic like the
     TUI's collapsed thinking display */
  .msg.thinking .msg-body {
    font-style: italic;
    color: var(--muted);
    background: var(--code-bg);
  }

  /* tool bubbles can now hold real diffs (Edit/Write), not just a one-liner —
     cap height so a huge diff doesn't dominate the feed */
  .msg.tool .msg-body pre { max-height: 400px; overflow-y: auto; }

  /* whole-message copy button (assistant only) */
  .msg-copy-btn {
    position: absolute;
    top: 22px;
    right: 0;
    background: var(--border);
    color: var(--muted);
    border: none;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
  }
  .msg.assistant:hover .msg-copy-btn { opacity: 1; }
  .msg-copy-btn:hover { background: var(--accent); color: #fff; }

  /* agent report: raw, collapsed by default */
  .agent-summary {
    cursor: pointer;
    color: var(--muted);
    font-size: .85em;
    user-select: none;
  }
  .agent-raw {
    display: none;
    white-space: pre-wrap;
    font-family: var(--mono);
    font-size: .82em;
    color: var(--muted);
    margin-top: 10px;
  }
  .agent-body.expanded .agent-raw { display: block; }

  .msg-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    line-height: 1.7;
  }
  .msg.user .msg-body {
    background: var(--user-bg);
    border-color: var(--user-border);
  }
  .msg.tool .msg-body {
    padding: 8px 14px;
    font-size: .88em;
    color: var(--muted);
    background: var(--code-bg);
  }
  .msg.tool .msg-body p { margin: 0; }

  /* streaming cursor */
  .msg-body.streaming::after {
    content: '▋';
    display: inline;
    color: var(--accent);
    animation: blink .8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Markdown inside bubbles ────────────────────────────────────────── */
  .msg-body h1, .msg-body h2, .msg-body h3 {
    font-weight: 600;
    margin: 1.1em 0 .5em;
    color: var(--heading);
  }
  .msg-body h1 { font-size: 1.3em; }
  .msg-body h2 { font-size: 1.15em; }
  .msg-body h3 { font-size: 1em; }
  .msg-body p  { margin: .6em 0; }
  .msg-body ul, .msg-body ol { padding-left: 1.4em; margin: .6em 0; }
  .msg-body li { margin: .3em 0; }

  .msg-body strong { color: var(--heading); font-weight: 600; }
  .msg-body em { color: var(--em-color); }
  .msg-body a  { color: var(--accent); text-decoration: none; }
  .msg-body a:hover { text-decoration: underline; }
  .msg-body hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* inline code */
  .msg-body code:not(pre code) {
    font-family: var(--mono);
    font-size: .875em;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--inline-code-color);
  }

  /* fenced code blocks */
  .msg-body pre {
    background: var(--code-bg) !important;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: .8em 0;
    position: relative;
  }
  .msg-body pre code {
    font-family: var(--mono);
    font-size: .82em;
    background: none !important;
    border: none !important;
    padding: 0 !important;
    color: inherit;
  }

  /* copy button */
  .copy-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--border);
    color: var(--muted);
    border: none;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
  }
  .msg-body pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--accent); color: #fff; }

  /* ── KaTeX overrides ────────────────────────────────────────────────── */
  .katex-display {
    overflow-x: auto;
    padding: 6px 0;
    margin: .8em 0 !important;
  }
  .katex { font-size: 1.05em; }

  /* ── Empty state ────────────────────────────────────────────────────── */
  #empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }
  #empty .icon {
    font-size: 36px;
    opacity: .4;
  }
  #empty code {
    font-family: var(--mono);
    font-size: .85em;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
  }

  /* ── Blockquote ─────────────────────────────────────────────────────── */
  .msg-body blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 14px;
    color: var(--muted);
    margin: .6em 0;
  }

  /* ── Table ──────────────────────────────────────────────────────────── */
  .msg-body table {
    border-collapse: collapse;
    width: 100%;
    margin: .8em 0;
    font-size: .9em;
  }
  .msg-body th, .msg-body td {
    border: 1px solid var(--border);
    padding: 7px 12px;
    text-align: left;
  }
  .msg-body th { background: var(--code-bg); color: var(--heading); font-weight: 600; }
  .msg-body tr:nth-child(even) td { background: var(--zebra-row); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="sessions-btn" title="Sessions">☰</button>
    <div class="logo"></div>
    <span>Claude Viewer</span>
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-label">connecting…</span>
    </div>
    <button id="export-btn" title="Export conversation as Markdown">⬇</button>
    <button id="settings-btn" title="Settings">⚙</button>
  </header>

  <div id="sessions-panel">
    <div id="sessions-panel-header">
      <span>Sessions</span>
      <div id="new-chat-wrap">
        <button id="new-chat-btn">+ New chat</button>
        <div id="new-chat-picker"></div>
      </div>
    </div>
    <div id="sessions-view-toggle">
      <button class="sessions-tab active" data-view="active">Active</button>
      <button class="sessions-tab" data-view="archived">Archived</button>
    </div>
    <div id="sessions-list"></div>
  </div>

  <div id="settings-panel">
    <div class="settings-row">
      <label>Font size <span class="row-value" id="font-size-val">15px</span></label>
      <input type="range" id="font-size-slider" min="8" max="40" step="1" value="15">
    </div>
    <div class="settings-row">
      <label>Content width <span class="row-value" id="width-val">860px</span></label>
      <input type="range" id="width-slider" min="360" max="2600" step="20" value="860">
    </div>
    <div class="settings-row">
      <label>Label size <span class="row-value" id="label-size-val">11px</span></label>
      <input type="range" id="label-size-slider" min="6" max="32" step="1" value="11">
    </div>
    <div class="settings-row">
      <label>Status text size <span class="row-value" id="status-size-val">12px</span></label>
      <input type="range" id="status-size-slider" min="6" max="32" step="1" value="12">
    </div>
    <div class="settings-row">
      <label><span>Light theme</span> <input type="checkbox" id="theme-toggle"></label>
    </div>
    <div class="settings-row">

    </div>
    <div class="settings-row">
      <label>Auto-scroll animation
        <select id="autoscroll-anim">
          <option value="smooth" selected>Smooth</option>
          <option value="instant">Instant</option>

    </div>

    <div class="settings-group-title">Sessions</div>
    <div class="settings-row">
      <label>Layout
        <select id="sessions-layout">
          <option value="flat" selected>Flat</option>
          <option value="grouped">Grouped by project</option>

    </div>
    <div class="settings-row">
      <label>Unreachable sessions
        <select id="unreachable-mode">
          <option value="hidden">Hidden</option>

        <select id="badge-position">
          <option value="after" selected>After title</option>
          <option value="before">Before title</option>

    <div class="settings-group-title">Timestamps</div>
    <div class="settings-row">
      <label>Format
        <select id="ts-format">
          <option value="hidden">Hidden</option>
          <option value="time" selected>Time only</option>
          <option value="datetime">Date + time</option>
        </select>
      </label>
    </div>
    <div class="settings-row" id="ts-24h-row">
      <label><span>24-hour time</span> <input type="checkbox" id="ts-24h"></label>
    </div>

    </div>
  </div>

  <div id="feed">
    <div id="empty">
      <div class="icon">⌨</div>
      <p>Waiting for messages from Claude Code…</p>
      <p>Type a prompt below, or in your terminal — either way, it renders here.</p>
    </div>
  </div>
  <button id="new-pill">↓ New messages</button>
  <div id="turn-indicator"></div>

  <div id="input-bar">
    <div id="palette-dropdown"></div>
    <div id="input-row">
      <button id="palette-btn" title="Commands">/</button>
      <textarea id="prompt-input" rows="1" placeholder="Message Claude… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send-btn">Send</button>
      <button id="stop-btn">Stop</button>
    </div>
  </div>

<script>
// ── marked config ────────────────────────────────────────────────────────────
marked.setOptions({
  breaks: true,
  gfm: true,
});

const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  const language = hljs.getLanguage(lang) ? lang : 'plaintext';
  const highlighted = hljs.highlight(code, { language }).value;
  return `<pre><button class="copy-btn" onclick="copyCode(this)">copy</button><code class="hljs language-${language}">${highlighted}</code></pre>`;
};
marked.use({ renderer });

function copyCode(btn) {
  const code = btn.nextElementSibling.innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'copied!';
    setTimeout(() => btn.textContent = 'copy', 1500);
  });
}

// ── KaTeX render ─────────────────────────────────────────────────────────────
// Math is extracted and rendered to HTML *before* marked.parse() runs, so
// markdown (in particular `breaks: true`, which turns newlines into <br>)
// can't mangle multi-line LaTeX like \begin{aligned}/\begin{pmatrix}.
let mathStore = [];

function extractMath(text) {
  mathStore = [];
  const pattern = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\$\n]+?)\$/g;
  return text.replace(pattern, (match, disp1, disp2, inl1, inl2) => {
    const isDisplay = disp1 !== undefined || disp2 !== undefined;
    const src = disp1 ?? disp2 ?? inl1 ?? inl2;
    const idx = mathStore.push({ src, isDisplay }) - 1;
    return `@@MATH${idx}@@`;
  });
}

function injectMath(html) {
  return html.replace(/@@MATH(\d+)@@/g, (match, i) => {
    const { src, isDisplay } = mathStore[i];
    try {
      return katex.renderToString(src, { displayMode: isDisplay, throwOnError: false });
    } catch (e) {
      return match;
    }
  });
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
const feed   = document.getElementById('feed');
const empty  = document.getElementById('empty');
const dot    = document.getElementById('status-dot');
const label  = document.getElementById('status-label');
const msgs   = {};   // id → { el, rawText, role, tsEl, revealTimer }
const feedOrder = []; // ids in the order they were created, for export

function setStatus(state, text) {
  dot.className = state;
  label.textContent = text;
}

const turnIndicator = document.getElementById('turn-indicator');
function setTurnIndicator(text) {
  if (!text) {
    turnIndicator.classList.remove('show');
    turnIndicator.textContent = '';
    return;
  }
  turnIndicator.textContent = text;
  turnIndicator.classList.add('show');
}

function removeEmpty() {
  if (empty.parentNode) empty.remove();
}

function labelFor(role) {
  if (role === 'user') return 'You';
  if (role === 'tool') return 'Tool';
  if (role === 'agent') return 'Agent';
  if (role === 'thinking') return 'Thinking';
  if (role === 'permission') return 'Permission';
  return 'Claude';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTs(iso) {
  if (!iso || settings.tsFormat === 'hidden') return '';
  const opts = { hour: '2-digit', minute: '2-digit', hour12: !settings.hour24 };
  if (settings.tsFormat === 'datetime') {
    opts.year = 'numeric';
    opts.month = 'short';
    opts.day = 'numeric';
  }
  if (settings.showTz) opts.timeZoneName = 'short';
  try {
    return new Date(iso).toLocaleString([], opts);
  } catch (e) {
    return '';
  }
}

// Timestamp settings (format/12h-24h/timezone) apply retroactively, since
// they're cheap to recompute — every rendered message keeps its raw ISO
// string precisely so this can re-derive the display text on demand.
function refreshTimestamps() {
  for (const id of feedOrder) {
    const entry = msgs[id];
    if (entry && entry.tsEl) entry.tsEl.textContent = formatTs(entry.ts);
  }
}

function getOrCreate(id, role) {
  if (msgs[id]) return msgs[id];

  removeEmpty();
  feedOrder.push(id);

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  if (role === 'agent') {
    // Async subagent reports are raw and often long — collapsed by default,
    // click to expand. Rendered as plain text, not markdown, since the
    // content is XML-ish tool output rather than prose.
    wrap.innerHTML = `<div class="msg-label">${labelFor(role)} <span class="ts"></span></div>
                      <div class="msg-body agent-body">
                        <div class="agent-summary">▸ agent report — click to expand</div>
                        <pre class="agent-raw"></pre>
                      </div>`;
    const bodyEl = wrap.querySelector('.agent-body');
    bodyEl.querySelector('.agent-summary').addEventListener('click', () => {
      bodyEl.classList.toggle('expanded');
    });
    feed.appendChild(wrap);
    msgs[id] = {
      el: bodyEl,
      rawEl: bodyEl.querySelector('.agent-raw'),
      tsEl: wrap.querySelector('.ts'),
      rawText: '', ts: null, role, revealTimer: null, permId: id,
    };
    return msgs[id];
  }

  wrap.innerHTML = `<div class="msg-label">${labelFor(role)} <span class="ts"></span></div>
                    <div class="msg-body${role === 'assistant' ? ' streaming' : ''}"></div>
                    ${role === 'assistant' ? '<button class="msg-copy-btn">copy</button>' : ''}`;
  feed.appendChild(wrap);

  const body = wrap.querySelector('.msg-body');
  msgs[id] = { el: body, tsEl: wrap.querySelector('.ts'), rawText: '', ts: null, role, revealTimer: null, permId: id };

  const copyBtn = wrap.querySelector('.msg-copy-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(msgs[id].rawText || '').then(() => {
        copyBtn.textContent = 'copied!';
        setTimeout(() => copyBtn.textContent = 'copy', 1500);
      });
    });
  }

  return msgs[id];
}

function renderBody(entry) {
  if (entry.role === 'agent') {
    entry.rawEl.textContent = entry.rawText || '';
    return;
  }
  if (entry.role === 'permission') {
    renderPermissionCard(entry);
    return;
  }
  if (entry.role === 'tool') {
    // No math extraction here: tool bubbles are command lines, file paths,
    // and diffs — full of bare `$` (positional/shell params, `$(...)`,
    // regex anchors, etc.) that extractMath()'s blind regex can't tell
    // apart from real LaTeX delimiters. Markdown/code-fence rendering
    // (needed for the Edit/Write diff blocks) still applies, just without
    // the math pass in front of it.
    entry.el.innerHTML = marked.parse(entry.rawText || '');
    return;
  }
  const html = marked.parse(extractMath(entry.rawText || ''));
  entry.el.innerHTML = injectMath(html);
}

// ── Permission / AskUserQuestion cards ──────────────────────────────────────
// entry.rawText is JSON: {kind: 'permission'|'question', toolName, toolInput}.
// entry.resolved/resolvedText are set locally once acted on — there's no
// server-side memory of resolution state, so a stale reconnect could show
// live buttons for an already-resolved request again; clicking them just
// gets a 404 from driver.mjs (handled below), not a crash.
async function resolvePermission(id, payload) {
  try {
    const res = await fetch(`${driverBase}/permission-response`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, ...payload }),
    });
    return res.ok;
  } catch (e) {
    console.error('Failed to resolve permission:', e);
    return false;
  }
}

function renderPermissionCard(entry) {
  let data;
  try {
    data = JSON.parse(entry.rawText || '{}');
  } catch (e) {
    entry.el.textContent = entry.rawText || '';
    return;
  }

  // entry.resolved/resolvedText are the instant, purely-local flag this same
  // tab sets the moment it clicks Allow/Deny/submit (before the round trip
  // to the driver even completes). data.resolved/resolvedText are the
  // durable, server-broadcast version driver.mjs now sends once it actually
  // records the decision — present on reload/reconnect, or in a second tab,
  // where entry.resolved was never set locally at all.
  if (entry.resolved || data.resolved) {
    const text = entry.resolved ? entry.resolvedText : data.resolvedText;
    entry.el.innerHTML = `<div class="perm-resolved">${escapeHtml(text || 'Resolved')}</div>`;
    return;
  }

  const { kind, toolName, toolInput } = data;
  entry.el.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'perm-card';

  if (kind === 'question') {
    const questions = toolInput?.questions || [];
    const answers = {};
    const submitBtn = document.createElement('button');
    submitBtn.className = 'perm-submit-btn';
    submitBtn.textContent = questions.length > 1 ? 'Submit answers' : 'Submit answer';
    submitBtn.disabled = true;

    questions.forEach((q, qi) => {
      const qDiv = document.createElement('div');
      qDiv.className = 'perm-question';
      const qText = document.createElement('div');
      qText.className = 'perm-q-text';
      qText.textContent = q.question || q.header || `Question ${qi + 1}`;
      qDiv.appendChild(qText);

      const optsDiv = document.createElement('div');
      optsDiv.className = 'perm-options';
      (q.options || []).forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'perm-option-btn';
        btn.textContent = opt.label;
        if (opt.description) btn.title = opt.description;
        btn.addEventListener('click', () => {
          answers[qi] = opt.label;
          optsDiv.querySelectorAll('.perm-option-btn').forEach((b) => b.classList.remove('selected'));
          btn.classList.add('selected');
          submitBtn.disabled = Object.keys(answers).length < questions.length;
        });
        optsDiv.appendChild(btn);
      });
      qDiv.appendChild(optsDiv);
      card.appendChild(qDiv);
    });

    submitBtn.addEventListener('click', async () => {
      submitBtn.disabled = true;
      const formatted = questions
        .map((q, qi) => `${q.header || q.question}: ${answers[qi]}`)
        .join('; ');
      const ok = await resolvePermission(entry.permId, { answer: formatted });
      entry.resolved = true;
      entry.resolvedText = ok ? `Answered: ${formatted}` : 'This request already expired.';
      renderPermissionCard(entry);
    });
    card.appendChild(submitBtn);
  } else {
    const qText = document.createElement('div');
    qText.className = 'perm-q-text';
    qText.innerHTML = `Approve <code>${escapeHtml(toolName || 'tool')}</code>?`;
    card.appendChild(qText);

    const actions = document.createElement('div');
    actions.className = 'perm-options';

    const allowBtn = document.createElement('button');
    allowBtn.className = 'perm-option-btn perm-allow';
    allowBtn.textContent = 'Allow';
    allowBtn.addEventListener('click', async () => {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      const ok = await resolvePermission(entry.permId, { allow: true });
      entry.resolved = true;
      entry.resolvedText = ok ? 'Allowed' : 'This request already expired.';
      renderPermissionCard(entry);
    });

    const denyBtn = document.createElement('button');
    denyBtn.className = 'perm-option-btn perm-deny';
    denyBtn.textContent = 'Deny';
    denyBtn.addEventListener('click', async () => {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      const ok = await resolvePermission(entry.permId, { allow: false });
      entry.resolved = true;
      entry.resolvedText = ok ? 'Denied' : 'This request already expired.';
      renderPermissionCard(entry);
    });

    actions.appendChild(allowBtn);
    actions.appendChild(denyBtn);
    card.appendChild(actions);
  }

  entry.el.appendChild(card);
}

// Messages arrive whole, not token-by-token — reveal them word-by-word so
// they still feel live instead of popping in all at once.
// Duration is capped so long responses don't take forever to display.
function revealText(entry, fullText) {
  const words = fullText.split(/(\s+)/).filter(w => w.length > 0);
  const totalWords = words.length || 1;
  const steps = Math.min(totalWords, 40);
  const totalDurationMs = Math.min(900, Math.max(200, totalWords * 12));
  const stepMs = totalDurationMs / steps;
  const wordsPerStep = Math.ceil(totalWords / steps);
  let shown = 0;

  clearInterval(entry.revealTimer);
  entry.el.classList.add('streaming');

  entry.revealTimer = setInterval(() => {
    try {
      shown = Math.min(totalWords, shown + wordsPerStep);
      entry.rawText = words.slice(0, shown).join('');
      renderBody(entry);
      scrollBottom();
    } catch (e) {
      // If rendering ever throws (a markdown/KaTeX edge case), force
      // completion instead of retrying the same failing render forever —
      // otherwise this interval never reaches the cleanup below, and the
      // streaming cursor is left blinking on that bubble permanently.
      console.error('Error during message reveal, forcing completion:', e);
      shown = totalWords;
    } finally {
      if (shown >= totalWords) {
        clearInterval(entry.revealTimer);
        entry.el.classList.remove('streaming');
      }
    }
  }, stepMs);
}

// Autoscroll-lock: only force-scroll on new content if the user was already
// pinned to the bottom. If they've scrolled up to reread something, show a
// pill instead of yanking them back down on every reveal tick.
//
// This has to stay correct under BOTH `scroll-behavior: smooth` (an
// animated, multi-frame scroll, ~300-500ms) and `scroll-behavior: auto`
// (an instant jump) — see the "Auto-scroll animation" setting. The naive
// version of this (recompute pinnedToBottom on every 'scroll' event) only
// works for the instant case. Under 'smooth', a programmatic scroll-to-
// bottom fires 'scroll' events for its intermediate, not-yet-at-bottom
// frames too. If new content arrives mid-animation — e.g. a permission
// bubble landing right after a multi-row tool bubble — one of those
// intermediate frames can get sampled as "the user scrolled away", flipping
// pinnedToBottom to false and abandoning the in-flight scroll short of the
// real bottom. That's the "auto-scroll gets stuck partway" bug, and it also
// explains the pill showing up even when you're basically already at the
// bottom — same false reading.
//
// Fix: ignore 'scroll' events that we caused ourselves (tracked via
// `autoScrolling`), and only trust 'scroll' events that happen outside that
// window as real user intent. This doesn't depend on sampling scroll
// position mid-flight at all, so it's agnostic to which scroll-behavior is
// active — smooth or instant, the logic is identical.
const newPill = document.getElementById('new-pill');
let pinnedToBottom = true;
let autoScrolling = false;
let autoScrollSettleTimer = null;

function isNearBottom() {
  return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
}

feed.addEventListener('scroll', () => {
  if (autoScrolling) return; // our own scroll-to-bottom in flight, not user intent
  pinnedToBottom = isNearBottom();
  if (pinnedToBottom) newPill.classList.remove('show');
});

// Fires once our own auto-scroll has actually settled: via the modern
// 'scrollend' event where supported, and always via a debounced fallback
// timer for browsers that don't support it (e.g. Safari < 17.4) or that
// skip firing it for a no-op scroll. Either way, this is the one place
// that re-derives the real pinned state once we're done driving the scroll
// ourselves — not mid-flight.
function onAutoScrollSettled() {
  autoScrolling = false;
  clearTimeout(autoScrollSettleTimer);
  pinnedToBottom = isNearBottom();
  if (pinnedToBottom) newPill.classList.remove('show');
}
if ('onscrollend' in window) {
  feed.addEventListener('scrollend', onAutoScrollSettled);
}

function performAutoScroll() {
  autoScrolling = true;
  pinnedToBottom = true;
  feed.scrollTop = feed.scrollHeight;
  // Debounced fallback in case 'scrollend' isn't supported or doesn't fire.
  // 500ms comfortably covers a 'smooth' animation's duration. Repeated
  // calls (e.g. per-token stream deltas, or a fast run of reveal ticks)
  // keep pushing this out, which is intended — we only want to settle once
  // new content actually stops arriving, not after the first tick.
  clearTimeout(autoScrollSettleTimer);
  autoScrollSettleTimer = setTimeout(onAutoScrollSettled, 500);
}

newPill.addEventListener('click', () => {
  performAutoScroll();
  newPill.classList.remove('show');
});

function scrollBottom() {
  if (pinnedToBottom) {
    performAutoScroll();
  } else {
    newPill.classList.add('show');
  }
}

// ── Multi-session: which session THIS TAB is currently viewing ─────────────
// Each tab owns this independently — there is no server-side notion of "the"
// current session anymore. Resolution order on first load: an explicit
// ?session= in the URL (always wins — this is what makes a session
// bookmarkable/shareable and what "open in new tab" links to), else the
// last session this browser viewed in any tab (localStorage — shared across
// tabs, but only ever read once at load time, never watched reactively, so
// one tab switching never yanks another tab's already-open view), else
// (truly first-ever launch, nothing to remember yet) a freshly minted id —
// same as what used to happen server-side on every container launch, just
// client-side now since there's no single "the" session to pre-seed.
const LAST_SESSION_KEY = 'lastViewedSessionId';

function resolveInitialSessionId() {
  const fromUrl = new URLSearchParams(location.search).get('session');
  if (fromUrl) return fromUrl;
  const fromStorage = localStorage.getItem(LAST_SESSION_KEY);
  if (fromStorage) return fromStorage;
  return crypto.randomUUID();
}

let currentSessionId = resolveInitialSessionId();
localStorage.setItem(LAST_SESSION_KEY, currentSessionId);
// replaceState, not pushState — this is establishing the initial URL, not
// a new navigation entry — so the address bar is accurate and the page is
// bookmarkable/shareable right from the first load, even if the id came
// from localStorage rather than the URL itself.
{
  const url = new URL(location.href);
  url.searchParams.set('session', currentSessionId);
  history.replaceState({ sessionId: currentSessionId }, '', url);
}

// ── SSE ───────────────────────────────────────────────────────────────────────
let es;
let reconnectTimer;

function connect() {
  es = new EventSource('/events?session=' + encodeURIComponent(currentSessionId));

  es.onopen = () => {
    setStatus('live', 'live');
    clearTimeout(reconnectTimer);
    resyncTurnStatus();
  };

  es.onerror = () => {
    setStatus('error', 'reconnecting…');
    es.close();
    reconnectTimer = setTimeout(connect, 2000);
  };

  // Complete messages, broadcast live by driver.mjs
  es.addEventListener('message', e => {
    const msg = JSON.parse(e.data);
    const { id, role, text, ts } = msg;
    const entry = getOrCreate(id, role);
    entry.ts = ts;
    if (entry.tsEl) entry.tsEl.textContent = formatTs(ts);
    if (role === 'user' || role === 'agent' || role === 'permission') {
      entry.rawText = text;
      entry.el.classList.remove('streaming');
      renderBody(entry);
      scrollBottom();
      // A permission/question badge can appear or clear on this same
      // message (the initial ask, or its resolution rebroadcast) — poke
      // the panel the same way turn_start/turn_end does, rather than
      // leaving it to the next poll tick.
      if (role === 'permission') pokeSessionsListIfOpen();
    } else if (entry.liveStreamed) {
      // Already typed out live via stream_delta — this is just the
      // authoritative final text for the same bubble, not new content to
      // reveal again. Render it instantly instead of re-animating.
      entry.liveStreamed = false;
      entry.rawText = text;
      entry.el.classList.remove('streaming');
      renderBody(entry);
      scrollBottom();
    } else {
      revealText(entry, text);
    }
  });

  // History replay on reconnect
  es.addEventListener('history', e => {
    const entry = JSON.parse(e.data);
    if (entry.type === 'message') {
      const m = getOrCreate(entry.id, entry.role);
      m.ts = entry.ts;
      if (m.tsEl) m.tsEl.textContent = formatTs(entry.ts);
      m.rawText = entry.text;
      m.el.classList.remove('streaming');
      renderBody(m);
      scrollBottom();
    }
  });

  // Ephemeral turn-in-flight signal from driver.mjs (not part of message_log
  // — see server.py's /status handler). Keeps the Send/Stop toggle correct
  // even if this tab reconnects mid-turn or another tab started it.
  es.addEventListener('status', e => {
    const s = JSON.parse(e.data);
    if (s.type === 'turn_start') { setTurnInFlight(true); setTurnIndicator('Thinking…'); pokeSessionsListIfOpen(); }
    if (s.type === 'turn_end') { setTurnInFlight(false); setTurnIndicator(null); pokeSessionsListIfOpen(); }

    // Live thinking-token estimate during the redacted-thinking phase, when
    // no actual thinking text streams yet (see SDKThinkingTokensMessage).
    if (s.type === 'thinking_tokens') setTurnIndicator(`Thinking… (${s.estimated_tokens} tokens)`);

    // Ticking status for long-running tool calls (mirrors the TUI's
    // "esc to interrupt (12s)" line).
    if (s.type === 'tool_progress') setTurnIndicator(`Running \`${s.toolName}\`… (${Math.round(s.elapsedSeconds)}s)`);

    // Real per-token streaming (includePartialMessages): a text/thinking
    // block just started — create its bubble now and mark it as
    // live-streamed so the eventual 'message' event finalizes instead of
    // re-revealing. Real content is here now, so the placeholder line goes
    // away.
    if (s.type === 'stream_start') {
      const entry = getOrCreate(s.id, s.role);
      entry.liveStreamed = true;
      entry.el.classList.add('streaming');
      setTurnIndicator(null);
    }

    if (s.type === 'stream_delta') {
      const entry = getOrCreate(s.id, s.role);
      entry.liveStreamed = true;
      entry.rawText = s.text;
      renderBody(entry);
      scrollBottom();
    }
  });

}

// Switch THIS TAB's view to a different session id — entirely client-side
// now (no /switch-session or /new-session driver endpoint anymore): closes
// the current EventSource, points a new one at /events?session=<id>, and
// lets that connection's own 'history' replay (already scoped correctly by
// server.py) populate the feed. This is also what replaces the old
// driver-pushed 'reset' broadcast — that only made sense when every
// connected tab shared one "current" session to be reset onto; now each tab
// asks for exactly the session it wants and nothing else is affected.
function viewSession(sessionId, { updateUrl = true } = {}) {
  if (sessionId === currentSessionId) return;
  if (!(pendingCwdForNewSession && pendingCwdForNewSession.sessionId === sessionId)) {
    pendingCwdForNewSession = null;
  }
  currentSessionId = sessionId;
  localStorage.setItem(LAST_SESSION_KEY, sessionId);
  if (updateUrl) {
    const url = new URL(location.href);
    url.searchParams.set('session', sessionId);
    history.pushState({ sessionId }, '', url);
  }
  clearFeed();
  setTurnIndicator(null);
  clearTimeout(reconnectTimer);
  if (es) es.close();
  connect();
  if (sessionsPanel.classList.contains('open')) renderSessionsList(); // refresh "current" highlight
}

// Back/forward navigation between sessions (e.g. after following an
// "open in new tab" link and then hitting Back) — reuses the same switch
// logic, just without pushing another history entry (the browser already
// moved us to this URL).
window.addEventListener('popstate', () => {
  const id = new URLSearchParams(location.search).get('session');
  if (id) viewSession(id, { updateUrl: false });
});
