function updateDefaultPromptPlaceholder(backend) {
  DEFAULT_PROMPT_PLACEHOLDER = backend
    ? `Message ${BACKEND_LABELS[backend] || backend}… (Enter to send, Shift+Enter for newline)`
    : 'Message the agent… (Enter to send, Shift+Enter for newline)';
  updatePromptDisabled();
}

function updatePromptDisabled() {
  promptInput.disabled = turnInFlight || !!modelBlockReason;
  if (awaitingInput) {
    // Says what to DO, rather than just refusing. The card is in this feed
    // (or, for a sub-agent, behind the pointer that links to it).
    promptInput.placeholder = awaitingInput === 'question'
      ? 'This turn is waiting on your answer above.'
      : 'This turn is waiting on your approval above.';
    return;
  }
  if (modelBlockReason === 'unavailable') {
    promptInput.placeholder = 'Model unavailable — pick a different model, or wait for it to reconnect.';
  } else if (modelBlockReason === 'unreachable') {
    promptInput.placeholder = 'OpenCode server unreachable — reconnecting…';
  } else {
    promptInput.placeholder = DEFAULT_PROMPT_PLACEHOLDER;
  }
}

function setModelBlockReason(reason) {
  if (modelBlockReason === reason) return;
  modelBlockReason = reason;
  updatePromptDisabled();
}

function setTurnInFlight(inFlight) {
  turnInFlight = inFlight;
  if (!inFlight) awaitingInput = null; // a finished turn cannot still be waiting on you
  updatePromptDisabled();
  sendBtn.classList.toggle('hide-for-stop', inFlight);
  stopBtn.classList.toggle('show', inFlight);
}

// "The model is working" and "the agent is parked on a human" were both just
// turnInFlight, so a session waiting on YOU showed a thinking indicator and
// refused new prompts with a generic message. They are different states with
// different remedies, and only one of them resolves on its own.
let awaitingInput = null; // null | 'permission' | 'question'
function setAwaitingInput(kind, toolName) {
  awaitingInput = kind || null;
  if (awaitingInput) {
    setTurnIndicator(kind === 'question'
      ? 'Waiting for your answer…'
      : `Waiting for your approval${toolName ? ` — \`${toolName}\`` : ''}…`);
  } else if (turnInFlight) {
    setTurnIndicator('Thinking…'); // back to actually working
  } else {
    setTurnIndicator(null);
  }
  updatePromptDisabled();
}

// Defense-in-depth: turn_start/turn_end are ephemeral SSE broadcasts, not
// replayed on reconnect. If one is ever missed (a reconnect landing mid-turn,
// a dropped event), this is what recovers — called on every SSE reconnect,
// asks the driver directly rather than trusting only what's been broadcast.
async function resyncTurnStatus() {
  if (!driverBase) return;
  try {
    const res = await fetch(`${driverBase}/turn-status?sessionId=${encodeURIComponent(currentSessionId)}`);
    const data = await res.json();
    setTurnInFlight(!!data.inFlight);
    // Reconnecting mid-turn (or opening a tab onto a session another tab
    // started) counts as having seen this turn start — otherwise its
    // turn_end would arrive unarmed and pass silently, which is precisely
    // the long-running-turn case the notification exists for.
    if (data.inFlight) armSession(currentSessionId);
    // awaiting_input is an ephemeral status event, so a tab that connects
    // while a turn is already parked would never hear about it otherwise —
    // the same reason autoApprove is resynced from here.
    setAwaitingInput(data.awaitingInput || null);
    // Whether this session is a sub-agent's is the driver's to say — the
    // browser cannot know, and a child must not offer an input bar that the
    // driver will refuse.
    // HD1: true only for a ROSTER child — a native sub-agent. A delegated
    // child also has a parent but is a real session, so it keeps its input
    // bar, controls and Continue strip.
    currentSessionIsChild = !!data.rosterChild;
    delegationAnchor = data.delegationAnchor || null;
    currentSessionParent = data.parentSessionId || null;
    applySubAgentBanner();
    refreshSubAgents();
    autoApproveToggle.checked = !!data.autoApprove;
    autoApproveRow.classList.toggle('active', !!data.autoApprove);
    autoDeliverToggle.checked = !!data.autoDeliver;
    autoDeliverRow.classList.toggle('active', !!data.autoDeliver);
    applyStoppedHint(!!data.stopped, !!data.autoDeliver);
  } catch (e) {
    console.error('Failed to resync turn status:', e);
  }
}

// ── Mode (agent) and model switchers ────────────────────────────────────
// Both mirror the same shape: GET returns null for a backend with no such
// concept at all (Claude Code has no mode/agent concept; a backend not
// exposing listModels() has no model-switcher either) — the <select> stays
// hidden rather than rendering empty. Re-fetched on every session switch/
// reconnect (see es.onopen above) since a different session can be on a
// different backend entirely.
async function loadModes() {
  if (!driverBase || modesResolved) return;
  const seq = ++modesFetchSeq;
  const targetSessionId = currentSessionId;
  // Capture the backend THIS request goes out with — resyncPickersIfNeeded()
  // compares against this, so it must be the exact value baked into the URL
  // below (undefined when sessionBackends didn't know it yet → driver.mjs
  // served its CLI default, which the resolver treats as a mismatch).
  const backendUsed = resolvedBackendForIndicator();
  try {
    const res = await fetch(`${driverBase}/modes?sessionId=${encodeURIComponent(currentSessionId)}` + (backendUsed ? `&backend=${encodeURIComponent(backendUsed)}` : ''));
    const data = await res.json();
    // Drop stale responses: a newer call has started, or the viewed session
    // changed while this was in flight. Never apply a foreign/stale result
    // to the currently-viewed session's picker.
    if (seq !== modesFetchSeq || targetSessionId !== currentSessionId) return;
    if (!data) {
      // Definitive: this backend has no mode/agent concept at all — never
      // going to change mid-session, stop asking.
      modesResolved = true;
      modesResolvedBackend = backendUsed;
      modeSelect.classList.remove('show');
      modeSelect.innerHTML = '';
      resyncPickersIfNeeded();
      return;
    }
    if (!data.available || !data.available.length) {
      // Backend supports modes but doesn't know any yet (e.g. right after a
      // driver.mjs restart, before any turn has populated the shared cache)
      // — leave modesResolved false so the retries keep trying: an immediate
      // bounded auto-retry, and the turn_end retry below for whatever the
      // backend genuinely won't answer until a turn completes.
      modeSelect.classList.remove('show');
      modeSelect.innerHTML = '';
      schedulePickerRetry('modes');
      return;
    }
    modeSelect.innerHTML = data.available.map((m) =>
      `<option value="${escapeHtml(m.id)}">${escapeHtml(m.label)}</option>`).join('');
    modeSelect.value = data.current || data.available[0].id;
    modeSelect.classList.add('show');
    modesResolved = true;
    modesResolvedBackend = backendUsed;
    resyncPickersIfNeeded();
  } catch (e) {
    console.error('Failed to load /modes:', e);
  }
}

modeSelect.addEventListener('change', async () => {
  if (!driverBase) return;
  try {
    await fetch(`${driverBase}/set-mode`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId, mode: modeSelect.value, backend: resolvedBackendForIndicator() }),
    });
  } catch (e) {
    console.error('Failed to set mode:', e);
  }
});

async function loadModels() {
  if (!driverBase || modelsResolved) return;
  const seq = ++modelsFetchSeq;
  const targetSessionId = currentSessionId;
  // Same backend-identity capture as loadModes(): the exact value baked into
  // the URL, so resyncPickersIfNeeded() can tell a CLI-default resolution
  // (no backend yet known) apart from a correctly-targeted one.
  const backendUsed = resolvedBackendForIndicator();
  try {
    const res = await fetch(`${driverBase}/models?sessionId=${encodeURIComponent(currentSessionId)}` + (backendUsed ? `&backend=${encodeURIComponent(backendUsed)}` : ''));
    const data = await res.json();
    // Drop stale responses: a newer call has started, or the viewed session
    // changed while this was in flight. Never apply a foreign/stale result
    // to the currently-viewed session's picker, and never let a stale
    // response flip modelsResolved for the wrong session.
    if (seq !== modelsFetchSeq || targetSessionId !== currentSessionId) return;
    if (!data) {
      // Definitive: no model concept for this backend — never going to
      // change mid-session, stop asking.
      modelsResolved = true;
      modelsResolvedBackend = backendUsed;
      modelSelect.classList.remove('show');
      modelSelect.innerHTML = '';
      setModelBlockReason(null);
      return;
    }
    if (data.ok === false && data.reason === 'server_unreachable') {
      // The whole backend process is down (e.g. OpenCode's serve child
      // between a crash and driver.mjs's backoff-guarded restart) — distinct
      // from "reachable, model cache just not populated yet" below: no
      // models to offer at all, and every session on this backend is
      // equally affected. Keep polling open-endedly rather than resolving
      // permanently — this is expected to self-heal.
      modelSelect.classList.remove('show');
      modelSelect.innerHTML = '';
      setModelBlockReason('unreachable');
      schedulePickerRetry('models');
      return;
    }
    if (data.current && !data.currentConfirmed) {
      // This session's actual model (Item D's derived value, or an explicit
      // state.model override) isn't among the currently-confirmed options —
      // checked before the empty-`available` case below on purpose: this is
      // exactly the case of a resumed session whose model is still waiting
      // on OpenCode's slow litellm-sourced provider discovery, where
      // `available` can easily still be empty. Show it as a disabled
      // synthetic option rather than silently falling back to something
      // else, block sending, and keep polling: either the user picks an
      // already-confirmed model (see the change handler below, which clears
      // this immediately) or the cache catches up and a later retry finds it
      // confirmed.
      const options = (data.available || []).map((m) =>
        `<option value="${escapeHtml(m.id)}" title="${escapeHtml(m.description || '')}">${escapeHtml(m.label)}</option>`).join('');
      modelSelect.innerHTML = `<option value="" disabled selected>⚠ ${escapeHtml(data.current)} (unavailable)</option>` + options;
      modelSelect.classList.add('show');
      setModelBlockReason('unavailable');
      schedulePickerRetry('models');
      return;
    }
    if (!data.available || !data.available.length) {
      // Backend supports models but the shared cache isn't populated yet
      // (see the opencode backend's cold-start /config/providers fetch, and
      // backends/claude-code.mjs's knownModels — process-wide, filled in by
      // the first turn anywhere to complete since the last restart), and
      // this session has no specific model of its own to be blocked on
      // (new session, no history yet). Leave modelsResolved false so the
      // retries keep trying: an immediate open-ended auto-retry, and the
      // turn_end retry below for whatever the backend genuinely won't
      // answer until a turn completes.
      modelSelect.classList.remove('show');
      modelSelect.innerHTML = '';
      setModelBlockReason(null);
      schedulePickerRetry('models');
      return;
    }
    modelSelect.innerHTML = data.available.map((m) =>
      `<option value="${escapeHtml(m.id)}" title="${escapeHtml(m.description || '')}">${escapeHtml(m.label)}</option>`).join('');
    modelSelect.value = data.current || data.available[0].id;
    modelSelect.classList.add('show');
    modelsResolved = true;
    modelsResolvedBackend = backendUsed;
    setModelBlockReason(null);
  } catch (e) {
    console.error('Failed to load /models:', e);
  }
}

modelSelect.addEventListener('change', async () => {
  if (!driverBase) return;
  // An explicit pick always overrides the derived value (see driver.mjs's
  // /models route), so it's confirmed by construction — unblock immediately
  // rather than waiting for the next loadModels() round-trip to notice.
  // (The disabled "⚠ ... (unavailable)" placeholder option has value="", so
  // this can only fire for a real, already-confirmed selection.)
  if (modelSelect.value) setModelBlockReason(null);
  try {
    await fetch(`${driverBase}/set-model`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId, model: modelSelect.value, backend: resolvedBackendForIndicator() }),
    });
  } catch (e) {
    console.error('Failed to set model:', e);
  }
});

// ── Auto-approve toggle ──────────────────────────────────────────────────
// Enabling requires confirmation (mirrors the delete-session confirm()
// pattern) since it bypasses every tool-permission prompt for this session
// until turned back off; disabling (restoring the safe default) needs none.
// AskUserQuestion-style questions are unaffected either way — see
// backends/claude-code.mjs's makeCanUseTool and backends/opencode.mjs's
// onPermission, both of which special-case that regardless of this flag.
autoApproveToggle.addEventListener('change', async () => {
  if (!driverBase) { autoApproveToggle.checked = false; return; }
  const enabling = autoApproveToggle.checked;
  if (enabling && !confirm(
    'Auto-approve all tool permission requests for this session?\n\n' +
    'This bypasses manual review for every tool call until you turn it back off.'
  )) {
    autoApproveToggle.checked = false;
    return;
  }
  try {
    const res = await fetch(`${driverBase}/auto-approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId, enabled: enabling }),
    });
    // fetch() only rejects on network failure, never on HTTP status, so
    // without this an error response reads as success: the box would stay
    // checked (and amber) while the driver had no record of the flag, and
    // every tool call would still prompt. This control disables permission
    // review — it has to fail visibly, in the safe direction.
    if (!res.ok) throw new Error(`driver returned ${res.status}`);
    autoApproveRow.classList.toggle('active', enabling);
  } catch (e) {
    console.error('Failed to set auto-approve:', e);
    autoApproveToggle.checked = !enabling;
    autoApproveRow.classList.toggle('active', !enabling);
  }
});

// MD9. No confirm() unlike auto-approve: this grants no privilege and
// nothing irreversible happens — the worst case is a message arriving sooner
// than you wanted, and the autonomy cap still governs how much work follows.
// Sends an explicit true/false rather than clearing back to the derived
// default, because an unticked box on a delegated session has to MEAN "off"
// and survive as such; `null` (clear the pin) is reachable only by the
// driver, which is the right asymmetry for a control with two visible states.
// After a Stop, say what Stop actually did.
//
// Stop halts the turn; it does NOT prevent incoming mail from starting a new
// one. That is correct for "park this until something relevant arrives" and
// wrong for "stay down", and the two are indistinguishable from the button.
// The control that separates them is the Auto-deliver box this hint sits in
// — so the hint names the consequence and points at its own checkbox rather
// than adding a second control that would mean the same thing.
function applyStoppedHint(stopped, autoDeliver) {
  const el = document.getElementById('auto-deliver-stopped');
  if (!el) return;
  if (!stopped) { el.textContent = ''; el.removeAttribute('title'); return; }
  el.textContent = autoDeliver ? ' · stopped — mail will wake this' : ' · stopped — mail held';
  el.title = autoDeliver
    ? 'You stopped this session. Incoming mail will still start a new turn; the agent is told it was stopped so it re-assesses rather than resuming. Uncheck Auto-deliver to hold mail instead.'
    : 'You stopped this session, and mail is held rather than waking it. Check Auto-deliver, or deliver the mail yourself, to let it run again.';
}

autoDeliverToggle.addEventListener('change', async () => {
  if (!driverBase || !currentSessionId) { autoDeliverToggle.checked = false; return; }
  const enabling = autoDeliverToggle.checked;
  try {
    const res = await fetch(`${driverBase}/auto-deliver`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId, enabled: enabling }),
    });
    if (!res.ok) throw new Error(`driver returned ${res.status}`);
    const d = await res.json().catch(() => ({}));
    // Trust the driver's effective value over the click: it resolves the
    // tri-state, so this is also what corrects the box if the two disagree.
    autoDeliverToggle.checked = !!d.autoDeliver;
    autoDeliverRow.classList.toggle('active', !!d.autoDeliver);
    // Enabling releases whatever was being held, so the left half of the
    // strip has to re-render rather than keep showing stale mail.
    refreshMail();
  } catch (e) {
    console.error('Failed to set auto-deliver:', e);
    autoDeliverToggle.checked = !enabling;
    autoDeliverRow.classList.toggle('active', !enabling);
  }
});

// Shared by the main prompt box and any AskUserQuestion "Other" free-text
// textarea (see renderPermissionCard) — same auto-grow-then-cap behavior,
// same 200px ceiling, so verbose "Other" answers get the same breathing
// room as the main prompt rather than being stuck in a cramped single line.
function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}
function autoResizeInput() { autoResizeTextarea(promptInput); }

// Renders a message locally only — not sent to server.py/message_log, not
// synced to other tabs. For client-side observations (submission failures)
// that don't need to persist or replay on reconnect, just be visible now.
function showLocalNotice(text) {
  const id = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const entry = getOrCreate(id, 'tool');
  entry.ts = new Date().toISOString();
  if (entry.tsEl) entry.tsEl.textContent = formatTs(entry.ts);
  entry.rawText = text;
  renderBody(entry);
  scrollBottom();
}

async function submitPrompt() {
  const text = promptInput.value.trim();
  if (!text || turnInFlight || !driverBase) return;
  promptInput.value = '';
  autoResizeInput();
  dismissPalette();
  setTurnInFlight(true);
  // Only meaningful for a brand-new session's very first prompt (see the
  // new-chat project picker) — consumed here regardless of outcome, so a
  // retry after a failed attempt just falls back to the session's default
  // cwd rather than resending a value that may have been the problem.
  const cwdForThisPrompt = pendingCwdForNewSession && pendingCwdForNewSession.sessionId === currentSessionId
    ? pendingCwdForNewSession.cwd
    : undefined;
  pendingCwdForNewSession = null;
  const backendForThisPrompt = pendingBackendForNewSession && pendingBackendForNewSession.sessionId === currentSessionId
    ? pendingBackendForNewSession.backend
    : backendForCurrentSession();
  pendingBackendForNewSession = null;
  try {
    const body = { sessionId: currentSessionId, text };
    if (cwdForThisPrompt) body.cwd = cwdForThisPrompt;
    if (backendForThisPrompt) body.backend = backendForThisPrompt;
    const res = await fetch(`${driverBase}/prompt`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      setTurnInFlight(false);
      const errText = await res.text();
      console.error('Prompt submission failed:', errText);
      showLocalNotice(`*(message not sent: ${errText})*`);
    }
    // On success, setTurnInFlight(false) happens via the 'status' SSE event
    // (turn_end) once the driver's runTurn() actually finishes — not here,
    // since the real work happens asynchronously after this 202 response.
  } catch (e) {
    setTurnInFlight(false);
    console.error('Prompt submission failed:', e);
    showLocalNotice(`*(message not sent: ${e.message})*`);
  }
}

promptInput.addEventListener('input', autoResizeInput);
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitPrompt();
  }
});
sendBtn.addEventListener('click', submitPrompt);

stopBtn.addEventListener('click', async () => {
  if (!driverBase) return;
  try {
    await fetch(`${driverBase}/abort`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId }),
    });
  } catch (e) {
    console.error('Abort failed:', e);
  }
});

// ── Command palette ─────────────────────────────────────────────────────────
function dismissPalette() {
  paletteDropdown.classList.remove('show');
  paletteDropdown.innerHTML = '';
}

async function openPalette() {
  if (!driverBase) return;
  if (paletteDropdown.classList.contains('show')) {
    dismissPalette();
    return;
  }
  paletteDropdown.innerHTML = '<div class="palette-empty">Loading…</div>';
  paletteDropdown.classList.add('show');
  try {
    // Session-scoped now, same as /modes & /models — an opencode session's
    // palette must show opencode's own commands, not whichever backend
    // used to be "the default" (this was previously fetched with no session
    // context at all, so it silently showed the wrong backend's commands
    // for any session on the non-default backend).
    const backendUsed = resolvedBackendForIndicator();
    const res = await fetch(`${driverBase}/commands?sessionId=${encodeURIComponent(currentSessionId)}`
      + (backendUsed ? `&backend=${encodeURIComponent(backendUsed)}` : ''));
    const cmds = await res.json();
    const visible = (cmds.slash_commands || [])
      .filter((name) => !(cmds.terminal_slash_commands || []).includes(name))
      .sort();
    if (visible.length === 0) {
      paletteDropdown.innerHTML = '<div class="palette-empty">No commands yet — send one message first (the list populates from that session\'s init).</div>';
      return;
    }
    paletteDropdown.innerHTML = '';
    for (const name of visible) {
      const item = document.createElement('div');
      item.className = 'palette-item';
      item.textContent = `/${name}`;
      item.addEventListener('click', () => {
        promptInput.value = `/${name} `;
        autoResizeInput();
        dismissPalette();
        promptInput.focus();
      });
      paletteDropdown.appendChild(item);
    }
  } catch (e) {
    paletteDropdown.innerHTML = '<div class="palette-empty">Failed to load commands.</div>';
    console.error('Failed to load /commands:', e);
  }
}

paletteBtn.addEventListener('click', openPalette);
document.addEventListener('click', (e) => {
  if (paletteDropdown.classList.contains('show') &&
      !paletteDropdown.contains(e.target) && e.target !== paletteBtn) {
    dismissPalette();
  }
});

// ── Session picker ───────────────────────────────────────────────────────────
const sessionsBtn    = document.getElementById('sessions-btn');
const sessionsPanel  = document.getElementById('sessions-panel');
const sessionsList   = document.getElementById('sessions-list');
const newChatBtn     = document.getElementById('new-chat-btn');
const sessionsTabs   = document.querySelectorAll('.sessions-tab');

let sessionsView = 'active'; // 'active' | 'archived'
let lastSessionsResult = null; // cached {sessions} from the last fetch

// Wipes the visible feed and its associated state entirely — used by
// viewSession() when this tab switches to a different session (or a fresh
// one). Any in-flight reveal animations get stopped first so a stale
// setInterval doesn't keep firing against a detached DOM node.
function clearFeed() {
  for (const m of Object.values(msgs)) {
    if (m.revealTimer) clearInterval(m.revealTimer);
    if (m.renderRaf) cancelAnimationFrame(m.renderRaf);
  }
  for (const k of Object.keys(msgs)) delete msgs[k];
  feedOrder.length = 0;
  feed.innerHTML = '';
  feed.appendChild(empty);
}

function formatSessionWhen(lastModified) {
  try {
    return new Date(lastModified).toLocaleString([], {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
    });
  } catch (e) {
    return '';
  }
}

function startRenameEdit(titleEl, session) {
  const current = session.customTitle || session.summary || session.firstPrompt || '';
  const input = document.createElement('input');
  input.className = 'session-title-input';
  input.value = current;
  titleEl.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const newTitle = input.value.trim();
    if (save && newTitle && newTitle !== current && driverBase) {
      try {
        await fetch(`${driverBase}/rename-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: session.sessionId, title: newTitle, backend: sessionBackends.get(session.sessionId) }),
        });
      } catch (e) {
        console.error('Failed to rename session:', e);
      }
    }
    await refreshSessionsList();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

// Builds one session row — shared by both the flat and grouped layouts
// (only the surrounding structure differs between them).
function buildSessionItem(s, wantArchived, tree = {}) {
  // "Current" is purely this tab's own local choice now — there's no
  // server-reported notion of it anymore, so a second tab viewing a
  // different session correctly shows its OWN current session highlighted
  // here, not this tab's.
  const isCurrent = s.sessionId === currentSessionId;
  const item = document.createElement('div');
  item.className = 'session-item' + (isCurrent ? ' current' : '');
  const depth = tree.depth || 0;
  if (depth) {
    item.classList.add('session-child');
    item.style.paddingLeft = `${8 + depth * 14}px`;
  }
  const title = s.customTitle || s.summary || s.firstPrompt || '(untitled)';

  const titleEl = document.createElement('div');
  titleEl.className = 'session-title';

  // The disclosure triangle is its OWN click target, with stopPropagation,
  // exactly like the open-in-new-tab anchor below. Expanding a family must
  // never be one mis-aimed pixel away from opening the parent session.
  if (tree.familyCount) {
    const tw = document.createElement('span');
    tw.className = 'session-twisty';
    tw.textContent = tree.collapsed ? '\u25B8' : '\u25BE';
    tw.title = tree.collapsed
      ? `Show ${tree.familyCount} delegated session${tree.familyCount === 1 ? '' : 's'}`
      : 'Hide delegated sessions';
    tw.addEventListener('click', (e) => { e.stopPropagation(); toggleFamily(s.sessionId); });
    titleEl.appendChild(tw);
  } else if (depth) {
    const sp = document.createElement('span');
    sp.className = 'session-twisty placeholder';
    titleEl.appendChild(sp);
  }

  const titleTextEl = document.createElement('span');
  titleTextEl.className = 'session-title-text';
  titleTextEl.textContent = title;

  // Built once, then placed on whichever side of the (separately
  // truncatable) title text the badgePosition setting asks for — see the
  // .session-title-text CSS comment for why the badge needs to be a
  // sibling of the truncated text rather than trailing content inside it.
  let badge = null;
  if (s.pendingKind === 'question') {
    badge = document.createElement('span');
    badge.className = 'session-badge needs-question';
    badge.title = 'Waiting on an answer';
  } else if (s.pendingKind === 'permission') {
    badge = document.createElement('span');
    badge.className = 'session-badge needs-permission';
    badge.title = 'Waiting on a permission decision';
  } else if (s.inFlight) {
    badge = document.createElement('span');
    badge.className = 'session-badge';
    badge.title = 'A turn is running';
  }
  // HD5's aggregate. Only on a COLLAPSED parent — once expanded, each child
  // shows its own badge and a summary on the parent would double-count. The
  // count is rendered only when the state comes from descendants rather than
  // this row, so "●2" always reads "two sessions under here want something"
  // and never "this row, plus one".
  let aggBadge = null;
  const agg = tree.aggregate;
  if (tree.collapsed && agg && agg.severity > 0 && agg.severity >= rowSeverity(s)) {
    aggBadge = document.createElement('span');
    aggBadge.className = 'session-badge session-agg'
      + (agg.severity === 3 ? ' needs-question' : '');
    if (agg.count > 1) aggBadge.textContent = String(agg.count);
    aggBadge.title = agg.severity === 3
      ? `${agg.count} delegated session${agg.count === 1 ? '' : 's'} waiting on you`
      : `${agg.count} delegated session${agg.count === 1 ? '' : 's'} running`;
  }
  if (badge && settings.badgePosition === 'before') titleEl.appendChild(badge);
  titleEl.appendChild(titleTextEl);
  if (badge && settings.badgePosition !== 'before') titleEl.appendChild(badge);
  if (aggBadge) titleEl.appendChild(aggBadge);
  titleEl.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    startRenameEdit(titleEl, s);
  });

  const metaEl = document.createElement('div');
  metaEl.className = 'session-meta';
  // The project tag is redundant once already grouped by project, so it
  // only needs to appear in the flat layout, where sessions from different
  // projects can sit right next to each other.
  const metaParts = [formatSessionWhen(s.lastModified)];
  // Suppressed on a child for the same reason the grouped layout suppresses
  // it: HD1's cwd inheritance means a delegated child is ALWAYS in its
  // parent's project, so repeating it on every nested row is noise.
  if (settings.sessionsLayout !== 'grouped' && s.projectLabel && !depth) metaParts.push(s.projectLabel);
  // Soft heads-up, not a block (this session is still perfectly reachable
  // and resumable) — driver.mjs only ever sets this when it actually knows
  // both the current and last-recorded host paths and they disagree, which
  // can mean either "you relocated this same checkout" (harmless, ignore)
  // or "this session actually belongs to an unrelated project that happened
  // to record the same in-container path" (see driver.mjs's own comment
  // above SESSION_HOSTS_FILE for the full explanation).
  if (s.hostMismatch) metaParts.push('⚠ different host path');
  metaEl.textContent = metaParts.filter(Boolean).join(' · ');
  if (s.hostMismatch) {
    metaEl.title = `Last used from ${s.lastKnownHostPath}, not the host path this container is currently running from. If you relocated this same project, ignore this — otherwise it may be a session from an unrelated project.`;
  }

  const actions = document.createElement('div');
  actions.className = 'session-actions';

  // Deliberate open-in-new-tab affordance: a real <a href="?session=...">
  // rather than making the whole row a link — see the CSS comment on
  // .session-open-tab for why.
  const openTabLink = document.createElement('a');
  openTabLink.className = 'session-open-tab';
  openTabLink.href = `?session=${encodeURIComponent(s.sessionId)}`;
  openTabLink.target = '_blank';
  openTabLink.rel = 'noopener';
  openTabLink.title = 'Open in new tab';
  openTabLink.textContent = '⧉';
  openTabLink.addEventListener('click', (e) => e.stopPropagation());
  actions.appendChild(openTabLink);

  if (wantArchived) {
    const unarchiveBtn = document.createElement('button');
    unarchiveBtn.className = 'session-action-btn';
    unarchiveBtn.textContent = 'Unarchive';
    unarchiveBtn.addEventListener('click', (e) => { e.stopPropagation(); unarchiveSession(s.sessionId); });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'session-action-btn session-delete-btn';
    deleteBtn.textContent = 'Delete';
    deleteBtn.disabled = isCurrent;
    deleteBtn.title = isCurrent ? 'Switch away from this session first' : '';
    deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteSessionFromUi(s.sessionId, title); });

    actions.appendChild(unarchiveBtn);
    actions.appendChild(deleteBtn);
  } else {
    // HD6: Detach lives HERE, beside Archive and Delete — the durable
    // operations on a durable relationship — rather than in the roster,
    // where Keep lives. The row visibly un-indents, which is exactly what
    // the word promises. Only ever offered on a nested row, because a root
    // session has nothing to detach from.
    if (depth) {
      const detachBtn = document.createElement('button');
      detachBtn.className = 'session-action-btn';
      detachBtn.textContent = 'Detach';
      detachBtn.title = 'Make this a session of its own, no longer nested under its parent';
      detachBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
          const res = await fetch(`${driverBase}/detach-session`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: s.sessionId }),
          });
          if (!res.ok) {
            const b = await res.json().catch(() => ({}));
            alert(b.error || 'Could not detach that session.');
          }
        } catch { /* a failed detach must not take the panel down */ }
        refreshSessionsList({ full: true });
      });
      actions.appendChild(detachBtn);
    }
    const archiveBtn = document.createElement('button');
    archiveBtn.className = 'session-action-btn';
    archiveBtn.textContent = 'Archive';
    archiveBtn.addEventListener('click', (e) => { e.stopPropagation(); archiveSession(s.sessionId); });
    actions.appendChild(archiveBtn);
  }

  item.appendChild(titleEl);
  item.appendChild(metaEl);
  item.appendChild(actions);
  item.addEventListener('click', () => viewSession(s.sessionId));
  return item;
}

// Unreachable sessions (project directory no longer resolves) get a much
// simpler row — nothing here is actionable, there's no cwd to resume into,
// so no click handler, no rename, no archive/delete.
function buildUnreachableItem(s) {
  const item = document.createElement('div');
  item.className = 'session-item session-unreachable';

  const titleEl = document.createElement('div');
  titleEl.className = 'session-title';
  const titleTextEl = document.createElement('span');
  titleTextEl.className = 'session-title-text';
  titleTextEl.textContent = s.firstPrompt || '(untitled)';
  titleEl.appendChild(titleTextEl);

  const metaEl = document.createElement('div');
  metaEl.className = 'session-meta';
  const parts = [formatSessionWhen(s.lastModified), s.projectLabel];
  if (s.lastKnownHostPath) parts.push(`last at ${s.lastKnownHostPath}`);
  metaEl.textContent = parts.filter(Boolean).join(' · ');
  if (s.lastKnownHostPath) {
    metaEl.title = `Relaunch the script from ${s.lastKnownHostPath} (or wherever it's since moved to) to reach this session again.`;
  }

  item.appendChild(titleEl);
  item.appendChild(metaEl);
  return item;
}

function renderUnreachableFooter(data) {
  if (settings.unreachableMode === 'hidden') return;

  if (settings.unreachableMode === 'count') {
    if (!data.unreachableCount) return;
    const note = document.createElement('div');
    note.className = 'unreachable-note';
    const plural = data.unreachableCount === 1 ? '' : 's';
    note.textContent = `${data.unreachableCount} session${plural} unreachable — the project ${plural ? 'directories' : 'directory'} ${plural ? "aren't" : "isn't"} currently reachable from this workspace.`;
    sessionsList.appendChild(note);
    return;
  }

  // 'shown' — itemized, but only if the fetch actually asked for it
  // (see refreshSessionsList) — falls back to the count if not.
  const list = data.unreachableSessions;
  if (!list) {
    renderUnreachableFooterAsCount(data);
    return;
  }
  if (list.length === 0) return;
  const header = document.createElement('div');
  header.className = 'session-group-header';
  header.textContent = `Unreachable (${list.length})`;
  sessionsList.appendChild(header);
  for (const s of list) {
    sessionsList.appendChild(buildUnreachableItem(s));
  }
}

// Fallback for the 'shown' setting when unreachableSessions wasn't fetched
// yet (e.g. the setting just changed and refreshSessionsList hasn't
// round-tripped again) — degrade to the cheap count rather than show
// nothing at all.
function renderUnreachableFooterAsCount(data) {
  if (!data.unreachableCount) return;
  const note = document.createElement('div');
  note.className = 'unreachable-note';
  note.textContent = `${data.unreachableCount} session(s) unreachable.`;
  sessionsList.appendChild(note);
}


// ── HD5: families in the session list ───────────────────────────────────
// Families nest INSIDE the existing Flat / Grouped-by-project layouts rather
// than adding a third mode, because a delegated child inherits its parent's
// cwd (toolDelegate never passes one), so a family can never span projects.
//
// Collapse state is persisted per parent. A new child arriving under a
// collapsed parent bumps the aggregate badge; it never forces the family
// open. That is deliberate — rows that appear and disappear on their own
// make the list a moving target, and you go to click one session and hit
// another. The aggregate badge solves the same visibility problem without
// anything moving.
const COLLAPSED_KEY = 'podprompt.collapsedFamilies';
let collapsedFamilies = new Set();
try { collapsedFamilies = new Set(JSON.parse(localStorage.getItem(COLLAPSED_KEY) || '[]')); } catch {}
function saveCollapsed() {
  try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify([...collapsedFamilies])); } catch {}
}
// Collapsed by DEFAULT: a parent not yet recorded either way is collapsed.
function isFamilyCollapsed(id) { return !collapsedFamilies.has(`open:${id}`); }
function toggleFamily(id) {
  const k = `open:${id}`;
  if (collapsedFamilies.has(k)) collapsedFamilies.delete(k); else collapsedFamilies.add(k);
  saveCollapsed();
  renderSessionsList();
}

// MAX_CREATION_DEPTH is 6, and six indents walk the title off the right edge
// of a narrow panel, so deeper descendants share the deepest indent.
const MAX_INDENT_LEVELS = 3;

// Severity order, matching the badge classes the rows already use:
// question/permission outrank in-flight, which outranks idle.
function rowSeverity(s) {
  if (s.pendingKind === 'question') return 3;
  if (s.pendingKind === 'permission') return 3;
  if (s.inFlight) return 2;
  return 0;
}

// Parent id -> children, built once per render from parentSessionId, which
// the driver stamps on every listed row (Phase 17).
function buildFamilyIndex(sessions) {
  const byParent = new Map();
  const present = new Set(sessions.map((x) => x.sessionId));
  for (const s of sessions) {
    // A child whose parent is filtered out of this view (archived vs not)
    // is shown at top level rather than hidden — losing a row entirely is
    // far worse than showing it unnested.
    const pid = s.parentSessionId && present.has(s.parentSessionId) ? s.parentSessionId : null;
    if (!pid) continue;
    if (!byParent.has(pid)) byParent.set(pid, []);
    byParent.get(pid).push(s);
  }
  return byParent;
}

function subtreeOf(s, byParent, out = []) {
  for (const kid of byParent.get(s.sessionId) || []) { out.push(kid); subtreeOf(kid, byParent, out); }
  return out;
}

// The aggregate the collapsed parent row carries: the highest severity
// anywhere in its subtree, and how many descendants are at that level. The
// count appears only when it comes from DESCENDANTS, so "●2" always reads
// "two sessions under here want something".
function familyAggregate(s, byParent) {
  const kids = subtreeOf(s, byParent);
  let best = 0, count = 0;
  for (const k of kids) {
    const sev = rowSeverity(k);
    if (sev > best) { best = sev; count = 1; }
    else if (sev === best && sev > 0) count++;
  }
  return { severity: best, count, descendants: kids.length };
}

// Family recency: a parent sorts by the most recent activity ANYWHERE in its
// subtree. Without this a parent untouched for a week sinks while its child
// runs hard, and the active work becomes the hardest thing in the list to
// find. Mirrors the Math.max() the project grouping already uses.
function familyRecency(s, byParent, sortKey) {
  return Math.max(s[sortKey] || 0, ...subtreeOf(s, byParent).map((k) => k[sortKey] || 0));
}

// Emits a row and, unless collapsed, its descendants — depth-first, so a
// child always renders directly beneath its parent.
function emitFamily(s, byParent, wantArchived, depth, sortKey, into) {
  const kids = (byParent.get(s.sessionId) || [])
    .slice().sort((a, b) => familyRecency(b, byParent, sortKey) - familyRecency(a, byParent, sortKey));
  const agg = familyAggregate(s, byParent);
  into.appendChild(buildSessionItem(s, wantArchived, {
    depth, familyCount: kids.length, aggregate: agg,
    collapsed: kids.length ? isFamilyCollapsed(s.sessionId) : false,
  }));
  if (!kids.length || isFamilyCollapsed(s.sessionId)) return;
  for (const kid of kids) {
    emitFamily(kid, byParent, wantArchived, Math.min(depth + 1, MAX_INDENT_LEVELS), sortKey, into);
  }
}

function renderSessionsList() {
  const data = lastSessionsResult;
  if (!data) return;
  const wantArchived = sessionsView === 'archived';
  const sessions = (data.sessions || []).filter((s) => (s.tag === 'archived') === wantArchived);

  // This rebuilds the whole list from scratch every time, including on
  // each periodic poll tick (see startSessionsPoll) — without this, sitting
  // on a long scrolled-down list while the panel polls in the background
  // would silently yank you back to the top every 4 seconds.
  const scrollTop = sessionsList.scrollTop;
  sessionsList.innerHTML = '';

  if (sessions.length === 0) {
    sessionsList.innerHTML = `<div class="palette-empty">${wantArchived ? 'No archived sessions.' : 'No sessions yet.'}</div>`;
  } else {
    // Sort sessions by selected key (created or lastModified)
    const sortKey = settings.sessionsSort === 'lastModified' ? 'lastModified' : 'createdAt';
    const sessionsSorted = [...sessions].sort((a, b) =>
      ((b[sortKey] || 0) - (a[sortKey] || 0)));
    if (settings.sessionsLayout === 'grouped') {
      const groups = new Map(); // projectLabel -> sessions[]
      for (const s of sessionsSorted) {
        const label = s.projectLabel || '(root)';
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(s);
      }
      // Each group ordered internally by selected key; groups themselves ordered
      // by their own most recent session (selected key), so the busiest-lately
      // project floats to the top.
      const sortedGroups = [...groups.entries()].sort((a, b) =>
        Math.max(...b[1].map((s) => s[sortKey] || 0)) - Math.max(...a[1].map((s) => s[sortKey] || 0)));
      for (const [label, groupSessions] of sortedGroups) {
        const header = document.createElement('div');
        header.className = 'session-group-header';
        header.textContent = `${label} (${groupSessions.length})`;
        sessionsList.appendChild(header);
        // Families nest inside the project group. Because a family never
        // spans projects, every member is in this group already.
        const byParent = buildFamilyIndex(groupSessions);
        const roots = groupSessions.filter((x) => !byParent.has(x.sessionId) || !x.parentSessionId
          || !groupSessions.some((y) => y.sessionId === x.parentSessionId));
        roots.sort((a, b) => familyRecency(b, byParent, sortKey) - familyRecency(a, byParent, sortKey));
        for (const r of roots) emitFamily(r, byParent, wantArchived, 0, sortKey, sessionsList);
      }
    } else {
      const byParent = buildFamilyIndex(sessionsSorted);
      const roots = sessionsSorted.filter((x) => !x.parentSessionId
        || !sessionsSorted.some((y) => y.sessionId === x.parentSessionId));
      roots.sort((a, b) => familyRecency(b, byParent, sortKey) - familyRecency(a, byParent, sortKey));
      for (const r of roots) emitFamily(r, byParent, wantArchived, 0, sortKey, sessionsList);
    }
  }

  if (!wantArchived) renderUnreachableFooter(data);
  sessionsList.scrollTop = scrollTop;
}

// `full: false` is the periodic poll tick (see startSessionsPoll) — it
// skips ?includeUnreachable=1 even under the 'shown' setting, since
// itemized unreachable detail needs the driver to read raw transcript
// files directly and doesn't change moment to moment the way turn/
// permission status does; the last full fetch's copy is reused instead of
// re-deriving it on every tick.
// Both the poll timer and pokeSessionsListIfOpen() call this independently
// now, so overlapping requests are routine, not a rare edge case — and
// fetch() gives no ordering guarantee: a slower, earlier-issued request
// (e.g. a poll tick that started just before a turn began) can resolve
// *after* a faster, later one (a poke firing right on turn_start), and
// without this guard its stale response would silently overwrite the
// fresher one merely by arriving last. A monotonic sequence number, with
// only the response matching the most-recently-issued request applied,
// fixes that regardless of resolution order. This would disproportionately
// hit a session whose state is actively toggling (the one you're mid-
// conversation with) while never visibly affecting a frozen one — which
// fits "the current session's badge doesn't show, but a stuck idle one
// does" exactly.
let sessionsFetchSeq = 0;
async function refreshSessionsList({ full = true } = {}) {
  if (!driverBase) return;
  const seq = ++sessionsFetchSeq;
  try {
    const qs = (full && settings.unreachableMode === 'shown') ? '?includeUnreachable=1' : '';
    const res = await fetch(`${driverBase}/sessions${qs}`);
    const data = await res.json();
    if (seq !== sessionsFetchSeq) return; // a newer request has since been issued — this one's stale, drop it
    if (!full && lastSessionsResult?.unreachableSessions) {
      data.unreachableSessions = lastSessionsResult.unreachableSessions;
    }
    lastSessionsResult = data;
    sessionBackends.clear();
    for (const s of data.sessions || []) {
      if (s.backend) sessionBackends.set(s.sessionId, s.backend);
    }
    // The currently-viewed session may have just learned its real backend
    // for the first time (e.g. cold page load — see the boot-sequence
    // comment above window.addEventListener('load', ...)), or this refresh
    // may be the thing that first gives backendForCurrentSession() any
    // answer at all. Either way, keep the header dot/badge/placeholder in
    // sync rather than waiting for the next viewSession() switch — and, in
    // the same late-learning situation, re-resolve the model/mode pickers if
    // they latched themselves to the wrong (CLI-default or unknown) backend
    // before /sessions could stamp this session's real one.
    updateBackendIndicator();
    resyncPickersIfNeeded();
    renderSessionsList();
  } catch (e) {
    if (seq !== sessionsFetchSeq) return;
    sessionsList.innerHTML = '<div class="palette-empty">Failed to load sessions.</div>';
    console.error('Failed to load /sessions:', e);
  }
}

// Lets the currently-viewed session's own already-instant SSE signals
// (turn_start/turn_end, a permission or question appearing or resolving)
// also refresh the sessions panel right away, instead of waiting for the
// next poll tick — called from the 'status' and 'message' handlers in
// connect(). This is the case a poll interval alone can't make feel
// instant, since this tab already knows about it the moment it happens; a
// *different* session's turn ending is still bounded by the poll interval
// below, since this tab has no live signal for that at all (each SSE
// stream is scoped to one session by design).
function pokeSessionsListIfOpen() {
  if (sessionsPanel.classList.contains('open')) {
    refreshSessionsList({ full: false });
  }
}

// pokeSessionsListIfOpen() only covers the session THIS tab already has a
// live SSE connection to (whatever it's currently viewing) — a *different*
// session's turn starting/ending has no signal to piggyback on at all,
// since each /events stream is scoped to one session by design. This
// separate, global /events-meta channel (server.py's meta_clients, not
// nested under any one session) fills that gap: a tab subscribes to it and
// gets a lightweight ping whenever *any* session's turn or
// permission/question state changes, regardless of whether this tab is
// looking at that session at all.
//
// Two independent subscribers now: the sessions panel (refresh the list
// while it's open) and desktop notifications (announce any session's turn
// ending, panel open or not). Either one alone is reason enough to hold the
// connection open, which is why the lifecycle runs through
// metaSubscriptionWanted() rather than testing the panel directly.
let metaEventSource = null;
let metaRetryTimer = null;
function metaSubscriptionWanted() {
  // Now unconditional. Three subscribers depend on it — the sessions panel
  // while open, desktop notifications when enabled, and the global
  // pending-approval indicator, which has to be right whether or not either
  // of the other two is active. The cost is one held connection (and one
  // server.py thread) per tab for the page's lifetime, which is the same
  // tradeoff the per-session /events connections already make.
  return true;
}
function startMetaSubscription() {
  stopMetaSubscription();
  metaEventSource = new EventSource('/events-meta');
  // EventSource reconnects on its own for transient drops, but gives up for
  // good on a protocol-level rejection. Only that terminal case is handled
  // here, on the same 2s cadence as the per-session stream's onerror.
  metaEventSource.onerror = () => {
    if (metaEventSource && metaEventSource.readyState === EventSource.CLOSED) {
      stopMetaSubscription();
      metaRetryTimer = setTimeout(updateMetaSubscription, 2000);
    }
  };
  metaEventSource.addEventListener('change', (e) => {
    // Self-closing on the next event rather than tracked against every
    // place that can close the panel, same rationale as the poll timer
    // below — simpler than pairing a stop call with each close path, at
    // the cost of one open-but-idle connection until the next change
    // happens anywhere (already the same tradeoff the main per-session
    // /events connections make, which also stay open indefinitely once
    // a tab connects).
    if (!metaSubscriptionWanted()) {
      stopMetaSubscription();
      return;
    }
    handleMetaChange(e);
    if (sessionsPanel.classList.contains('open')) refreshSessionsList({ full: false });
    // A delegated child runs in its OWN session, so its turn_start/turn_end
    // never reaches this tab's per-session /events stream — only the meta
    // channel sees it. Without this, a delegate_session bubble would freeze
    // at whatever status it had when the session was opened. Gated on
    // actually having delegated children so an ordinary session adds no
    // request per cross-session event.
    if (delegatedChildren.length) refreshSubAgents();
  });
}

// The payload (server.py's broadcast_meta) was carried for years without a
// consumer; this is it. Events for the session this tab is *viewing* are
// deliberately ignored here — that session's own /events stream already
// delivered the same thing with a richer payload, and acting on both would
// announce every turn twice.
function handleMetaChange(e) {
  let m;
  try { m = JSON.parse(e.data); } catch { return; }
  // The global indicator tracks every session, so it refreshes regardless of
  // whether notifications are on — unlike the notification routing below.
  if (m && m.kind === 'permission') refreshPendingApprovals();
  if (!settings.notify) return;
  if (!m || !m.sessionId || m.sessionId === currentSessionId) return;
  if (m.kind === 'turn_start') { armSession(m.sessionId); return; }
  if (m.kind === 'turn_end') { notifyTurnEnd(m.sessionId, m.detail); return; }
  // detail is the ask's flavour ('permission'/'question') or 'resolved';
  // ref is the card's message id, which keeps separate asks separate.
  if (m.kind === 'permission' && m.detail !== 'resolved') notifyNeedsInput(m.sessionId, m.detail, m.ref);
}

// Called whenever either reason to be subscribed changes.
function updateMetaSubscription() {
  if (!metaSubscriptionWanted()) { stopMetaSubscription(); return; }
  // readyState matters as much as existence. An EventSource gives up
  // permanently (CLOSED) on a non-2xx response or a wrong Content-Type —
  // e.g. hitting the viewer mid-restart — and a dead-but-non-null handle
  // would otherwise wedge this forever, since no further 'change' event can
  // arrive to trip the self-closing guard either. Before this ran only from
  // openSessionsPanel, which re-created the stream unconditionally and so
  // repaired it by accident; now the repair has to be deliberate.
  if (!metaEventSource || metaEventSource.readyState === EventSource.CLOSED) {
    startMetaSubscription();
  }
}
function stopMetaSubscription() {
  clearTimeout(metaRetryTimer);
  metaRetryTimer = null;
  if (metaEventSource) { metaEventSource.onerror = null; metaEventSource.close(); metaEventSource = null; }
}

// Now purely a safety net (the meta subscription above is the real-time
// path) — covers a dropped/buffered SSE connection that hasn't been
// noticed yet, so it can stay slow; no longer the primary mechanism, hence
// the long interval.
let sessionsPollTimer = null;
function startSessionsPoll() {
  clearInterval(sessionsPollTimer);
  sessionsPollTimer = setInterval(() => {
    if (!sessionsPanel.classList.contains('open')) {
      clearInterval(sessionsPollTimer);
      return;
    }
    refreshSessionsList({ full: false });
  }, 20000);
}

async function openSessionsPanel() {
  if (sessionsPanel.classList.contains('open')) {
    sessionsPanel.classList.remove('open');
    // Not an unconditional stop any more: notifications may still want the
    // stream even with the panel shut.
    updateMetaSubscription();
    return;
  }
  if (!driverBase) return;
  sessionsList.innerHTML = '<div class="palette-empty">Loading…</div>';
  sessionsPanel.classList.add('open');
  await refreshSessionsList();
  updateMetaSubscription();
  startSessionsPoll();
}

// Note: there's no more switchSession() here that POSTs to the driver —
// viewSession() (defined up near connect()) is purely client-side now and
// is what every call site below uses. Switching (or starting a new chat)
// no longer needs to check turnInFlight at all: viewing is just an SSE
// subscription, completely decoupled from execution, so leaving a
// session's turn running in the background while you look at something
// else is exactly the point.

async function archiveSession(sessionId) {
  if (!driverBase) return;
  const wasCurrent = sessionId === currentSessionId;
  try {
    await fetch(`${driverBase}/archive-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, backend: sessionBackends.get(sessionId) }),
    });
    // Archiving doesn't disable resume, so this tab COULD keep viewing an
    // archived session just fine — but if it's the one you're currently
    // looking at, moving to something else automatically (rather than
    // leaving you parked on a session that just vanished from the active
    // list) mirrors what the driver itself used to do server-side before
    // multi-session support removed its single notion of "the" session.
    if (wasCurrent) {
      try {
        const res = await fetch(`${driverBase}/sessions`);
        const data = await res.json();
        const nextActive = (data.sessions || [])
          .filter((s) => s.sessionId !== sessionId && s.tag !== 'archived')
          .sort((a, b) => b.lastModified - a.lastModified)[0];
        // Same "guaranteed fresh, can't have a turn in flight" case
        // isNewSession is for — falling back to a brand-new id here for lack
        // of any other active session to land on, not switching to an
        // existing one (that branch is left to resync normally).
        if (nextActive) viewSession(nextActive.sessionId);
        else viewSession(crypto.randomUUID(), { isNewSession: true });
      } catch (e) {
        console.error('Failed to pick a session to move to after archiving:', e);
        viewSession(crypto.randomUUID(), { isNewSession: true });
      }
    }
    await refreshSessionsList();
  } catch (e) {
    console.error('Failed to archive session:', e);
  }
}

async function unarchiveSession(sessionId) {
  if (!driverBase) return;
  try {
    await fetch(`${driverBase}/unarchive-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, backend: sessionBackends.get(sessionId) }),
    });
    await refreshSessionsList();
  } catch (e) {
    console.error('Failed to unarchive session:', e);
  }
}


// Returns { keep: [ids] } or null if cancelled. Checkboxes start pre-checked
// for "delete" exactly when the child has no user turns; roster children are
// shown as a count with no checkbox, because HD1 leaves them no other way to
// be reached and keeping one would strand it on disk forever.
function familyDeleteDialog(title, preview) {
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    const box = document.createElement('div');
    box.className = 'modal-box';

    const h = document.createElement('div');
    h.className = 'modal-title';
    h.textContent = `Permanently delete "${title}"?`;
    const sub = document.createElement('div');
    sub.className = 'modal-sub';
    sub.textContent = 'This cannot be undone.';
    box.appendChild(h); box.appendChild(sub);

    const boxes = [];
    if (preview.delegated.length) {
      const lab = document.createElement('div');
      lab.className = 'modal-head';
      lab.textContent = 'Also delete these delegated sessions?';
      box.appendChild(lab);
      for (const d of preview.delegated) {
        const row = document.createElement('label');
        row.className = 'modal-row';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !d.hadUserTurn;
        cb.dataset.sessionId = d.sessionId;
        boxes.push(cb);
        const name = document.createElement('span');
        name.className = 'modal-row-title';
        name.textContent = d.title || '(untitled)';
        const why = document.createElement('span');
        why.className = 'modal-row-why';
        why.textContent = d.hadUserTurn ? 'you have messaged this one' : 'no messages from you';
        row.appendChild(cb); row.appendChild(name); row.appendChild(why);
        box.appendChild(row);
      }
    }
    if (preview.rosterCount) {
      const note = document.createElement('div');
      note.className = 'modal-note';
      note.textContent = `${preview.rosterCount} sub-agent transcript`
        + `${preview.rosterCount === 1 ? '' : 's'} will be deleted with it `
        + `(sub-agents can't outlive their parent).`;
      box.appendChild(note);
    }

    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const cancel = document.createElement('button');
    cancel.textContent = 'Cancel';
    const go = document.createElement('button');
    go.className = 'danger';
    go.textContent = 'Delete';
    actions.appendChild(cancel); actions.appendChild(go);
    box.appendChild(actions);

    const close = (v) => { back.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') close(null); };
    cancel.addEventListener('click', () => close(null));
    back.addEventListener('click', (e) => { if (e.target === back) close(null); });
    document.addEventListener('keydown', onKey);
    go.addEventListener('click', () => {
      // UNCHECKED means keep — the checkbox asks "also delete this?".
      close({ keep: boxes.filter((b) => !b.checked).map((b) => b.dataset.sessionId) });
    });

    back.appendChild(box);
    document.body.appendChild(back);
    go.focus();
  });
}

// HD4. The one-line confirm survives for a CHILDLESS session, which is the
// overwhelmingly common case; a session with a family escalates to a dialog
// that names what else is about to go.
//
// The heuristic ("no messages from you" => pre-checked) is good enough to be
// a default and not good enough to be silent: before this, the dialog said
// "delete this session" while the server destroyed the whole subtree, and
// which children vanished depended on invisible history. Surprise plus
// irreversibility is the pairing worth spending a dialog on.
async function deleteSessionFromUi(sessionId, title) {
  if (!driverBase) return;
  let preview = { rosterCount: 0, delegated: [] };
  try {
    preview = await (await fetch(
      `${driverBase}/delete-preview?sessionId=${encodeURIComponent(sessionId)}`)).json();
  } catch { /* fall through to the plain confirm rather than blocking */ }

  let keep = [];
  if (preview.delegated.length || preview.rosterCount) {
    const chosen = await familyDeleteDialog(title, preview);
    if (!chosen) return;
    keep = chosen.keep;
  } else if (!confirm(`Permanently delete "${title}"? This cannot be undone.`)) {
    return;
  }
  try {
    const res = await fetch(`${driverBase}/delete-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, backend: sessionBackends.get(sessionId), keep }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      alert(body.error || 'Failed to delete session.');
    }
    await refreshSessionsList();
  } catch (e) {
    console.error('Failed to delete session:', e);
  }
}

for (const tab of sessionsTabs) {
  tab.addEventListener('click', () => {
    sessionsView = tab.dataset.view;
    for (const t of sessionsTabs) t.classList.toggle('active', t === tab);
    renderSessionsList();
  });
}

sessionsBtn.addEventListener('click', openSessionsPanel);

// Notifications need the cross-session stream from the moment the page
// loads, not just while the sessions panel happens to be open — the whole
// point is hearing about a session this tab isn't watching. Placed here,
// after sessionsPanel is in scope, rather than beside the other settings
// initialisation further up.
updateMetaSubscription();
// ── New-chat project picker ─────────────────────────────────────────────────
const newChatPicker = document.getElementById('new-chat-picker');

function dismissNewChatPicker() {
  newChatPicker.classList.remove('show');
  newChatPicker.innerHTML = '';
}

// No server round-trip needed to actually *create* anything here — a "new
// chat" is just a client-minted id nobody has used before; driver.mjs
// figures out it's brand new (vs. an existing session it just hasn't
// touched yet) the same way either way, the first time a prompt actually
// arrives for it. The cwd (if not the default root) and backend (if not
// the server default) ride along as pendingCwdForNewSession/
// pendingBackendForNewSession and get attached to that first prompt.
function startNewChatInProject(cwd, backend) {
  const id = crypto.randomUUID();
  pendingCwdForNewSession = cwd ? { sessionId: id, cwd } : null;
  pendingBackendForNewSession = backend ? { sessionId: id, backend } : null;
  dismissNewChatPicker();
  sessionsPanel.classList.remove('open');
  viewSession(id, { isNewSession: true });
}

// Human-readable labels for known backend ids — falls back to the raw id
// for any backend this build of viewer.html doesn't specifically know about
// yet, so a new driver.mjs backend still shows up (just unstyled) instead of
// being silently hidden.
const BACKEND_LABELS = { 'claude-code': 'Claude Code', 'opencode': 'OpenCode' };

// ── Header backend indicator (dot color + "PodPrompt · <Backend>" badge) ──
// Each session is permanently bound to one backend from creation (driver.mjs
// never changes state.backend for a session's lifetime — see its own
// SessionState comment), so this is purely a display concern: show whichever
// backend the *currently viewed* session resolves to, via the same
// precedence submitPrompt() already uses for "what backend is this session
// really on" (a pending new-chat pick for a session with no driver state
// yet, else whatever the sessions list has taught us). Deliberately a
// read-only mirror of that precedence, not a shared helper that consumes
// pendingBackendForNewSession — submitPrompt() needs to null it out after
// first use; this needs to be able to re-read it as many times as the
// indicator gets refreshed before that first prompt actually goes out.
function resolvedBackendForIndicator() {
  if (pendingBackendForNewSession && pendingBackendForNewSession.sessionId === currentSessionId) {
    return pendingBackendForNewSession.backend;
  }
  return backendForCurrentSession();
}

const appLogo = document.getElementById('app-logo');
const backendBadge = document.getElementById('backend-badge');

// Called from viewSession() (every switch), and again from wherever
// sessionBackends/pendingBackendForNewSession later learn a fresher answer
// for the session still being viewed (refreshSessionsList()'s per-entry
// loop, startNewChatInProject()) — so the dot/badge/placeholder never sit on
// a stale or unresolved backend any longer than the underlying data does.
function updateBackendIndicator() {
  const backend = resolvedBackendForIndicator();
  // The setting is Claude-Code-only, and "which backend" is a property of
  // the session being viewed, not of the window — so this has to follow a
  // session switch rather than being decided once at load.
  refreshDeepHistoryUi();
  appLogo.classList.remove('backend-claude-code', 'backend-opencode');
  if (backend) {
    appLogo.classList.add(`backend-${backend}`);
    appLogo.title = BACKEND_LABELS[backend] || backend;
    backendBadge.textContent = ` · ${BACKEND_LABELS[backend] || backend}`;
  } else {
    appLogo.title = '';
    backendBadge.textContent = '';
  }
  updateDefaultPromptPlaceholder(backend);
}

// Tracks which backend button is currently selected while the picker is
// open — starts at whatever driver.mjs reports as its own default, updated
// by clicking a backend button, read when a project row is actually clicked
// to create the session.
let newChatSelectedBackend = null;

// Fetches /projects for one specific backend and (re-)renders just the
// project-item list + custom-subdirectory row into `section` — pulled out
// of openNewChatPicker so the backend-row buttons below can call this again
// on click without disturbing the backend row itself. Each backend's own
// project discovery is genuinely different (Claude Code's is a real
// multi-project scan; OpenCode's is a similar scan against its own session
// history, but can differ in what it's ever seen — see backends/
// opencode.mjs's listProjects), so switching the picker's selected backend
// without re-fetching would show one backend's list while the other is
// selected right above it.
async function loadAndRenderProjects(backend, section, currentCwd) {
  section.innerHTML = '<div class="palette-empty">Loading…</div>';
  try {
    const res = await fetch(`${driverBase}/projects?backend=${encodeURIComponent(backend)}`);
    const data = await res.json();
    section.innerHTML = '';
    for (const p of data.projects || []) {
      const item = document.createElement('div');
      const isCurrent = p.cwd === currentCwd;
      item.className = 'new-chat-project-item' + (isCurrent ? ' current' : '');
      item.textContent = isCurrent ? `${p.label} (current)` : p.label;
      item.addEventListener('click', () =>
        startNewChatInProject(p.cwd === data.root ? undefined : p.cwd, newChatSelectedBackend));
      section.appendChild(item);
    }

    const customRow = document.createElement('div');
    customRow.className = 'new-chat-custom-row';
    const input = document.createElement('input');
    input.placeholder = 'Or type a subdirectory path…';
    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) startNewChatInProject(input.value.trim(), newChatSelectedBackend);
    });
    customRow.appendChild(input);
    section.appendChild(customRow);
  } catch (e) {
    section.innerHTML = '<div class="palette-empty">Failed to load projects.</div>';
    console.error('Failed to load /projects:', e);
  }
}

async function openNewChatPicker() {
  if (newChatPicker.classList.contains('show')) {
    dismissNewChatPicker();
    return;
  }
  if (!driverBase) return;
  newChatPicker.innerHTML = '<div class="palette-empty">Loading…</div>';
  newChatPicker.classList.add('show');
  try {
    // Backend choice needs to be known before the first /projects fetch
    // (which now depends on it) rather than fired in parallel with it —
    // negligible added latency (loopback), and correctness beats shaving
    // one round trip here.
    // Tolerate an older driver.mjs without this route — falls back to a
    // single implicit claude-code choice, same as before this existed.
    const backendsRes = await fetch(`${driverBase}/backends`).catch(() => null);
    let backendsData = { available: ['claude-code'], default: 'claude-code' };
    if (backendsRes && backendsRes.ok) backendsData = await backendsRes.json();
    newChatSelectedBackend = backendsData.default;

    // Best-effort only — if the current session isn't in the cached list
    // yet (e.g. panel never opened this tab load), nothing gets marked
    // "current" here, which is purely cosmetic, not a correctness issue.
    const currentCwd = lastSessionsResult?.sessions?.find((s) => s.sessionId === currentSessionId)?.cwd;

    newChatPicker.innerHTML = '';

    const projectSection = document.createElement('div');
    projectSection.className = 'new-chat-project-section';

    // Backend row — only worth showing a choice at all when more than one
    // backend is actually registered (a single-backend deployment just
    // keeps today's implicit behavior, no picker clutter).
    if (backendsData.available.length > 1) {
      const backendRow = document.createElement('div');
      backendRow.className = 'new-chat-backend-row';
      for (const b of backendsData.available) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'new-chat-backend-btn' + (b === newChatSelectedBackend ? ' selected' : '');
        btn.textContent = BACKEND_LABELS[b] || b;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (newChatSelectedBackend === b) return;
          newChatSelectedBackend = b;
          backendRow.querySelectorAll('.new-chat-backend-btn')
            .forEach((el) => el.classList.toggle('selected', el === btn));
          loadAndRenderProjects(b, projectSection, currentCwd);
        });
        backendRow.appendChild(btn);
      }
      newChatPicker.appendChild(backendRow);
    }

    newChatPicker.appendChild(projectSection);
    await loadAndRenderProjects(newChatSelectedBackend, projectSection, currentCwd);
  } catch (e) {
    newChatPicker.innerHTML = '<div class="palette-empty">Failed to load projects.</div>';
    console.error('Failed to load new-chat picker:', e);
  }
}

newChatBtn.addEventListener('click', openNewChatPicker);
document.addEventListener('click', (e) => {
  if (newChatPicker.classList.contains('show') &&
      !newChatPicker.contains(e.target) && e.target !== newChatBtn) {
    dismissNewChatPicker();
  }
});

document.addEventListener('click', (e) => {
  if (sessionsPanel.classList.contains('open') &&
      !sessionsPanel.contains(e.target) && e.target !== sessionsBtn) {
    sessionsPanel.classList.remove('open');
  }
});

// Wait for KaTeX to load before connecting.
//
// loadDriverConfig() must resolve first (it sets driverBase, which
// refreshSessionsList() needs — see its own `if (!driverBase) return;`
// guard), and refreshSessionsList() must resolve before connect() so
// backendForCurrentSession() has a real answer for currentSessionId on this
// very first connect. Without this, the very first EventSource of any page
// load — restoring a session from the URL/localStorage, as opposed to a
// fresh "New chat" (which sets its own backend immediately via
// pendingBackendForNewSession, untouched by this) — went out with no
// &backend= at all, since sessionBackends only gets populated by
// refreshSessionsList(), which itself was previously only ever called from
// openSessionsPanel(). server.py would then silently default to the CLI's
// --backend flag; if that guessed wrong for this particular session,
// _ensure_seeded took the resulting empty history as genuinely empty and
// permanently latched that session blank (see server.py's own
// seeded/backend guard for the other half of this fix) until a full
// server.py restart gave it another chance. A bounded wait keeps a slow or
// unreachable driver from blocking the UI forever — worse to wait 3s than
// to hang, but also worse to hang than to fall back to today's
// occasionally-wrong unlabeled connect.
window.addEventListener('load', async () => {
  await loadDriverConfig();
  await Promise.race([
    refreshSessionsList().catch(() => {}),
    new Promise((resolve) => setTimeout(resolve, 3000)),
  ]);
  connect();
});
</script>
</body>
</html>
