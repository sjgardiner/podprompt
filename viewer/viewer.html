const contextUsageWrap  = document.getElementById('context-usage-wrap');
const contextUsageFill  = document.getElementById('context-usage-fill');
const contextUsageLabel = document.getElementById('context-usage-label');
const planUsageWrap     = document.getElementById('plan-usage-wrap');
const modelSelect       = document.getElementById('model-select');
const modeSelect        = document.getElementById('mode-select');
const autoApproveRow    = document.getElementById('auto-approve-row');
const autoApproveToggle = document.getElementById('auto-approve-toggle');
const autoDeliverRow    = document.getElementById('auto-deliver-row');
const autoDeliverToggle = document.getElementById('auto-deliver-toggle');

// Whether loadModels()/loadModes() have reached a DEFINITIVE answer for the
// session currently being viewed — either "this backend has no such concept
// at all" (server returns null) or "here's the real list" (a non-empty
// available[]). Deliberately distinct from "got a response": a backend that
// DOES support models/modes can still legitimately answer with an empty
// available[] right after a fresh driver.mjs restart, before any turn
// anywhere has populated its shared, process-wide model/mode cache yet (see
// backends/claude-code.mjs's knownModels) — that's the one case worth
// retrying, since the same session's *next* turn ending is likely to have
// populated it. Once genuinely resolved one way or the other, further
// retries would just be pinging for an answer that isn't going to change.
let modelsResolved = false;
let modesResolved = false;
// Which backend each picker's last successful resolution was fetched for —
// `null` until it resolves, else the exact backend id sent in the request.
// When `undefined` it means the request went out WITHOUT a backend param
// (sessionBackends didn't know it yet at fetch time), i.e. driver.mjs served
// the CLI-default backend for that session — indistinguishable from the
// "wrong backend" bug, so the mismatch resolver below treats it as a
// mismatch too. Compared against backendForCurrentSession() on every
// refreshSessionsList() tick; see resyncPickersIfNeeded().
let modelsResolvedBackend = null;
let modesResolvedBackend = null;

// Open-ended, capped-backoff auto-retry for the empty-available/unavailable/
// unreachable cases below. Retrying solely on turn_end (es.onopen can also
// miss it, see loadDriverConfig) left the picker hidden forever whenever the
// very first answer wasn't resolved AND the user hadn't sent a prompt yet —
// e.g. the opencode backend's /config/providers fetch racing `opencode
// serve`'s bind window right after a container start (the picker simply
// never appeared until a turn completed). This used to give up permanently
// after a fixed handful of attempts; it now keeps retrying, with growing
// backoff, for as long as the session stays unresolved (bounded only by the
// session actually being switched away from — resetBackendControlsDisplay()
// clears these timers/counts on every switch) — a real ceiling now that
// OpenCode's cold start or a crash-and-restart (see driver.mjs) can
// genuinely take longer than any fixed budget accounted for, and the
// "unavailable"/"unreachable" states below are explicitly meant to keep
// waiting rather than dead-end.
const PICKER_RETRY_BASE_MS = 2000;
const PICKER_RETRY_CEILING_MS = 20000;
let modelsRetryCount = 0;
let modesRetryCount = 0;
let modelsRetryTimer = null;
let modesRetryTimer = null;

function nextPickerRetryDelayMs(attempt) {
  return Math.min(PICKER_RETRY_BASE_MS * 2 ** attempt, PICKER_RETRY_CEILING_MS);
}

// Monotonic fetch sequence counters + session-identity capture for
// loadModels()/loadModes(), mirroring refreshSessionsList()'s sessionsFetchSeq
// staleness guard below. Without these, a /models or /modes response for the
// *previous* session could land after a session switch and overwrite the
// picker for whatever session is now being viewed — including flipping the
// one-shot modelsResolved/modesResolved flag for the wrong session, which
// would then block every subsequent fetch until the next full switch.
let modelsFetchSeq = 0;
let modesFetchSeq = 0;

function schedulePickerRetry(kind) {
  if (kind === 'models') {
    if (modelsRetryTimer || modelsResolved) return;
    const delay = nextPickerRetryDelayMs(modelsRetryCount++);
    modelsRetryTimer = setTimeout(() => { modelsRetryTimer = null; loadModels(); }, delay);
  } else {
    if (modesRetryTimer || modesResolved) return;
    const delay = nextPickerRetryDelayMs(modesRetryCount++);
    modesRetryTimer = setTimeout(() => { modesRetryTimer = null; loadModes(); }, delay);
  }
}

// Reset to the "nothing known yet" state — called on every session switch
// (viewSession()) so a freshly-viewed session never shows a stale reading
// left over from whatever was viewed before it, for the brief window
// before that session's own resync (resyncTurnStatus/loadModes/loadModels,
// all called from es.onopen) completes.
function resetBackendControlsDisplay() {
  contextUsageWrap.classList.remove('show');
  contextUsageFill.classList.remove('warn', 'crit', 'compacting');
  planUsageWrap.classList.remove('show');
  lastPlanUsageStatus = null;
  autoApproveToggle.checked = false;
  autoApproveRow.classList.remove('active');
  // MD9: the value is DERIVED for delegated sessions, so the browser cannot
  // recompute it locally — cleared here and rearmed from /turn-status.
  autoDeliverToggle.checked = false;
  autoDeliverRow.classList.remove('active');
  // Cleared on session switch like every other per-session control: a stale
  // "stopped" hint on a healthy session is worse than none at all.
  applyStoppedHint(false, false);
  modelSelect.classList.remove('show');
  modelSelect.innerHTML = '';
  modeSelect.classList.remove('show');
  modeSelect.innerHTML = '';
  modelsResolved = false;
  modesResolved = false;
  modelsResolvedBackend = null;
  modesResolvedBackend = null;
  clearTimeout(modelsRetryTimer); modelsRetryTimer = null;
  clearTimeout(modesRetryTimer); modesRetryTimer = null;
  modelsRetryCount = 0;
  modesRetryCount = 0;
  setModelBlockReason(null);
  // Invalidate any in-flight loadModels()/loadModes() for the session we're
  // leaving, so a stale response can't apply itself to the next session.
  modelsFetchSeq++;
  modesFetchSeq++;
}

function setTurnIndicator(text) {
  if (!text) {
    turnIndicator.classList.remove('show');
    turnIndicator.textContent = '';
    return;
  }
  turnIndicator.textContent = text;
  turnIndicator.classList.add('show');
}

function removeEmpty() {
  if (empty.parentNode) empty.remove();
}

function labelFor(role) {
  if (role === 'user') return 'You';
  if (role === 'tool') return 'Tool';
  // 'agent' is reserved for a future sub-agent bubble type — no backend
  // emits it yet (both backends' plain model-response text uses role
  // 'assistant', which falls through to 'Model' below), but the CSS
  // (.msg.agent) and this label are already wired up for whenever one does.
  if (role === 'agent') return 'Agent';
  if (role === 'thinking') return 'Thinking';
  if (role === 'permission') return 'Permission';
  return 'Model';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTs(iso) {
  if (!iso || settings.tsFormat === 'hidden') return '';
  const opts = { hour: '2-digit', minute: '2-digit', hour12: !settings.hour24 };
  if (settings.tsFormat === 'datetime') {
    opts.year = 'numeric';
    opts.month = 'short';
    opts.day = 'numeric';
  }
  if (settings.showTz) opts.timeZoneName = 'short';
  try {
    return new Date(iso).toLocaleString([], opts);
  } catch (e) {
    return '';
  }
}

// Timestamp settings (format/12h-24h/timezone) apply retroactively, since
// they're cheap to recompute — every rendered message keeps its raw ISO
// string precisely so this can re-derive the display text on demand.
function refreshTimestamps() {
  for (const id of feedOrder) {
    const entry = msgs[id];
    if (entry && entry.tsEl) entry.tsEl.textContent = formatTs(entry.ts);
  }
}

// Show model name on MODEL bubbles
function refreshModelNames() {
  for (const id of feedOrder) {
    const entry = msgs[id];
    if (entry && entry.modelEl) {
      const show = settings.showModelOn === 'all-bubbles' ? entry.role !== 'user' : entry.role === 'assistant';
      if (show && entry.model) {
        entry.modelEl.textContent = entry.model;
      } else {
        entry.modelEl.textContent = '';
      }
    }
  }
}

// Countdown form of a reset timestamp — "in 3 hr 31 min", matching the
// wording Claude Desktop uses for the same underlying data. Deliberately
// not reusing formatTs's opts (12h/24h/tz only make sense for a clock-face
// reading, not a duration) — this is a from-scratch relative render, not a
// variant of it.
function formatRelativeReset(iso) {
  if (!iso) return '';
  const deltaMs = new Date(iso).getTime() - Date.now();
  if (!Number.isFinite(deltaMs)) return '';
  if (deltaMs <= 0) return 'shortly';
  const totalMin = Math.round(deltaMs / 60000);
  const hr = Math.floor(totalMin / 60);
  const min = totalMin % 60;
  if (hr <= 0) return `in ${min} min`;
  if (min === 0) return `in ${hr} hr`;
  return `in ${hr} hr ${min} min`;
}

// Last plan_usage status received for whatever session is currently being
// viewed — kept around (rather than only ever rendering the bar once, when
// the status first arrives) so renderPlanUsage() can be re-run any time
// something that affects its *display* changes without a new turn having
// happened: settings.planResetFormat (absolute/relative) and the same
// tsFormat/hour24/showTz settings the message bubbles use, both handled by
// applySettings() calling this the same way it calls refreshTimestamps().
// Cleared by resetBackendControlsDisplay() on every session switch so a
// settings change made while viewing session B can't redisplay session A's
// stale reading.
let lastPlanUsageStatus = null;

function renderPlanUsage() {
  const s = lastPlanUsageStatus;
  if (!s) return;
  const WARN_THRESHOLD = 70;
  // Not named `window` — that'd shadow the global browser window object.
  const rateWindow = s.rate_limits?.five_hour?.utilization != null
    ? s.rate_limits.five_hour
    : (s.rate_limits?.seven_day?.utilization != null ? s.rate_limits.seven_day : null);
  if (s.subscription_type && rateWindow) {
    const pct = Math.round(rateWindow.utilization);
    const resetStr = rateWindow.resets_at
      ? (settings.planResetFormat === 'relative' ? formatRelativeReset(rateWindow.resets_at) : formatTs(rateWindow.resets_at))
      : '';
    // Percentage always shown now (used to disappear behind just the reset
    // time) — the reset time is appended when available, not swapped in.
    planUsageWrap.textContent = resetStr ? `${pct}% · resets ${resetStr}` : `${pct}%`;
    planUsageWrap.title = `Subscription: ${s.subscription_type} — ${pct}% of usage window used`;
    planUsageWrap.classList.toggle('warn', pct >= WARN_THRESHOLD);
    planUsageWrap.classList.add('show');
  } else {
    planUsageWrap.classList.remove('show');
  }
}

// Feed placement helper: a late-seeded history batch (see the 'history-batch'
// SSE handler) is OLDER than everything already in the feed, so its bubbles go
// at the TOP via insertTop; everything else appends.
function insertFeedItem(wrap, insertTop) {
  if (insertTop) feed.insertBefore(wrap, feed.firstChild);
  else feed.appendChild(wrap);
  // The jump bar is a feed item, not an overlay, so a front-inserting
  // history batch would otherwise shove it into the middle of the
  // transcript. Re-assert it rather than special-casing the insert, which
  // would mean reasoning about the batch's own ordering.
  if (jumpLatest && feed.firstChild !== jumpLatest) feed.insertBefore(jumpLatest, feed.firstChild);
  refreshJumpLatest();
}

// Shared body behind both history replay paths: the per-entry 'history' events
// sent on connect (insertTop=false, i.e. appended in final order) and the
// 'history-batch' event from server.py's background seed worker
// (insertTop=true — new ids slot above everything already rendered). Both get
// the same ts/model/rawText/render treatment; getOrCreate upserts by id, so a
// batch entry that this tab already rendered (exact-triple duplicate) is a
// no-op, and a double-delivered batch (a reconnect race) is harmless.
// A turn that began with no user input is the single most confusing thing
// peer messaging introduces: you watch a session finish, and seconds later it
// starts talking again. So the bubble that caused it must never look like
// something you typed. Reuses the established label + coloured-title
// convention (MODEL/TOOL/AGENT) rather than inventing a new one.
//
// Peer messages and returning delegation results deliberately read the SAME
// ("Peer"). The distinction is preserved in storage, so splitting them later
// needs no migration — but in a busy session a second label is just noise.

// Handle -> sessionId, so a PEER bubble's title can open the session it came
// from. Resolved lazily and cached: origin only ever carries the HANDLE
// (it has to, because after a reload it is inferred from the transcript's
// "[message from @x]" text, which is all that text contains), so the id has
// to be looked up. Refreshed on a miss, since a handle can be minted after
// this map was first built.
let peerIdByHandle = new Map();
let peersFetchedAt = 0;
async function refreshPeerHandles() {
  if (!driverBase) return;
  try {
    const d = await (await fetch(`${driverBase}/peers?all=1`)).json();
    const next = new Map();
    for (const p of d.peers || []) if (p.handle) next.set(p.handle, p.id);
    peerIdByHandle = next;
    peersFetchedAt = Date.now();
  } catch { /* a failed lookup just leaves the title unlinked */ }
}

// The Delegated label links back to the exact bubble in the parent that
// created this session — not merely to the parent.
//
// Anchoring is SKIPPED when the target would not be visible. A delegation is
// rendered as a tool bubble, so with tools hidden it is in the DOM but
// display:none: scrolling to it would land on a zero-height element and the
// highlight would flash invisibly. Overriding the setting to reveal it would
// be fighting a choice the user made; arriving at the right session with no
// jump is the honest behaviour.
async function openDelegationSource(handle) {
  const a = delegationAnchor;
  if (!a || !a.parentSessionId) { await openPeerByHandle(handle); return; }
  const canAnchor = !!a.bubbleId && settings.tools !== 'hide';
  if (a.parentSessionId !== currentSessionId) viewSession(a.parentSessionId);
  if (canAnchor) scrollToBubbleWhenReady(a.bubbleId);
}

async function openPeerByHandle(handle) {
  const bare = String(handle || '').replace(/^@/, '');
  if (!bare) return;
  let id = peerIdByHandle.get(bare);
  // One retry on a miss — the handle may post-date our cached map.
  if (!id && Date.now() - peersFetchedAt > 2000) {
    await refreshPeerHandles();
    id = peerIdByHandle.get(bare);
  }
  if (id) viewSession(id);
  else alert(`No session found for @${bare}. It may have been deleted.`);
}

function applyOrigin(m, origin) {
  if (!m || !origin || m.role !== 'user') return;
  const [kind, who] = String(origin).split(/:(.+)/);
  // A resumed turn is generated text, not something the user typed, and the
  // transcript must not claim otherwise. Rendered as a thin marker rather
  // than a prompt bubble — the interesting content is what follows it.
  if (kind === 'resume') {
    if (m.wrap) m.wrap.classList.add('from-resume');
    if (m.roleNameEl) {
      m.roleNameEl.textContent = '▸ Continued';
    }
    if (m.titleEl) {
      m.titleEl.textContent = ({
        restart: 'after a restart', aborted: 'after being stopped', error: 'after an error',
        stalled: 'after the provider stalled',
      })[who] || '';
    }
    return;
  }
  if (kind !== 'peer' && kind !== 'result' && kind !== 'delegate') return;
  if (m.wrap) {
    m.wrap.classList.add('from-peer');
    // OPEN by default, unlike thinking/tool bubbles: a peer message is
    // content the user asked for, not incidental detail. No setting for it —
    // one more three-way preference for a bubble type that appears rarely
    // would cost more to explain than it saves.
    //
    // Guarded on first wiring ONLY. applyOrigin runs again whenever the
    // bubble is re-rendered (a late history batch tops up the same id), and
    // re-adding `expanded` there would spring open a bubble the user had
    // just collapsed.
    if (!m.peerToggleWired) m.wrap.classList.add('expanded');
  }
  if (m.roleNameEl && !m.peerToggleWired) {
    m.roleNameEl.textContent = kind === 'delegate' ? 'Delegated' : 'Peer';
    // The label itself is the toggle, matching Thinking and Tool. The arrow
    // is a ::before on this element, so there is no separate hit target to
    // miss.
    m.roleNameEl.classList.add('peer-toggle');
    m.roleNameEl.addEventListener('click', () => m.wrap && m.wrap.classList.toggle('expanded'));
    m.peerToggleWired = true;
  }
  if (m.titleEl && who) {
    m.titleEl.textContent = who;
    // Clicking the handle opens that session. Deliberately a separate click
    // target from the label toggle beside it, with stopPropagation, so
    // "collapse this" and "go there" can never be confused — the same rule
    // the session rows' disclosure triangle follows.
    if (!m.peerLinkWired) {
      m.titleEl.classList.add('peer-link');
      const deep = kind === 'delegate';
      m.titleEl.title = deep ? `Open ${who} where this was delegated` : `Open ${who}`;
      m.titleEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (deep) openDelegationSource(who);
        else openPeerByHandle(who);
      });
      m.peerLinkWired = true;
    }
  }
  m.fromPeer = true;
  // The "[message from @x]" line exists for the MODEL, which has no label to
  // read. Once the label says it, repeating it in the body is noise.
  if (typeof m.rawText === 'string') {
    const stripped = m.rawText.replace(/^\[(?:message|delegated) from [^\]]+\]\n+/, '');
    if (stripped !== m.rawText) { m.rawText = stripped; renderBody(m); }
  }
}

function applyHistoryEntry(entry, insertTop) {
  if (!entry || entry.type !== 'message') return;
  const m = getOrCreate(entry.id, entry.role, insertTop);
  m.ts = entry.ts;
  m.model = entry.model || null;
  if (m.modelEl) {
    const show = settings.showModelOn === 'all-bubbles' ? m.role !== 'user' : m.role === 'assistant';
    if (show && m.model) {
      m.modelEl.textContent = m.model;
    } else {
      m.modelEl.textContent = '';
    }
  }
  if (m.tsEl) m.tsEl.textContent = formatTs(entry.ts);
  m.rawText = entry.text;
  // Mark hasVisibleContent for assistant bubbles with non-whitespace text
  if (m.role === 'assistant' && entry.text && entry.text.trim()) m.hasVisibleContent = true;
  m.el.classList.remove('streaming');
  renderBody(m);
  applyOrigin(m, entry.origin);
  // A late history batch is older content front-inserted above where the user
  // is — don't yank the viewport down to it. Initial connect replays (the
  // 'history' path) keep scrolling as before.
  if (!insertTop) scrollBottom();
}

function getOrCreate(id, role, insertTop) {
  if (msgs[id]) return msgs[id];

  removeEmpty();
  if (insertTop) feedOrder.unshift(id); else feedOrder.push(id);

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  if (role === 'agent') {
    // Async subagent reports are raw and often long — collapsed by default,
    // click to expand. Rendered as plain text, not markdown, since the
    // content is XML-ish tool output rather than prose.
    // The label carries the task's own title, so the feed reads
    // "Agent  Quick roster probe  10:42 PM" rather than a generic header
    // with the title buried in the body. The body is the sub-agent's live
    // status, filled from the roster by refreshTaskBubbles().
    wrap.innerHTML = `<div class="msg-label">${labelFor(role)} <span class="agent-title"></span><span class="model"></span><span class="ts"></span></div>
                      <div class="msg-body agent-live"></div>`;
    insertFeedItem(wrap, insertTop);
    msgs[id] = {
      el: wrap.querySelector('.agent-live'),
      titleEl: wrap.querySelector('.agent-title'),
      tsEl: wrap.querySelector('.ts'),
      modelEl: wrap.querySelector('.model'),
      rawText: '', ts: null, role, revealTimer: null, permId: id,
    };
    return msgs[id];
  }

  if (role === 'thinking') {
    // Reasoning/chain-of-thought — never markdown-parsed, never a copy
    // button, and collapsed (or hidden) per settings.thinking. The header is
    // the toggle: click to expand/collapse when in collapse mode.
    wrap.innerHTML = `<div class="msg-label"><span class="msg-think-toggle">Thinking <span class="model"></span><span class="ts"></span></span></div>
                      <div class="msg-body"></div>`;
    wrap.querySelector('.msg-think-toggle').addEventListener('click', () => wrap.classList.toggle('expanded'));
    insertFeedItem(wrap, insertTop);
    msgs[id] = {
      el: wrap.querySelector('.msg-body'),
      tsEl: wrap.querySelector('.ts'),
      modelEl: wrap.querySelector('.model'),
      rawText: '', ts: null, role, revealTimer: null, permId: id, wrap,
    };
    applyThinkingVisibility(msgs[id]);
    return msgs[id];
  }

  if (role === 'tool') {
    // Tool bubbles follow the same three display modes as thinking blocks
    // (see settings.tools): hidden, collapsed with the header as the toggle,
    // or always-expanded. Content still renders via renderToolBody() so the
    // Edit/MultiEdit/Write diff fences keep their hljs highlighting.
    wrap.innerHTML = `<div class="msg-label"><span class="msg-tool-toggle">Tool <span class="tool-name"></span><span class="model"></span><span class="ts"></span></span></div>
                      <div class="msg-body"></div>`;
    wrap.querySelector('.msg-tool-toggle').addEventListener('click', () => wrap.classList.toggle('expanded'));
    const toolNameEl = wrap.querySelector('.tool-name');
    insertFeedItem(wrap, insertTop);
    msgs[id] = {
      el: wrap.querySelector('.msg-body'),
      tsEl: wrap.querySelector('.ts'),
      modelEl: wrap.querySelector('.model'),
      toolNameEl,
      rawText: '', ts: null, role, revealTimer: null, permId: id, wrap,
    };
    applyToolsVisibility(msgs[id]);
    return msgs[id];
  }

  wrap.innerHTML = `<div class="msg-label"><span class="role-name">${labelFor(role)}</span> <span class="agent-title"></span><span class="model"></span><span class="ts"></span></div>
                    <div class="msg-body${role === 'assistant' ? ' streaming' : ''}"></div>
                    ${role === 'assistant' ? '<button class="msg-copy-btn">copy</button>' : ''}`;
  insertFeedItem(wrap, insertTop);

  const body = wrap.querySelector('.msg-body');
  msgs[id] = { el: body, tsEl: wrap.querySelector('.ts'), modelEl: wrap.querySelector('.model'),
    titleEl: wrap.querySelector('.agent-title'), roleNameEl: wrap.querySelector('.role-name'), wrap,
    rawText: '', ts: null, role, revealTimer: null, permId: id, model: null, hasVisibleContent: false };

  const copyBtn = wrap.querySelector('.msg-copy-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(msgs[id].rawText || '').then(() => {
        copyBtn.textContent = 'copied!';
        setTimeout(() => copyBtn.textContent = 'copy', 1500);
      });
    });
  }

  return msgs[id];
}

function applyThinkingVisibility(entry) {
  if (!entry || !entry.wrap || entry.role !== 'thinking') return;
  entry.wrap.classList.toggle('hidden-thought', settings.thinking === 'hide');
  if (settings.thinking === 'show') entry.wrap.classList.add('expanded');
  else entry.wrap.classList.remove('expanded');
}

function applyThinkingMode() {
  for (const id of feedOrder) {
    const en = msgs[id];
    if (en && en.role === 'thinking') applyThinkingVisibility(en);
  }
}

function applyToolsVisibility(entry) {
  if (!entry || !entry.wrap || entry.role !== 'tool') return;
  entry.wrap.classList.toggle('hidden-tool', settings.tools === 'hide');
  if (settings.tools === 'show') entry.wrap.classList.add('expanded');
  else entry.wrap.classList.remove('expanded');
}

function applyToolsMode() {
  for (const id of feedOrder) {
    const en = msgs[id];
    if (en && en.role === 'tool') applyToolsVisibility(en);
  }
}

function renderBody(entry) {
  if (entry.role === 'thinking') {
    // Plain text, never marked.parse() — reasoning is streamed verbatim and
    // must keep its exact whitespace/line breaks through every delta.
    entry.el.classList.remove('streaming');
    entry.el.textContent = entry.rawText || '';
    return;
  }
  if (entry.role === 'agent') {
    // The payload IS the title. Status lives in the body and is owned by
    // refreshTaskBubbles(), so it is deliberately not touched here — a
    // re-render of the title must not wipe the live line underneath it.
    if (entry.titleEl) entry.titleEl.textContent = entry.rawText || '';
    return;
  }
  if (entry.role === 'permission') {
    renderPermissionCard(entry);
    return;
  }
  if (entry.role === 'tool') {
    // No math extraction and no marked.parse() here at all — see
    // renderToolBody() above for why (bare `$` in shell params/diffs isn't
    // LaTeX, and prose markdown constructs shouldn't apply to command
    // output/paths). Fenced code (the Edit/MultiEdit/Write diff blocks)
    // still gets hljs syntax highlighting via renderToolBody()'s own
    // fence extraction.
    // The tool's name moves into the label, beside "Tool", so the body is
    // just the arguments — "Bash" stops being repeated on every line of a
    // feed that is mostly Bash. Falls back to rendering the text whole when
    // there is no name to lift, which covers the synthesized tool bubbles
    // (*(stopped)*, *(error: ...)*, local notices).
    const split = splitToolName(entry.rawText || '');
    if (entry.toolNameEl) entry.toolNameEl.textContent = split ? split.name : '';
    entry.el.innerHTML = renderToolBody(split ? split.rest : (entry.rawText || ''));
    return;
  }
  const html = marked.parse(extractMath(entry.rawText || ''));
  entry.el.innerHTML = injectMath(html);
}

// Live-formats a streaming bubble (markdown/KaTeX/hljs via renderBody, same
// as a finished message) instead of leaving it as an unformatted text dump
// until the turn ends — restores pre-existing behavior a prior fix
// regressed (that fix appended raw text nodes per delta and only ever
// called renderBody() once, at finalize, specifically to stop re-running
// marked.parse()+hljs.highlight() on the WHOLE accumulated bubble on every
// single token, which was the real source of a different choppiness
// complaint). The fix for that problem doesn't require skipping formatting
// entirely — it only requires bounding how often the expensive full
// re-parse+re-render happens, independent of how many stream_delta events
// arrive. Coalescing into "at most once per animation frame" does exactly
// that: however many deltas land between paints (a dense opencode burst can
// be a dozen), they collapse into the one renderBody() call that runs on
// the next frame, so total render work scales with actual frames painted
// (~60/sec ceiling), never with raw event count.
function scheduleStreamRender(entry) {
  if (entry.renderRaf) return; // already scheduled — the next frame will pick up this delta's text too
  entry.renderRaf = requestAnimationFrame(() => {
    entry.renderRaf = null;
    try {
      renderBody(entry);
    } catch (e) {
      // Partial/still-incomplete markdown (an unclosed fence, an
      // in-progress $…$ span) is normally harmless — marked/KaTeX just
      // render it as literal text until the closing delimiter arrives a
      // delta or two later — but if some edge case ever does throw, don't
      // let it silently stop this bubble from ever updating again: the
      // renderRaf flag above is already cleared, so the next delta's
      // scheduleStreamRender() call will still schedule a fresh attempt
      // (same defensive spirit as revealText()'s own try/catch below).
      console.error('Error during live stream render:', e);
    }
    scrollBottom();
  });
}

// ── Permission / AskUserQuestion cards ──────────────────────────────────────
// entry.rawText is JSON: {kind: 'permission'|'question', toolName, toolInput}.
// entry.resolved/resolvedText are set locally once acted on — there's no
// server-side memory of resolution state, so a stale reconnect could show
// live buttons for an already-resolved request again; clicking them just
// gets a 404 from driver.mjs (handled below), not a crash.
async function resolvePermission(id, payload) {
  try {
    const res = await fetch(`${driverBase}/permission-response`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, ...payload }),
    });
    return res.ok;
  } catch (e) {
    console.error('Failed to resolve permission:', e);
    return false;
  }
}

function renderPermissionCard(entry) {
  let data;
  try {
    data = JSON.parse(entry.rawText || '{}');
  } catch (e) {
    entry.el.textContent = entry.rawText || '';
    return;
  }

  // entry.resolved/resolvedText are the instant, purely-local flag this same
  // tab sets the moment it clicks Allow/Deny/submit (before the round trip
  // to the driver even completes). data.resolved/resolvedText are the
  // durable, server-broadcast version driver.mjs now sends once it actually
  // records the decision — present on reload/reconnect, or in a second tab,
  // where entry.resolved was never set locally at all.
  if (entry.resolved || data.resolved) {
    const text = entry.resolved ? entry.resolvedText : data.resolvedText;
    entry.el.innerHTML = `<div class="perm-resolved">${escapeHtml(text || 'Resolved')}</div>`;
    return;
  }

  const { kind, toolName, toolInput } = data;
  entry.el.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'perm-card';

  if (kind === 'question') {
    const questions = toolInput?.questions || [];
    // Per-question selection state. `chosen` holds the labels of any real
    // (non-"Other") options picked so far — a single label for an ordinary
    // question, any number for a multiSelect one. `otherOn`/`otherText`
    // track the free-text "Other" option independently, since its value can
    // keep changing after it's been picked (unlike a fixed option label).
    // This mirrors the real AskUserQuestion tool, which always guarantees
    // an "Other" choice alongside whatever fixed options it supplies.
    const state = questions.map(() => ({ chosen: new Set(), otherOn: false }));

    const submitBtn = document.createElement('button');
    submitBtn.className = 'perm-submit-btn';
    submitBtn.textContent = questions.length > 1 ? 'Submit answers' : 'Submit answer';
    submitBtn.disabled = true;

    // The full set of labels currently selected for question qi, in the
    // order: fixed options first (declaration order, via Set insertion),
    // then the free-typed "Other" text last, if active and non-blank.
    const otherTextareas = [];
    function labelsFor(qi) {
      const labels = [...state[qi].chosen];
      const otherVal = otherTextareas[qi] ? otherTextareas[qi].value.trim() : '';
      if (state[qi].otherOn && otherVal) labels.push(otherVal);
      return labels;
    }
    function updateSubmitEnabled() {
      submitBtn.disabled = !questions.every((q, qi) => labelsFor(qi).length > 0);
    }

    questions.forEach((q, qi) => {
      const qDiv = document.createElement('div');
      qDiv.className = 'perm-question';
      const qText = document.createElement('div');
      qText.className = 'perm-q-text';
      qText.textContent = q.question || q.header || `Question ${qi + 1}`;
      qDiv.appendChild(qText);

      const optsDiv = document.createElement('div');
      optsDiv.className = 'perm-options';

      const otherTextarea = document.createElement('textarea');
      otherTextarea.className = 'perm-other-textarea';
      otherTextarea.rows = 1;
      otherTextarea.placeholder = 'Type your own answer… (Shift+Enter for newline)';
      otherTextareas[qi] = otherTextarea;

      (q.options || []).forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'perm-option-btn';
        btn.textContent = opt.label;
        if (opt.description) btn.title = opt.description;
        btn.addEventListener('click', () => {
          if (q.multiSelect) {
            if (state[qi].chosen.has(opt.label)) {
              state[qi].chosen.delete(opt.label);
              btn.classList.remove('selected');
            } else {
              state[qi].chosen.add(opt.label);
              btn.classList.add('selected');
            }
          } else {
            // Exclusive: this option replaces any prior option AND turns
            // off "Other" — only one answer makes sense at a time.
            state[qi].chosen.clear();
            state[qi].chosen.add(opt.label);
            optsDiv.querySelectorAll('.perm-option-btn').forEach((b) => b.classList.remove('selected'));
            btn.classList.add('selected');
            if (state[qi].otherOn) {
              state[qi].otherOn = false;
              otherBtn.classList.remove('selected');
              otherTextarea.classList.remove('show');
            }
          }
          updateSubmitEnabled();
        });
        optsDiv.appendChild(btn);
      });

      // "Other" is always offered, exactly like the real tool — never
      // conditional on the options list the model happened to supply.
      const otherBtn = document.createElement('button');
      otherBtn.className = 'perm-option-btn perm-other-btn';
      otherBtn.textContent = 'Other…';
      otherBtn.addEventListener('click', () => {
        state[qi].otherOn = !state[qi].otherOn;
        if (state[qi].otherOn && !q.multiSelect) {
          // Exclusive: picking "Other" replaces any fixed option.
          state[qi].chosen.clear();
          optsDiv.querySelectorAll('.perm-option-btn:not(.perm-other-btn)')
            .forEach((b) => b.classList.remove('selected'));
        }
        otherBtn.classList.toggle('selected', state[qi].otherOn);
        otherTextarea.classList.toggle('show', state[qi].otherOn);
        if (state[qi].otherOn) {
          otherTextarea.focus();
          autoResizeTextarea(otherTextarea);
        }
        updateSubmitEnabled();
      });
      optsDiv.appendChild(otherBtn);

      otherTextarea.addEventListener('input', () => {
        autoResizeTextarea(otherTextarea);
        updateSubmitEnabled();
      });
      // Enter submits (like the main prompt box) unless Shift is held; the
      // textarea is single-question, so there's no ambiguity about which
      // answer this newline-vs-submit choice applies to.
      otherTextarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!submitBtn.disabled) submitBtn.click();
        }
      });

      qDiv.appendChild(optsDiv);
      qDiv.appendChild(otherTextarea);
      card.appendChild(qDiv);
    });

    submitBtn.addEventListener('click', async () => {
      submitBtn.disabled = true;
      const structured = questions.map((q, qi) => {
        const labels = labelsFor(qi);
        return { header: q.header || q.question, answer: q.multiSelect ? labels : (labels[0] ?? '') };
      });
      const formatted = questions
        .map((q, qi) => `${q.header || q.question}: ${labelsFor(qi).join(', ')}`)
        .join('; ');
      const ok = await resolvePermission(entry.permId, { answer: formatted, answers: structured });
      entry.resolved = true;
      entry.resolvedText = ok ? `Answered: ${formatted}` : 'This request already expired.';
      renderPermissionCard(entry);
    });
    card.appendChild(submitBtn);
  } else {
    const qText = document.createElement('div');
    qText.className = 'perm-q-text';
    // agentType is set only when a sub-agent asked but the card could not be
    // routed into that sub-agent's own session — say so rather than letting
    // it read as the main thread asking.
    qText.innerHTML = data.agentType
      ? `Approve <code>${escapeHtml(toolName || 'tool')}</code>? <span class="perm-asker">(asked by a <code>${escapeHtml(data.agentType)}</code> sub-agent)</span>`
      : `Approve <code>${escapeHtml(toolName || 'tool')}</code>?`;
    card.appendChild(qText);

    const actions = document.createElement('div');
    actions.className = 'perm-options';

    const allowBtn = document.createElement('button');
    allowBtn.className = 'perm-option-btn perm-allow';
    allowBtn.textContent = 'Allow';
    allowBtn.addEventListener('click', async () => {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      const ok = await resolvePermission(entry.permId, { allow: true });
      entry.resolved = true;
      entry.resolvedText = ok ? 'Allowed' : 'This request already expired.';
      renderPermissionCard(entry);
    });

    // Offered only when the backend said it can actually widen its own rules
    // for this ask (canAlwaysAllow). Without that, the button would behave
    // identically to Allow while implying it had done something lasting.
    // This is the middle ground between answering every prompt and the
    // all-or-nothing Auto-approve checkbox — the one that makes a
    // tool-heavy sub-agent run bearable without disabling review entirely.
    let alwaysBtn = null;
    if (data.canAlwaysAllow) {
      alwaysBtn = document.createElement('button');
      alwaysBtn.className = 'perm-option-btn perm-allow';
      alwaysBtn.textContent = 'Always allow';
      alwaysBtn.title = 'Allow this, and stop asking for calls like it in this session';
      alwaysBtn.addEventListener('click', async () => {
        allowBtn.disabled = true; denyBtn.disabled = true; alwaysBtn.disabled = true;
        const ok = await resolvePermission(entry.permId, { allow: true, always: true });
        entry.resolved = true;
        entry.resolvedText = ok ? 'Always allowed' : 'This request already expired.';
        renderPermissionCard(entry);
      });
    }

    const denyBtn = document.createElement('button');
    denyBtn.className = 'perm-option-btn perm-deny';
    denyBtn.textContent = 'Deny';
    denyBtn.addEventListener('click', async () => {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      if (alwaysBtn) alwaysBtn.disabled = true;
      const ok = await resolvePermission(entry.permId, { allow: false });
      entry.resolved = true;
      entry.resolvedText = ok ? 'Denied' : 'This request already expired.';
      renderPermissionCard(entry);
    });

    actions.appendChild(allowBtn);
    if (alwaysBtn) actions.appendChild(alwaysBtn);
    actions.appendChild(denyBtn);
    card.appendChild(actions);
  }

  entry.el.appendChild(card);
}

// Messages arrive whole, not token-by-token — reveal them word-by-word so
// they still feel live instead of popping in all at once.
// Duration is capped so long responses don't take forever to display.
function revealText(entry, fullText) {
  const words = fullText.split(/(\s+)/).filter(w => w.length > 0);
  const totalWords = words.length || 1;
  const steps = Math.min(totalWords, 40);
  const totalDurationMs = Math.min(900, Math.max(200, totalWords * 12));
  const stepMs = totalDurationMs / steps;
  const wordsPerStep = Math.ceil(totalWords / steps);
  let shown = 0;

  clearInterval(entry.revealTimer);
  entry.el.classList.add('streaming');

  entry.revealTimer = setInterval(() => {
    try {
      shown = Math.min(totalWords, shown + wordsPerStep);
      entry.rawText = words.slice(0, shown).join('');
      renderBody(entry);
      scrollBottom();
    } catch (e) {
      // If rendering ever throws (a markdown/KaTeX edge case), force
      // completion instead of retrying the same failing render forever —
      // otherwise this interval never reaches the cleanup below, and the
      // streaming cursor is left blinking on that bubble permanently.
      console.error('Error during message reveal, forcing completion:', e);
      shown = totalWords;
    } finally {
      if (shown >= totalWords) {
        clearInterval(entry.revealTimer);
        entry.el.classList.remove('streaming');
      }
    }
  }, stepMs);
}

// Autoscroll-lock: only force-scroll on new content if the user was already
// pinned to the bottom. If they've scrolled up to reread something, show a
// pill instead of yanking them back down on every reveal tick.
//
// This has to stay correct under BOTH `scroll-behavior: smooth` (an
// animated, multi-frame scroll, ~300-500ms) and `scroll-behavior: auto`
// (an instant jump) — see the "Auto-scroll animation" setting. The naive
// version of this (recompute pinnedToBottom on every 'scroll' event) only
// works for the instant case. Under 'smooth', a programmatic scroll-to-
// bottom fires 'scroll' events for its intermediate, not-yet-at-bottom
// frames too. If new content arrives mid-animation — e.g. a permission
// bubble landing right after a multi-row tool bubble — one of those
// intermediate frames can get sampled as "the user scrolled away", flipping
// pinnedToBottom to false and abandoning the in-flight scroll short of the
// real bottom. That's the "auto-scroll gets stuck partway" bug, and it also
// explains the pill showing up even when you're basically already at the
// bottom — same false reading.
//
// Fix: ignore 'scroll' events that we caused ourselves (tracked via
// `autoScrolling`), and only trust 'scroll' events that happen outside that
// window as real user intent. This doesn't depend on sampling scroll
// position mid-flight at all, so it's agnostic to which scroll-behavior is
// active — smooth or instant, the logic is identical.
const newPill = document.getElementById('new-pill');
let pinnedToBottom = true;
let autoScrolling = false;
let autoScrollSettleTimer = null;

function isNearBottom() {
  return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
}

feed.addEventListener('scroll', () => {
  if (autoScrolling) return; // our own scroll-to-bottom in flight, not user intent
  pinnedToBottom = isNearBottom();
  if (pinnedToBottom) newPill.classList.remove('show');
});

// Fires once our own auto-scroll has actually settled: via the modern
// 'scrollend' event where supported, and always via a debounced fallback
// timer for browsers that don't support it (e.g. Safari < 17.4) or that
// skip firing it for a no-op scroll. Either way, this is the one place
// that re-derives the real pinned state once we're done driving the scroll
// ourselves — not mid-flight.
function onAutoScrollSettled() {
  autoScrolling = false;
  clearTimeout(autoScrollSettleTimer);
  pinnedToBottom = isNearBottom();
  if (pinnedToBottom) newPill.classList.remove('show');
}
if ('onscrollend' in window) {
  feed.addEventListener('scrollend', onAutoScrollSettled);
}

function performAutoScroll() {
  autoScrolling = true;
  pinnedToBottom = true;
  feed.scrollTop = feed.scrollHeight;
  // Debounced fallback in case 'scrollend' isn't supported or doesn't fire.
  // 500ms comfortably covers a 'smooth' animation's duration. Repeated
  // calls (e.g. per-token stream deltas, or a fast run of reveal ticks)
  // keep pushing this out, which is intended — we only want to settle once
  // new content actually stops arriving, not after the first tick.
  clearTimeout(autoScrollSettleTimer);
  autoScrollSettleTimer = setTimeout(onAutoScrollSettled, 500);
}

newPill.addEventListener('click', () => {
  performAutoScroll();
  newPill.classList.remove('show');
});

function scrollBottom() {
  if (pinnedToBottom) {
    performAutoScroll();
  } else {
    newPill.classList.add('show');
  }
}

// ── Multi-session: which session THIS TAB is currently viewing ─────────────
// Each tab owns this independently — there is no server-side notion of "the"
// current session anymore. Resolution order on first load: an explicit
// ?session= in the URL (always wins — this is what makes a session
// bookmarkable/shareable and what "open in new tab" links to), else the
// last session this browser viewed in any tab (localStorage — shared across
// tabs, but only ever read once at load time, never watched reactively, so
// one tab switching never yanks another tab's already-open view), else
// (truly first-ever launch, nothing to remember yet) a freshly minted id —
// same as what used to happen server-side on every container launch, just
// client-side now since there's no single "the" session to pre-seed.
const LAST_SESSION_KEY = 'lastViewedSessionId';

function resolveInitialSessionId() {
  const fromUrl = new URLSearchParams(location.search).get('session');
  if (fromUrl) return fromUrl;
  const fromStorage = localStorage.getItem(LAST_SESSION_KEY);
  if (fromStorage) return fromStorage;
  return crypto.randomUUID();
}

let currentSessionId = resolveInitialSessionId();
localStorage.setItem(LAST_SESSION_KEY, currentSessionId);
// replaceState, not pushState — this is establishing the initial URL, not
// a new navigation entry — so the address bar is accurate and the page is
// bookmarkable/shareable right from the first load, even if the id came
// from localStorage rather than the URL itself.
{
  const url = new URL(location.href);
  url.searchParams.set('session', currentSessionId);
  history.replaceState({ sessionId: currentSessionId }, '', url);
}

// ── SSE ───────────────────────────────────────────────────────────────────────
let es;
let reconnectTimer;

function connect() {
  es = new EventSource('/events?session=' + encodeURIComponent(currentSessionId) +
    (backendForCurrentSession() ? '&backend=' + encodeURIComponent(backendForCurrentSession()) : ''));

  es.onopen = () => {
    setStatus('live', 'live');
    clearTimeout(reconnectTimer);
    resyncTurnStatus();
    loadModes();
    loadModels();
  };

  es.onerror = () => {
    setStatus('error', 'reconnecting…');
    es.close();
    reconnectTimer = setTimeout(connect, 2000);
  };

  // Complete messages, broadcast live by driver.mjs
  es.addEventListener('message', e => {
    const msg = JSON.parse(e.data);
    const { id, role, text, ts, model, origin } = msg;
    const entry = getOrCreate(id, role);
    entry.ts = ts;
    // A message with no model must not erase one the bubble already has.
    // The same bubble id is written more than once — stream_start labels it
    // while it types, and the finalizing broadcast rewrites it — so an
    // absent model means "nothing to add here", not "forget what you knew".
    if (model) entry.model = model;
    if (entry.modelEl) {
      const show = settings.showModelOn === 'all-bubbles' ? entry.role !== 'user' : entry.role === 'assistant';
      if (show && entry.model) {
        entry.modelEl.textContent = entry.model;
      } else {
        entry.modelEl.textContent = '';
      }
    }
    if (entry.tsEl) entry.tsEl.textContent = formatTs(ts);
    if (role === 'user' || role === 'agent' || role === 'permission' || role === 'thinking') {
      entry.rawText = text;
      entry.el.classList.remove('streaming');
      renderBody(entry);
      applyOrigin(entry, origin);
      scrollBottom();
      // A permission/question badge can appear or clear on this same
      // message (the initial ask, or its resolution rebroadcast) — poke
      // the panel the same way turn_start/turn_end does, rather than
      // leaving it to the next poll tick.
      if (role === 'permission') {
        pokeSessionsListIfOpen();
        // Live asks only. This listener never sees replayed history (that
        // arrives as 'history'/'history-batch'), and the resolution
        // rebroadcast carries resolved:true — without that check, answering
        // a prompt would itself announce "waiting on your approval".
        try {
          const p = JSON.parse(text);
          if (!p.resolved) notifyNeedsInput(currentSessionId, p.kind, id);
        } catch { /* not the structured payload — nothing to announce */ }
      }
    } else if (entry.liveStreamed) {
      // Already typed out live via stream_delta — this is just the
      // authoritative final text for the same bubble, not new content to
      // reveal again. Render it instantly instead of re-animating.
      entry.liveStreamed = false;
      // A stream_delta's throttled render (see scheduleStreamRender) may
      // still have a frame pending — cancel it since we're about to render
      // the authoritative final text synchronously right here; the stale
      // frame would otherwise fire a redundant (harmless, but wasted) extra
      // render right after this one.
      if (entry.renderRaf) { cancelAnimationFrame(entry.renderRaf); entry.renderRaf = null; }
      entry.rawText = text;
      // Mark hasVisibleContent for assistant bubbles
      if (role === 'assistant' && text && text.trim()) entry.hasVisibleContent = true;
      entry.el.classList.remove('streaming', 'raw');
      renderBody(entry);
      scrollBottom();
    } else {
      // Mark hasVisibleContent for assistant bubbles
      if (role === 'assistant' && text && text.trim()) entry.hasVisibleContent = true;
      revealText(entry, text);
    }
  });

  // History replay on reconnect
  es.addEventListener('history', e => {
    const entry = JSON.parse(e.data);
    applyHistoryEntry(entry, false);
  });

  // Late-seeded history: a background server-side merge (see server.py's
  // _seed_worker) landed after this tab connected, so it arrives as a single
  // batch rather than as part of the connect replay. A session gets at most
  // one history batch per server life and it always logically precedes
  // everything live, so new bubbles are front-inserted at the TOP; ids this
  // tab already rendered just update in place (getOrCreate upserts). The
  // batch is iterated NEWEST-first because each front-insert lands its entry
  // above everything before it — walking oldest-first would end up reversing
  // the batch, leaving the newest past message at the very top.
  es.addEventListener('history-batch', e => {
    const batch = JSON.parse(e.data);
    for (let i = batch.length - 1; i >= 0; i--) applyHistoryEntry(batch[i], true);
  });

  // Ephemeral turn-in-flight signal from driver.mjs (not part of message_log
  // — see server.py's /status handler). Keeps the Send/Stop toggle correct
  // even if this tab reconnects mid-turn or another tab started it.
  es.addEventListener('status', e => {
    const s = JSON.parse(e.data);
    // Sent once a completed assistant message makes the model certain, for
    // bubbles that were streamed and so never got a final 'message' event to
    // carry it. Applied to the entry, not just the DOM, so a later re-render
    // or a settings change does not blank it again.
    if (s.type === 'stream_model' && Array.isArray(s.ids) && s.model) {
      for (const id of s.ids) {
        const entry = msgs[id];
        if (!entry) continue;
        entry.model = s.model;
        if (entry.modelEl) {
          const show = settings.showModelOn === 'all-bubbles' ? entry.role !== 'user' : entry.role === 'assistant';
          entry.modelEl.textContent = show ? s.model : '';
        }
      }
    }
    if (s.type === 'awaiting_input') { setAwaitingInput(s.kind, s.toolName); refreshPendingApprovals(); }
    if (s.type === 'turn_start') {
      setTurnInFlight(true); setAwaitingInput(null); setTurnIndicator('Thinking…'); pokeSessionsListIfOpen();
      // Arming here rather than in submitPrompt covers turns this tab did
      // not start itself (another tab, or a reconnect that lands mid-turn).
      armSession(currentSessionId);
      clearTitleMark();
      refreshSubAgents();
    }
    // A sub-agent's own progress is reported on the parent's stream, so the
    // roster can stay current without polling.
    if (s.type === 'sub_agents_changed' || s.type === 'tool_progress' || s.type === 'awaiting_input') refreshSubAgents();
    if (s.type === 'inbox_changed') { refreshAutonomy(); refreshMail(); }
    // Both edges: a turn ending may CREATE something to resume, and a turn
    // starting always retires it.
    if (s.type === 'turn_end' || s.type === 'turn_start') refreshResumeBar();
    if (s.type === 'turn_end') {
      setTurnInFlight(false); setTurnIndicator(null); pokeSessionsListIfOpen();
      refreshSubAgents();
      notifyTurnEnd(currentSessionId, s.reason);
      // In case a final 'message' for a live-streamed bubble was ever
      // missed (reconnect gap, backend hiccup), never leave a bubble stuck
      // with a blinking cursor past the end of its turn.
      // Also suppress empty MODEL bubbles (assistant bubbles with no visible content)
      for (const id of feedOrder) {
        const en = msgs[id];
        if (en && en.el) {
          en.el.classList.remove('streaming');
          en.liveStreamed = false;
          // Suppress empty assistant bubbles (those that never received non-whitespace content)
          if (en.role === 'assistant' && !en.hasVisibleContent) {
            en.wrap.classList.add('hidden-empty');
          }
        }
      }
      // Cheap once resolved: loadModes()/loadModels() early-return
      // immediately if modesResolved/modelsResolved is already true, so
      // this is a real re-fetch only for the case it exists to cover — the
      // shared model/mode cache was still cold the one time this tab's
      // es.onopen fired (e.g. right after a driver.mjs restart) and this
      // session's own turn ending is a good moment to check whether it's
      // populated by now. Not a recurring poll: once resolved, every
      // subsequent turn_end costs nothing.
      loadModes();
      loadModels();
    }

    // Live thinking-token estimate during the redacted-thinking phase, when
    // no actual thinking text streams yet (see SDKThinkingTokensMessage).
    if (s.type === 'thinking_tokens') setTurnIndicator(`Thinking… (${s.estimated_tokens} tokens)`);

    // Ticking status for long-running tool calls (mirrors the TUI's
    // "esc to interrupt (12s)" line).
    if (s.type === 'tool_progress') setTurnIndicator(`Running \`${s.toolName}\`… (${Math.round(s.elapsedSeconds)}s)`);

    // §15. A backend retrying internally can go quiet for minutes, which
    // looks exactly like one of the §13e stalls. Saying so costs one line
    // and removes the whole question — and if the retries go on to fail,
    // the user has already seen it coming.
    if (s.type === 'api_retry') {
      const of = s.maxRetries ? `/${s.maxRetries}` : '';
      const when = s.nextAt
        ? ` — next at ${new Date(s.nextAt < 1e11 ? s.nextAt * 1000 : s.nextAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
        : (s.delayMs ? ` — retrying in ${Math.round(s.delayMs / 1000)}s` : '');
      const why = s.status ? ` after HTTP ${s.status}` : '';
      setTurnIndicator(`Provider retry ${s.attempt}${of}${why}${when}`);
    }

    // Real per-token streaming (includePartialMessages): a text/thinking
    // block just started — create its bubble now and mark it as
    // live-streamed so the eventual 'message' event finalizes instead of
    // re-revealing. Real content is here now, so the placeholder line goes
    // away. Thinking bubbles get no blinking cursor (they're plain text and
    // near-always collapsed anyway).
    if (s.type === 'stream_start') {
      const entry = getOrCreate(s.id, s.role);
      // See the stream_delta seq check just below for the full story — a
      // stream_start always begins a fresh id, so it sets the baseline
      // rather than ever being dropped.
      if (typeof s.seq === 'number') entry.lastSeq = s.seq;
      entry.liveStreamed = true;
      // Recorded on the entry, not just painted: refreshModelNames() and any
      // re-render read entry.model, so setting only the DOM would make the
      // label vanish again the next time either ran.
      if (s.model) {
        entry.model = s.model;
        if (entry.modelEl) {
          const show = settings.showModelOn === 'all-bubbles' ? entry.role !== 'user' : entry.role === 'assistant';
          if (show) entry.modelEl.textContent = s.model;
        }
      }
      if (s.role !== 'thinking') entry.el.classList.add('streaming');
      // 'raw' (plain pre-wrap text) is still how a thinking bubble's
      // verbatim chain-of-thought is displayed, permanently — renderBody()
      // never marked.parse()s a thinking entry (see renderBody), so it needs
      // the CSS white-space:pre-wrap to keep its line breaks. An assistant
      // bubble does NOT get it: it's rendered as real markdown while
      // streaming now (see scheduleStreamRender below), not dumped as raw
      // text, so it must keep its normal (non-pre-wrap) markdown styling
      // from the very first token.
      if (s.role === 'thinking') entry.el.classList.add('raw');
      setTurnIndicator(null);
    }

    if (s.type === 'stream_delta') {
      const entry = getOrCreate(s.id, s.role);
      // driver.mjs serializes its outbound broadcasts per session so these
      // can't arrive out of order (see enqueueSend in driver.mjs) — this
      // check is cheap extra insurance against any other reordering source
      // (a dropped/replayed SSE connection, some future broadcast path that
      // forgets to go through that queue). Each stream_start/stream_delta
      // carries a `seq` assigned in true production order; a payload that
      // doesn't move a bubble's sequence forward is stale and gets dropped
      // outright rather than trusted. This is the ONLY guard against
      // out-of-order delivery now (see scheduleStreamRender below for why
      // there's no more prefix/rebuild check to fall back on) — confirmed
      // necessary by comparing a raw opencode /event capture, perfectly
      // monotonic, against the driver-relayed copy of the same turn, which
      // was not.
      if (typeof s.seq === 'number') {
        if (typeof entry.lastSeq === 'number' && s.seq <= entry.lastSeq) return;
        entry.lastSeq = s.seq;
      }
      entry.liveStreamed = true;
      entry.rawText = String(s.text || '');
      // Mark that this entry has visible content (non-whitespace)
      if (s.text && s.text.trim()) entry.hasVisibleContent = true;
      scheduleStreamRender(entry);
    }

    // Context-window usage — both backends broadcast this (Claude Code from
    // SDKAssistantMessage.context_usage; OpenCode computed from tokens vs.
    // the model's own limit.context, see backends/opencode.mjs). Color
    // thresholds loosely mirror the TUI's own convention: plain green under
    // 70%, amber approaching the limit, red once compaction is imminent.
    if (s.type === 'context_usage') {
      const pct = Math.max(0, Math.min(100, Math.round(s.percentage || 0)));
      contextUsageWrap.classList.add('show');
      contextUsageFill.style.width = pct + '%';
      contextUsageFill.classList.toggle('warn', pct >= 70 && pct < 90);
      contextUsageFill.classList.toggle('crit', pct >= 90);
      contextUsageLabel.textContent = pct + '%';
      const totalStr = (s.totalTokens || 0).toLocaleString();
      const maxStr = (s.maxTokens || 0).toLocaleString();
      contextUsageWrap.title = `Context window: ${totalStr} / ${maxStr} tokens${s.model ? ' (' + s.model + ')' : ''}`;
    }

    // Auto-compaction in progress/finished. The bar itself flips to a
    // pulsing accent color for the duration (independent of whatever
    // percentage it was last showing); a plain local notice marks
    // completion, success or failure, the same way a Stop/error already
    // gets one (see showLocalNotice).
    if (s.type === 'compacting') {
      contextUsageFill.classList.toggle('compacting', !!s.active);
      if (!s.active && s.result) {
        const tokenNote = (s.preTokens && s.postTokens)
          ? ` (${s.preTokens.toLocaleString()} → ${s.postTokens.toLocaleString()} tokens)`
          : '';
        showLocalNotice(s.result === 'success'
          ? `*(context compacted${tokenNote})*`
          : `*(compaction failed${s.error ? ': ' + s.error : ''})*`);
      }
    }

    // Claude subscription plan-limit bar (Claude Code only — hidden
    // whenever rate_limits_available was false server-side, e.g. this
    // session is running over LiteLLM/an API key/Bedrock/Vertex rather
    // than a real Pro/Max/Team/Enterprise OAuth login). Actual rendering
    // lives in renderPlanUsage() (see its definition, near formatTs) so the
    // same code path can be re-run from applySettings() when the
    // absolute/relative or timestamp-format settings change, without
    // needing a fresh status broadcast to do it.
    if (s.type === 'plan_usage') {
      lastPlanUsageStatus = s;
      renderPlanUsage();
    }

    // OpenCode's analogue of plan_usage — no plan/quota concept exists
    // there, just a running cumulative cost, shown in the same header slot
    // (only one of the two ever applies to a given session's backend).
    if (s.type === 'spend') {
      planUsageWrap.textContent = `$${Number(s.totalCostUsd || 0).toFixed(2)} session`;
      planUsageWrap.title = 'Cumulative session spend (OpenCode has no subscription/quota concept)';
      planUsageWrap.classList.add('show');
    }
  });

}

// Switch THIS TAB's view to a different session id — entirely client-side
// now (no /switch-session or /new-session driver endpoint anymore): closes
// the current EventSource, points a new one at /events?session=<id>, and
// lets that connection's own 'history' replay (already scoped correctly by
// server.py) populate the feed. This is also what replaces the old
// driver-pushed 'reset' broadcast — that only made sense when every
// connected tab shared one "current" session to be reset onto; now each tab
// asks for exactly the session it wants and nothing else is affected.
// knownChild/knownParent let a caller that ALREADY knows it is opening a
// sub-agent (the roster, a Task bubble) say so, so the read-only chrome is
// right on the first paint. Without it the input bar and controls flash
// visible for the moment between the switch and resyncTurnStatus confirming
// what kind of session this is.
function viewSession(sessionId, { updateUrl = true, isNewSession = false, knownChild = false, knownParent = null } = {}) {
  if (sessionId === currentSessionId) return;
  if (!(pendingCwdForNewSession && pendingCwdForNewSession.sessionId === sessionId)) {
    pendingCwdForNewSession = null;
  }
  if (!(pendingBackendForNewSession && pendingBackendForNewSession.sessionId === sessionId)) {
    pendingBackendForNewSession = null;
  }
  // MD1: stop watching the session being left and start watching this one,
  // both immediately. Without the first half, the old session's mail stays
  // held until the driver's TTL lapses — up to a minute of silence for mail
  // the user has visibly walked away from.
  const leavingSessionId = currentSessionId;
  currentSessionId = sessionId;
  if (driverBase && leavingSessionId && leavingSessionId !== sessionId) {
    fetch(`${driverBase}/viewing`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: leavingSessionId, visible: false }),
    }).catch(() => {});
  }
  lastViewingKey = '';          // force a report for the new session
  reportViewing(true);
  localStorage.setItem(LAST_SESSION_KEY, sessionId);
  if (updateUrl) {
    const url = new URL(location.href);
    url.searchParams.set('session', sessionId);
    history.pushState({ sessionId }, '', url);
  }
  clearFeed();
  setTurnIndicator(null);
  // The flag described the session being left behind.
  clearTitleMark();
  // Cleared rather than left stale: resyncTurnStatus repopulates all three
  // for the new session a moment later, and showing the previous session's
  // sub-agents in between would be wrong.
  subAgents = [];
  delegatedChildren = [];
  heldMail = [];
  mailExpanded = false;
  delegationAnchor = null;
  // MD9: the mail half belongs to the session being left, so clear it rather
  // than let the next session briefly inherit its count. refreshMail()
  // repopulates a moment later.
  renderMailBar();
  currentSessionIsChild = knownChild;
  resumeBar.classList.remove('show');
  refreshResumeBar();
  currentSessionParent = knownParent;
  applySubAgentBanner();
  renderRoster();
  resetBackendControlsDisplay();
  updateBackendIndicator();
  // isNewSession (set only by startNewChatInProject()) is a hard guarantee,
  // not a guess: a session id minted client-side this instant, that has
  // never had a prompt sent for it, cannot possibly have a turn in flight
  // anywhere. Resetting unconditionally for *every* switch would be wrong —
  // switching to some other EXISTING session that genuinely has a live turn
  // running (common: started from another tab) would flash Send before
  // resyncTurnStatus() flips it back to Stop a moment later. Scoped to
  // exactly the one case where the answer is already known for certain.
  if (isNewSession) setTurnInFlight(false);
  clearTimeout(reconnectTimer);
  if (es) es.close();
  connect();
  if (sessionsPanel.classList.contains('open')) renderSessionsList(); // refresh "current" highlight
}

// Back/forward navigation between sessions (e.g. after following an
// "open in new tab" link and then hitting Back) — reuses the same switch
// logic, just without pushing another history entry (the browser already
// moved us to this URL).
// Same eager-backend-resolution treatment as the cold-page-load boot
// sequence below (see its own comment): sessionBackends only gets populated
// by refreshSessionsList(), which normally only runs when the sessions panel
// has been opened. Back/forward can land on a session this tab never
// touched via that panel (e.g. followed an "open in new tab" link, then hit
// Back) — without this, viewSession()'s connect() would go out with no
// &backend=, the same misdetection this fixes for the very first page load.
// Bounded the same way: worse to wait 3s than hang, worse to hang than fall
// back to today's occasionally-wrong unlabeled connect.
window.addEventListener('popstate', async () => {
  const id = new URLSearchParams(location.search).get('session');
  if (!id) return;
  if (!sessionBackends.has(id)) {
    await Promise.race([
      refreshSessionsList().catch(() => {}),
      new Promise((resolve) => setTimeout(resolve, 3000)),
    ]);
  }
  viewSession(id, { updateUrl: false });
});

// ── Settings panel ──────────────────────────────────────────────────────────
const SETTINGS_KEY = 'viewerSettings';
const SETTINGS_DEFAULTS = {
  fontSize: 15, width: 860, labelFontSize: 11, statusFontSize: 12, theme: 'dark', tools: 'show',
  autoScrollAnim: 'smooth',
  tsFormat:'time', hour24:false, showTz:false, thinking:'collapse',
  sessionsLayout: 'flat', unreachableMode: 'count', badgePosition: 'after',
  planResetFormat: 'absolute', showModelOn: 'model-only', sessionsSort: 'created',
  // notify is the user's *intent*, deliberately independent of whether the
  // browser will actually show an OS notification: permission can be revoked
  // in site settings at any time, and on a plain-HTTP origin Safari refuses
  // the API outright. Keeping the two separate is what lets the feature
  // degrade to the tab-title flag instead of silently doing nothing — the
  // reason is spelled out in the settings panel (see refreshNotifyUi).
  notify: false, notifySound: false,
};

function loadSettings() {
  try {
    const s = Object.assign({}, SETTINGS_DEFAULTS, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'));
    // Migrate the old boolean toolbar setting to the new three-mode picker.
    if (s.showTools != null && s.tools == null) {
      s.tools = s.showTools ? 'show' : 'hide';
      delete s.showTools;
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
    }
    return s;
  } catch (e) {
    return Object.assign({}, SETTINGS_DEFAULTS);
  }
}

function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function applySettings() {
  document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
  document.documentElement.style.setProperty('--content-width', settings.width + 'px');
  document.documentElement.style.setProperty('--label-font-size', settings.labelFontSize + 'px');
  document.documentElement.style.setProperty('--status-font-size', settings.statusFontSize + 'px');
  document.documentElement.setAttribute('data-theme', settings.theme === 'light' ? 'light' : 'dark');
  // Purely cosmetic — the pinnedToBottom/autoScrolling logic around
  // scrollBottom() is correct either way, see the comment there.
  feed.style.scrollBehavior = settings.autoScrollAnim === 'instant' ? 'auto' : 'smooth';
  const tsHidden = settings.tsFormat === 'hidden';
  ts24hRow.classList.toggle('disabled', tsHidden);
  tsTzRow.classList.toggle('disabled', tsHidden);
  ts24h.disabled = tsHidden;
  tsTz.disabled = tsHidden;
  refreshTimestamps();
  refreshModelNames();
  renderPlanUsage();
  applyThinkingMode();
  applyToolsMode();
}
